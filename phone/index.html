s include: -3D visualisation of BIM model -Assign dismantling task sequences for selective elements -Virtual simulations"},"t5.1":{"name":"Quality checking and data model completeness","about":"Much of the BIM models that are available are created for a specific purpose (design coordination, clash detection) and they are rarely usable for secondary purposes (e.g."}},"iso":{"roles":[{"key":"appointing","name":"appointing party","about":"Receives the information. The client for this appointment."},{"key":"lead","name":"lead appointed party","about":"Appointed directly by the appointing party; coordinates the delivery team."},{"key":"appointed","name":"appointed party","about":"Provides information under an appointment. Designers, contractors, suppliers."},{"key":"third","name":"third party","about":"Outside the project team. Supplies or requires information without being appointed - authorities, funders, certification bodies."}],"stages":[{"key":"s0","num":"0","name":"Strategic Definition","seen":true,"shows":"PIR. Toolkit 1.2 Early design: quick scenario screening to set renovation targets for the PIR."},{"key":"s1","num":"1","name":"Preparation and Briefing","seen":true,"shows":"EIR, project information protocol, project information standard, project information methods and procedures, information management assignment matrix. Toolkit 1.1 ECM catalogue as a shared resource (ISO 19650-2, 5.1.6) and 1.3 BIM upgrading, as-is IFC to baseline model. Then TENDER and APPOINTMENT: BEP pre- and post-appointment, high-level and detailed responsibility matrix, risk register, master information delivery plan."},{"key":"s2","num":"2","name":"Concept Design","seen":true,"shows":"Toolkit 1.2 Early design: compare ECM scenarios on cost-benefit, circularity and energy, to CLIENT SHARED, then a decision. Require: UCM, IDS, bSDD. Communicate: BCF."},{"key":"s3","num":"3","name":"Spatial Coordination","seen":true,"shows":"Check: IDS and validation against the EIR, into PUBLISHED."},{"key":"s4","num":"4","name":"Technical Design","seen":true,"shows":"Toolkit 1.3 BIM upgrading, chosen variant to technical-design level of information need as reference information for the contractor tender. Toolkit 1.1 ECM catalogue reused, ECM specifications referenced in the EIR via IDS and bSDD. Second TENDER and APPOINTMENT. Right-hand edge of the crop: this column is only half visible."},{"key":"s5","num":"5","name":"Manufacturing and Construction","seen":false,"shows":""},{"key":"s6","num":"6","name":"Handover","seen":false,"shows":""},{"key":"s7","num":"7","name":"Use","seen":false,"shows":""},{"key":"sx","num":"—","name":"Beyond the standard","seen":false,"shows":""}],"role_by_hluc":{"HLUC1":{"SG4":"appointing","SG1":"lead","SG7":"appointed","SG11":"appointed","SG9":"appointed","SG5":"appointed","SG13":"appointed","SG14":"appointed","SG10":"third"},"HLUC2":{"SG4":"appointing","SG9":"appointing","SG1":"lead","SG5":"lead","SG11":"appointed","SG13":"appointed","SG14":"appointed","SG7":"appointed"},"HLUC3":{"SG4":"appointing","SG9":"lead","SG7":"appointed","SG8":"appointed","SG11":"appointed","SG5":"appointed","SG1":"appointed","SG14":"appointed"},"HLUC4":{"SG4":"appointing","SG5":"lead","SG14":"appointed","SG13":"appointed","SG1":"appointed","SG9":"appointed","SG11":"appointed","SG12":"third","SG3":"third","SG10":"third"}},"sg_name":{"SG1":"architects and engineers","SG3":"building certification and standards bodies","SG4":"building owners","SG5":"contractors","SG7":"energy consultants","SG8":"energy utility companies and ESCOs","SG9":"facility operators","SG10":"financial actors","SG11":"IT providers and BIM integrators","SG12":"local governments and public bodies","SG13":"material suppliers and manufacturers","SG14":"waste and recycling firms"},"delivery_steps":[{"clause":"5.1","name":"Assessment and need","who":["High","Nil","Nil"],"ours":"HLUC1-A1","note":"Covered, under our own wording. A1 agrees the goals and what to assess, which is 5.1.2 establishing the project's information requirements."},{"clause":"5.2","name":"Invitation to tender","who":["High","Nil","Nil"],"ours":null,"note":"Nothing. This is where the appointing party issues its exchange information requirements and the tender evaluation criteria."},{"clause":"5.3","name":"Tender response","who":["Low","High","Medium"],"ours":null,"note":"Nothing. The delivery team's pre-appointment BEP, its capability and capacity, its mobilization plan and its risk register are all produced here."},{"clause":"5.4","name":"Appointment","who":["Medium","High","Medium"],"ours":null,"note":"Nothing. The BEP is confirmed, the detailed responsibility matrix and the master information delivery plan are agreed, and the lead appointed party issues its own exchange information requirements downstream."},{"clause":"5.5","name":"Mobilization","who":["Low","High","Medium"],"ours":null,"note":"Nothing. Resources and information technology are mobilized and the production methods and procedures are tested before work starts."},{"clause":"5.6","name":"Collaborative production of information","who":["Low","High","High"],"ours":"HLUC1-A2 onwards","note":"Covered in detail. Most of our 115 exchanges are 5.6: check reference information, generate, quality-assure, review and approve for sharing."},{"clause":"5.7","name":"Information model delivery","who":["Medium","High","High"],"ours":"HLUC2-A6, HLUC2-A7","note":"Covered. A6 assembles and submits, A7 is the appointing party's acceptance (5.7.4)."},{"clause":"5.8","name":"Project close-out","who":["High","Medium","Nil"],"ours":null,"note":"Partly. A7 transfers responsibility, but 5.8.1 archive the project information model and 5.8.2 compile lessons learnt have no counterpart."}],"step_parties":["appointing party","lead appointed party","appointed party / task team"],"containers":[{"code":"OIR","name":"Organizational information requirements","step":"5.1","note":"Referred to by ISO 19650-2 but not generated by it. Absent, and that is correct: it belongs to the owner organisation, not the project."},{"code":"AIR","name":"Asset information requirements","step":"5.1","note":"HLUC2-A1 is AIR work - what to record during construction for operation - written as an activity rather than as a requirement set."},{"code":"PIR","name":"Project information requirements","step":"5.1","note":"HLUC1-A1 does this work without naming it."},{"code":"IDM","name":"Project's information delivery milestones","step":"5.1","note":"Absent. Our activities have an order but no milestones."},{"code":"PIS","name":"Project's information standard","step":"5.1","note":"Absent."},{"code":"PIPMP","name":"Project's information production methods and procedures","step":"5.1","note":"Absent."},{"code":"REF","name":"Project's reference information and shared resources","step":"5.1","note":"This is where the ECM catalogue sits - toolkit 1.1, cited on the partners' drawing as ISO 19650-2 clause 5.1.6."},{"code":"CDE","name":"Project's common data environment","step":"5.1","note":"Named as a tool (CDE-s, CDE-d) but no exchange says which state a container is in."},{"code":"PIP","name":"Project's information protocol","step":"5.1","note":"Absent."},{"code":"EIR","name":"Exchange information requirements","step":"5.2","note":"Implied by HLUC1-A1-E4 and HLUC2-A1, never written as a deliverable."},{"code":"TRR","name":"Tender response requirements and evaluation criteria","step":"5.2","note":"Absent, with the whole tender step."},{"code":"BEPpre","name":"Delivery team's pre-appointment BIM execution plan","step":"5.3","note":"Absent."},{"code":"CAP","name":"Summary of the delivery team's capability and capacity","step":"5.3","note":"Absent."},{"code":"MOB","name":"Proposed mobilization plan","step":"5.3","note":"Absent."},{"code":"RR","name":"Risk register","step":"5.3","note":"Absent."},{"code":"BEP","name":"Delivery team's BIM execution plan","step":"5.4","note":"Absent."},{"code":"HLRM","name":"High-level responsibility matrix","step":"5.3/5.4","note":"Our 'Participants' text carries some of this, unstructured."},{"code":"DRM","name":"Detailed responsibility matrix","step":"5.4","note":"Absent. This is the one that says who produces each container."},{"code":"MIDP","name":"Master information delivery plan","step":"5.4","note":"Absent."},{"code":"TIDP","name":"Task information delivery plan","step":"5.4","note":"Absent."},{"code":"PIM","name":"Project information model","step":"5.6/5.7","note":"The BIM model our exchanges pass around, unnamed."},{"code":"AIM","name":"Asset information model","step":"5.7","note":"HLUC3-A1 builds one: records linked to equipment and monitoring sources."}],"cde_states":[{"name":"work in progress","about":"Being developed by its originator or task team, not visible to or accessible by anyone else."},{"name":"shared","about":"Approved for sharing with other appropriate task teams and delivery teams, or with the appointing party."},{"name":"published","about":"Authorized for use in more detailed design, for construction or for asset management."},{"name":"archive","about":"A journal of information transactions, providing an audit trail of how the container developed."}],"cde_in_diagram":["PUBLISHED","CLIENT SHARED","SHARED"],"cde_note":"The drawing shows PUBLISHED, CLIENT SHARED and SHARED. Only two of those are states. The guidance defines SHARED as approved for sharing with other task teams and delivery teams <b>or with the appointing party</b> - so <i>client shared</i> is a SHARED container whose audience is the client, not a fourth state beside them. Keep it as a label if it helps, but not as a state, and add the two the drawing leaves out: work in progress and archive.","triad":[{"name":"Require","tools":"UCM, IDS, bSDD","about":"State what information is needed, machine-readable."},{"name":"Communicate","tools":"BCF","about":"Carry issues and comments between tools."},{"name":"Check","tools":"IDS, validation","about":"Test a delivered model against what was required."}],"source":"ISO/Process_Design-Bid-Build.png, a cropped screen capture supplied by the partners. Stages 0 to 4 and two lanes are visible; stages 5 to 7 and any further lane are off the edge of the crop and are named here from the RIBA Plan of Work 2020, not read from the file."}};
const CONTEXT_HTML = "<div class=\"cx-hero\">\n  <div class=\"cx-eyebrow\">Task 3.1 &middot; Deliverable D3.1 &middot; for partner review</div>\n  <h1>A proposed workflow for lean circular energy renovation</h1>\n  <p class=\"cx-lead\">This is a <b>normative</b> description of <b>lean circular energy\n  renovation</b>: how the workflow could run in an ideal world, where all the barriers we\n  found in the survey and the literature are removed. We are asking you to tell us <b>where it\n  can be improved</b>, where it is missing something, and where it does not match how you\n  actually work.</p>\n</div>\n\n<div class=\"cx-sec\" id=\"sec-overview-head\">\n  <h2>1 &middot; Overview</h2>\n  <span>The whole workflow on one page, before any of the detail</span>\n</div>\n\n<div class=\"cx-grid\">\n\n<section class=\"cx-card cx-wide\" id=\"sec-overview\">\n  <h2>The whole workflow on one page</h2>\n  <p>Four phases, and in each one the things that actually get produced. Time runs\n  left to right, each band says who leads it, and the arrow between two bands names\n  what has to cross. <b>16 things, three handovers.</b> The 27 activities and 115\n  information exchanges sit behind them &mdash; switch them on when you want them.</p>\n  <div class=\"ovsw\">\n    <label><input type=\"checkbox\" id=\"swTools\"> Toolkit IDs</label>\n    <label><input type=\"checkbox\" id=\"swActs\"> Activities</label>\n  </div>\n  <p class=\"ovhint\">Hover anything in the picture for what it is. Click it to see the\n  information exchanges behind it &mdash; a box opens the activities it covers, an\n  activity opens its own page, a toolkit tag lists every exchange in the whole\n  workflow that names that tool.</p>\n  <div id=\"ovcanvas\"></div>\n  <div class=\"ovlg\">\n    <dl><div><dt>t1.1</dt><dd>ECM catalogue</dd></div><div><dt>t1.2</dt><dd>Early design tool</dd></div><div><dt>t1.3</dt><dd>BIM upgrade</dd></div><div><dt>t2.1</dt><dd>Material passport</dd></div><div><dt>t2.2</dt><dd>Building logbook</dd></div><div><dt>t3.1</dt><dd>Energy profiling</dd></div><div><dt>t3.2</dt><dd>IEQ simulation</dd></div><div><dt>t3.3</dt><dd>SRI and O&amp;M services</dd></div><div><dt>t4.1</dt><dd>Circular value flows</dd></div><div><dt>t4.2</dt><dd>Dismantling planner</dd></div><div><dt>t5.1</dt><dd>Quality checking, IDS</dd></div><div><dt>t5.2</dt><dd>BIM2BEM</dd></div><div><dt>CDE-d</dt><dd>Dynamic CDE</dd></div><div><dt>CDT</dt><dd>Construction twin</dd></div><div><dt>BDT</dt><dd>Building twin</dd></div><div><dt>Orch.</dt><dd>DTERBIM Orchestrator</dd></div></dl>\n    <p class=\"ovkey\">Solid tag = documented contribution. Dashed tag = a link we\n    still have to confirm &mdash; telling us which of those are real is one of the\n    most useful things you can do here.</p>\n    <p class=\"ovkey\">Three boxes cover more than one activity, so their tags are a\n    combined list: a tool shown on <i>Scenarios</i> contributes to one of A5 or A6,\n    not necessarily to both.</p>\n  </div>\n</section>\n\n</div>\n\n<!--PAGE-BREAK-->\n\n<div class=\"cx-sec\" id=\"sec-background\">\n  <h2>2 &middot; Background</h2>\n  <span>What this is, how it is built, and the standards it is being lined up against</span>\n</div>\n\n<div class=\"bgnav\">\n  <label for=\"bgSub\">Page</label>\n  <select id=\"bgSub\">\n    <option value=\"main\" selected>How the workflow was built</option>\n    <option value=\"iso\">ISO 19650 &mdash; where our workflow sits on the standard</option>\n    <option value=\"bsi\">buildingSMART &mdash; the openBIM pieces the map uses</option>\n  </select>\n</div>\n\n<div class=\"cx-grid bgpage\" data-bg=\"iso\" hidden>\n\n<section class=\"cx-card cx-wide\">\n  <h2>Why we line this up against ISO 19650</h2>\n  <p>Partners asked us to follow the wording of the standard and to take up the\n  <b>Design&ndash;Bid&ndash;Build process map</b> they produced. This page is that work.\n  It is here for four reasons, and none of them is conformance for its own sake.</p>\n  <ul>\n    <li><b>So the workflow can be read by people who did not write it.</b> ISO 19650\n    is the vocabulary our partners, their clients and their regulators already use.\n    A workflow written in our own terms is a workflow only we can check.</li>\n    <li><b>So the gaps become visible.</b> Laying our 27 activities over the\n    standard&rsquo;s eight steps is what showed that four of those steps &mdash;\n    tender, tender response, appointment and mobilization &mdash; have no counterpart\n    in our workflow at all. We would not have found that by reading our own text.</li>\n    <li><b>So D3.1 can say what is ours.</b> The deconstruction and recovery phase\n    falls outside both parts of the standard. That is a contribution of this project,\n    but only if we can show exactly where the standard stops.</li>\n    <li><b>So tasks 3.2 to 3.5 inherit something usable.</b> The BPMN model, the\n    information delivery specifications and the tool work all need a stable set of\n    names for who holds what role and what gets handed over.</li>\n  </ul>\n  <p><b>What it does not mean.</b> We are not claiming the workflow is ISO 19650\n  compliant, and we are not asking you to review it against the standard. If the\n  wording of a role or a deliverable looks wrong to you in practice, say so &mdash;\n  practice wins, and we record the difference.</p>\n</section>\n\n\n<style>\n.isoscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0 6px;\n  border:1px solid var(--line);border-radius:10px;background:var(--card)}\n.isogrid{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:780px;width:100%}\n.isogrid th,.isogrid td{padding:8px 9px;border-bottom:1px solid var(--hair);\n  border-right:1px solid var(--hair);vertical-align:top;text-align:left}\n.isogrid thead th{background:var(--wash);color:var(--teal);font-weight:700;\n  font-size:11.5px;line-height:1.3;position:sticky;top:0;z-index:2}\n.isogrid .isonum{display:block;font-size:17px;line-height:1;color:var(--fjord);margin-bottom:3px}\n.isogrid th.isocorner{background:var(--teal);color:#fff;font-size:11px;min-width:150px;\n  position:sticky;left:0;z-index:3}\n.isogrid th.isorole,.isogrid th.isosg{background:var(--card);position:sticky;left:0;z-index:1;\n  font-weight:700;color:var(--ink);min-width:150px;border-right:2px solid var(--line)}\n.isogrid th.isosg span{display:block;font-weight:400;color:var(--mute);font-size:11px}\n.isogrid td.isoempty{background:repeating-linear-gradient(135deg,#fff,#fff 6px,#fafcfc 6px,#fafcfc 12px)}\n.isoact{display:block;margin-bottom:4px;line-height:1.45}\n.isoact b{color:var(--fjord);font-weight:700;letter-spacing:.1px}\n.isoact i{font-style:normal;display:inline-block;background:var(--wash);color:var(--teal);\n  border-radius:4px;padding:0 4px;margin-left:2px;font-size:11px}\n.isoflag{display:inline-block;margin-left:5px;padding:1px 5px;border-radius:999px;\n  background:#FBEDE4;color:var(--chg);font-size:9.5px;font-weight:700;\n  text-transform:uppercase;letter-spacing:.3px;vertical-align:middle}\nth.isoguess{background:#FDF6F1}\n.isocap{font-size:12px;color:var(--mute);margin:2px 0 0}\n.isomute{color:var(--mute)}\n#sec-iso h3{margin:22px 0 4px;font-size:15px;color:var(--teal)}\n.isotab{font-size:13px}\n.isotab td.isocl{font-weight:700;color:var(--fjord);white-space:nowrap}\n.isotab tr.isogap td{background:#FDF4F1}\n.isonone{color:var(--no);font-weight:700}\n.isotab td.isoours{white-space:nowrap}\n.isotab td.isostep{white-space:nowrap;color:var(--mute)}\n.isosteps{min-width:900px}\n.isowh{font-size:10.5px;line-height:1.25;max-width:84px}\ntd.isow{text-align:center;font-size:11px;font-weight:700;white-space:nowrap}\ntd.isow-high{background:#E6F0F4;color:var(--teal)}\ntd.isow-medium{background:#F1F6F3;color:var(--ok)}\ntd.isow-low{background:#FAFBFB;color:var(--mute)}\ntd.isow-nil{background:#FAFBFB;color:var(--na);font-weight:400}\n.isoroles td{text-align:center;font-size:11.5px;white-space:nowrap}\n.isor-appointing{background:#E6F0F4;color:var(--teal);font-weight:700}\n.isor-lead{background:#EAF5EE;color:var(--ok);font-weight:700}\n.isor-appointed{background:var(--card);color:var(--ink)}\n.isor-third{background:#FBEDE4;color:var(--chg)}\n.isor-none{background:#FAFBFB;color:var(--na)}\n.isokey{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;font-size:12px}\n.isokey span{padding:3px 9px;border-radius:999px;border:1px solid var(--line)}\n@media (max-width:820px){ .isogrid{font-size:11.5px} .isogrid th.isocorner,\n  .isogrid th.isorole,.isogrid th.isosg{min-width:112px} }\n</style>\n\n<section class=\"cx-card cx-wide\" id=\"sec-iso\">\n  <h2>Where this workflow sits in ISO 19650</h2>\n  <p>Partners asked us to take up the <b>Design&ndash;Bid&ndash;Build process map</b> and\n  connect it to our own processes. This is that connection, up front, before the\n  workflow itself. It also fixes the vocabulary: from here on an exchange names the\n  <b>ISO 19650 role</b> each party holds, with our own stakeholder group kept in\n  brackets &mdash; <i>appointing party (SG4 building owners)</i>.</p>\n\n  <div class=\"cx-note\"><p><b>Where this comes from.</b> Two sources, kept apart.\n  Everything said here about the standard is read from the <b>UK BIM Framework</b>\n  guidance <i>Information management according to BS EN ISO 19650, Guidance Part 2:\n  Processes for Project Delivery</i>, edition 3, January 2020 &mdash; its clause 5\n  steps, its tables of who does what, and its figure 3 on container states. The\n  <b>stage row below is not from the standard.</b> ISO 19650-2 runs its eight steps\n  once per appointment and does not name project stages; putting them on RIBA stages\n  is the convention the partners&rsquo; drawing uses, and we follow it so the two can\n  be compared.</p>\n  <p><b>What we could read of the drawing.</b> ISO/Process_Design-Bid-Build.png, a cropped screen capture supplied by the partners. Stages 0 to 4 and two lanes are visible; stages 5 to 7 and any further lane are off the edge of the crop and are named here from the RIBA Plan of Work 2020, not read from the file. It shows stages 0, 1, 2, 3, 4 and two lanes;\n  anything further right or further down is off the edge of the crop. Columns marked\n  <span class=\"isoflag\">assumed</span> carry the RIBA Plan of Work 2020 name for that\n  stage, which is correct as a RIBA name but was <b>not</b> read from the\n  partners&rsquo; file. Send the source and we replace them.</p></div>\n\n  <h3>Our exchanges on the stages &times; roles grid</h3>\n  <div class=\"isoscroll\"><table class=\"isogrid\"><thead><tr><th class=\"isocorner\">role in the appointment</th><th class=\"isost\"><span class=\"isonum\">0</span>Strategic Definition</th><th class=\"isost\"><span class=\"isonum\">1</span>Preparation and Briefing</th><th class=\"isost\"><span class=\"isonum\">2</span>Concept Design</th><th class=\"isost\"><span class=\"isonum\">3</span>Spatial Coordination</th><th class=\"isost\"><span class=\"isonum\">4</span>Technical Design</th><th class=\"isost isoguess\"><span class=\"isonum\">5</span>Manufacturing and Construction<span class=\"isoflag\" title=\"Not visible in the cropped file we were given; stage name taken from the RIBA Plan of Work 2020.\">assumed</span></th><th class=\"isost isoguess\"><span class=\"isonum\">6</span>Handover<span class=\"isoflag\" title=\"Not visible in the cropped file we were given; stage name taken from the RIBA Plan of Work 2020.\">assumed</span></th><th class=\"isost isoguess\"><span class=\"isonum\">7</span>Use<span class=\"isoflag\" title=\"Not visible in the cropped file we were given; stage name taken from the RIBA Plan of Work 2020.\">assumed</span></th><th class=\"isost\"><span class=\"isonum\">\u2014</span>Beyond the standard</th></tr></thead><tbody><tr><th class=\"isorole\" title=\"Receives the information. The client for this appointment.\">appointing party</th><td><span class=\"isoact\"><b>HLUC1-A1</b> <i>E1</i> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC1-A2</b> <i>E2</i></span></td><td><span class=\"isoact\"><b>HLUC1-A5</b> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC1-A7</b> <i>E2</i> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC2-A1</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC2-A2</b> <i>E3</i></span></td><td><span class=\"isoact\"><b>HLUC2-A3</b> <i>E2</i></span></td><td><span class=\"isoact\"><b>HLUC2-A6</b> <i>E3</i></span><span class=\"isoact\"><b>HLUC2-A7</b> <i>E1</i> <i>E2</i> <i>E3</i></span></td><td><span class=\"isoact\"><b>HLUC3-A1</b> <i>E4</i></span><span class=\"isoact\"><b>HLUC3-A4</b> <i>E2</i></span></td><td><span class=\"isoact\"><b>HLUC4-A1</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC4-A3</b> <i>E3</i> <i>E5</i></span><span class=\"isoact\"><b>HLUC4-A6</b> <i>E4</i></span></td></tr><tr><th class=\"isorole\" title=\"Appointed directly by the appointing party; coordinates the delivery team.\">lead appointed party</th><td><span class=\"isoact\"><b>HLUC1-A1</b> <i>E3</i></span></td><td><span class=\"isoact\"><b>HLUC1-A2</b> <i>E6</i></span><span class=\"isoact\"><b>HLUC1-A4</b> <i>E1</i></span></td><td><span class=\"isoact\"><b>HLUC1-A5</b> <i>E5</i></span><span class=\"isoact\"><b>HLUC1-A6</b> <i>E1</i> <i>E5</i></span></td><td><span class=\"isoact\"><b>HLUC1-A7</b> <i>E1</i> <i>E3</i></span></td><td><span class=\"isoact\"><b>HLUC1-A8</b> <i>E1</i> <i>E3</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC2-A1</b> <i>E3</i></span><span class=\"isoact\"><b>HLUC2-A2</b> <i>E1</i> <i>E2</i> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC2-A3</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC2-A4</b> <i>E2</i> <i>E3</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC2-A5</b> <i>E1</i> <i>E2</i> <i>E4</i> <i>E5</i></span></td><td><span class=\"isoact\"><b>HLUC2-A6</b> <i>E1</i> <i>E2</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC2-A7</b> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC3-A1</b> <i>E1</i> <i>E2</i></span><span class=\"isoact\"><b>HLUC3-A2</b> <i>E1</i> <i>E2</i> <i>E3</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC3-A3</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC3-A4</b> <i>E1</i> <i>E3</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC3-A5</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC3-A6</b> <i>E2</i> <i>E3</i></span></td><td><span class=\"isoact\"><b>HLUC4-A2</b> <i>E2</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC4-A3</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC4-A4</b> <i>E3</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC4-A5</b> <i>E1</i> <i>E4</i></span><span class=\"isoact\"><b>HLUC4-A6</b> <i>E1</i> <i>E3</i> <i>E5</i></span><span class=\"isoact\"><b>HLUC4-A7</b> <i>E1</i></span></td></tr><tr><th class=\"isorole\" title=\"Provides information under an appointment. Designers, contractors, suppliers.\">appointed party</th><td class=\"isoempty\"></td><td><span class=\"isoact\"><b>HLUC1-A2</b> <i>E1</i> <i>E3</i> <i>E4</i> <i>E5</i></span><span class=\"isoact\"><b>HLUC1-A4</b> <i>E2</i> <i>E3</i> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC1-A5</b> <i>E1</i> <i>E2</i> <i>E3</i></span><span class=\"isoact\"><b>HLUC1-A6</b> <i>E2</i> <i>E3</i> <i>E4</i></span></td><td class=\"isoempty\"></td><td><span class=\"isoact\"><b>HLUC1-A8</b> <i>E2</i></span><span class=\"isoact\"><b>HLUC2-A1</b> <i>E2</i></span></td><td><span class=\"isoact\"><b>HLUC2-A3</b> <i>E3</i></span><span class=\"isoact\"><b>HLUC2-A4</b> <i>E1</i></span><span class=\"isoact\"><b>HLUC2-A5</b> <i>E3</i></span></td><td class=\"isoempty\"></td><td><span class=\"isoact\"><b>HLUC3-A1</b> <i>E3</i></span><span class=\"isoact\"><b>HLUC3-A3</b> <i>E2</i> <i>E3</i></span><span class=\"isoact\"><b>HLUC3-A5</b> <i>E2</i> <i>E3</i></span><span class=\"isoact\"><b>HLUC3-A6</b> <i>E1</i> <i>E4</i></span></td><td><span class=\"isoact\"><b>HLUC4-A1</b> <i>E2</i></span><span class=\"isoact\"><b>HLUC4-A2</b> <i>E1</i> <i>E3</i></span><span class=\"isoact\"><b>HLUC4-A3</b> <i>E2</i></span><span class=\"isoact\"><b>HLUC4-A4</b> <i>E1</i> <i>E2</i></span><span class=\"isoact\"><b>HLUC4-A5</b> <i>E2</i> <i>E3</i></span><span class=\"isoact\"><b>HLUC4-A6</b> <i>E2</i></span><span class=\"isoact\"><b>HLUC4-A7</b> <i>E2</i> <i>E3</i> <i>E4</i></span></td></tr><tr><th class=\"isorole\" title=\"Outside the project team. Supplies or requires information without being appointed - authorities, funders, certification bodies.\">third party</th><td><span class=\"isoact\"><b>HLUC1-A1</b> <i>E2</i></span></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td class=\"isoempty\"></td><td><span class=\"isoact\"><b>HLUC4-A1</b> <i>E3</i></span></td></tr></tbody></table></div><p class=\"isocap\"><b>115</b> information exchanges placed. A cell holds the activity in bold and the exchange numbers within it, so <b>HLUC1-A2</b> <i>E1</i> reads HLUC1-A2-E1. An exchange is drawn in the lane of the party <b>sending</b> it, in the stage of its activity.</p>\n\n  <details class=\"fold sub\">\n    <summary>Why the role is on the exchange and not on the group</summary>\n    <div class=\"foldbody\">\n      <p>An ISO 19650 role is a <b>position in one appointment</b>, not a kind of\n      organisation. The same group changes position between phases: facility\n      operators (SG9) are an appointed party while the building is being designed and\n      sit on the <b>appointing</b> side once they are operating it; contractors (SG5)\n      give advice as an appointed party in HLUC1 and become the <b>lead appointed\n      party</b> for the works in HLUC2 and for the disassembly in HLUC4. A single\n      label on the group would be wrong in at least one phase, which is why the label\n      is written per exchange.</p>\n      <div class=\"isoscroll\"><table class=\"isogrid isoroles\"><thead><tr><th class=\"isocorner\">stakeholder group</th><th title=\"Assess the building and select renovation measures\">HLUC1</th><th title=\"Carry out the renovation and hand over building information\">HLUC2</th><th title=\"Monitor building performance and manage maintenance\">HLUC3</th><th title=\"Plan deconstruction and material recovery\">HLUC4</th></tr></thead><tbody><tr><th class=\"isosg\">SG1 <span>architects and engineers</span></th><td class=\"isor-lead\">lead appointed</td><td class=\"isor-lead\">lead appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td></tr><tr><th class=\"isosg\">SG3 <span>building certification and standards bodies</span></th><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-third\">third party</td></tr><tr><th class=\"isosg\">SG4 <span>building owners</span></th><td class=\"isor-appointing\">appointing</td><td class=\"isor-appointing\">appointing</td><td class=\"isor-appointing\">appointing</td><td class=\"isor-appointing\">appointing</td></tr><tr><th class=\"isosg\">SG5 <span>contractors</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-lead\">lead appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-lead\">lead appointed</td></tr><tr><th class=\"isosg\">SG7 <span>energy consultants</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-none\">\u2013</td></tr><tr><th class=\"isosg\">SG8 <span>energy utility companies and ESCOs</span></th><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-none\">\u2013</td></tr><tr><th class=\"isosg\">SG9 <span>facility operators</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointing\">appointing</td><td class=\"isor-lead\">lead appointed</td><td class=\"isor-appointed\">appointed</td></tr><tr><th class=\"isosg\">SG10 <span>financial actors</span></th><td class=\"isor-third\">third party</td><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-third\">third party</td></tr><tr><th class=\"isosg\">SG11 <span>IT providers and BIM integrators</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td></tr><tr><th class=\"isosg\">SG12 <span>local governments and public bodies</span></th><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-none\">\u2013</td><td class=\"isor-third\">third party</td></tr><tr><th class=\"isosg\">SG13 <span>material suppliers and manufacturers</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-none\">\u2013</td><td class=\"isor-appointed\">appointed</td></tr><tr><th class=\"isosg\">SG14 <span>waste and recycling firms</span></th><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td><td class=\"isor-appointed\">appointed</td></tr></tbody></table></div>\n      <div class=\"isokey\">\n        <span class=\"isor-appointing\">appointing party</span>\n        <span class=\"isor-lead\">lead appointed party</span>\n        <span class=\"isor-appointed\">appointed party</span>\n        <span class=\"isor-third\">third party</span>\n        <span class=\"isor-none\">does not appear</span>\n      </div>\n    </div>\n  </details>\n\n  <h3>Which part of the standard applies at all</h3>\n  <table class=\"cx-table isotab\"><thead><tr><th>Use case</th><th></th>\n    <th>Part</th><th>Comment</th></tr></thead><tbody><tr><td class=\"isocl\">HLUC1</td><td>Assess the building and select renovation measures</td><td>ISO 19650-2</td><td>Delivery phase. Our activities sit in 5.1 assessment and need (A1) and 5.6 collaborative production of information (A2 onwards).</td></tr><tr><td class=\"isocl\">HLUC2</td><td>Carry out the renovation and hand over building information</td><td>ISO 19650-2</td><td>Delivery phase, continued: 5.6 collaborative production, then 5.7 information model delivery (A6, A7) and 5.8 project close-out.</td></tr><tr><td class=\"isocl\">HLUC3</td><td>Monitor building performance and manage maintenance</td><td>ISO 19650-3</td><td>Operational phase. The project information model has become the asset information model; work is triggered by events rather than by stages.</td></tr><tr><td class=\"isocl\">HLUC4</td><td>Plan deconstruction and material recovery</td><td><span class=\"isonone\">neither part</span></td><td>Neither part covers planning a deconstruction or the information needed to recover materials. We are extending the standard here, not applying it.</td></tr></tbody></table>\n  <p class=\"isocap\">HLUC4 is the one to look at. Neither part of ISO 19650 covers\n  planning a deconstruction or the information needed to recover materials, so for\n  the whole of that use case we are <b>extending</b> the standard rather than\n  applying it. That is worth saying out loud in D3.1 instead of leaving it to be\n  discovered.</p>\n\n  <h3>Steps the standard has that we do not</h3>\n  <p>ISO 19650-2 clause 5 runs the delivery phase as eight steps, <b>once per\n  appointment</b>. Our 27 activities cover three of them.</p>\n  <div class=\"isoscroll\"><table class=\"cx-table isotab isosteps\"><thead><tr><th>Clause</th><th>Step</th><th class=\"isowh\">appointing party</th><th class=\"isowh\">lead appointed party</th><th class=\"isowh\">appointed party / task team</th><th>In our workflow</th><th>Comment</th></tr></thead><tbody><tr class=\"\"><td class=\"isocl\">5.1</td><td>Assessment and need</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-nil\">Nil</td><td class=\"isow isow-nil\">Nil</td><td class=\"isoours\">HLUC1-A1</td><td>Covered, under our own wording. A1 agrees the goals and what to assess, which is 5.1.2 establishing the project&#x27;s information requirements.</td></tr><tr class=\"isogap\"><td class=\"isocl\">5.2</td><td>Invitation to tender</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-nil\">Nil</td><td class=\"isow isow-nil\">Nil</td><td class=\"isoours\"><span class=\"isonone\">nothing</span></td><td>Nothing. This is where the appointing party issues its exchange information requirements and the tender evaluation criteria.</td></tr><tr class=\"isogap\"><td class=\"isocl\">5.3</td><td>Tender response</td><td class=\"isow isow-low\">Low</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-medium\">Medium</td><td class=\"isoours\"><span class=\"isonone\">nothing</span></td><td>Nothing. The delivery team&#x27;s pre-appointment BEP, its capability and capacity, its mobilization plan and its risk register are all produced here.</td></tr><tr class=\"isogap\"><td class=\"isocl\">5.4</td><td>Appointment</td><td class=\"isow isow-medium\">Medium</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-medium\">Medium</td><td class=\"isoours\"><span class=\"isonone\">nothing</span></td><td>Nothing. The BEP is confirmed, the detailed responsibility matrix and the master information delivery plan are agreed, and the lead appointed party issues its own exchange information requirements downstream.</td></tr><tr class=\"isogap\"><td class=\"isocl\">5.5</td><td>Mobilization</td><td class=\"isow isow-low\">Low</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-medium\">Medium</td><td class=\"isoours\"><span class=\"isonone\">nothing</span></td><td>Nothing. Resources and information technology are mobilized and the production methods and procedures are tested before work starts.</td></tr><tr class=\"\"><td class=\"isocl\">5.6</td><td>Collaborative production of information</td><td class=\"isow isow-low\">Low</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-high\">High</td><td class=\"isoours\">HLUC1-A2 onwards</td><td>Covered in detail. Most of our 115 exchanges are 5.6: check reference information, generate, quality-assure, review and approve for sharing.</td></tr><tr class=\"\"><td class=\"isocl\">5.7</td><td>Information model delivery</td><td class=\"isow isow-medium\">Medium</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-high\">High</td><td class=\"isoours\">HLUC2-A6, HLUC2-A7</td><td>Covered. A6 assembles and submits, A7 is the appointing party&#x27;s acceptance (5.7.4).</td></tr><tr class=\"isogap\"><td class=\"isocl\">5.8</td><td>Project close-out</td><td class=\"isow isow-high\">High</td><td class=\"isow isow-medium\">Medium</td><td class=\"isow isow-nil\">Nil</td><td class=\"isoours\"><span class=\"isonone\">nothing</span></td><td>Partly. A7 transfers responsibility, but 5.8.1 archive the project information model and 5.8.2 compile lessons learnt have no counterpart.</td></tr></tbody></table></div><p class=\"isocap\">The three middle columns are how hard each party works at that step, from the guidance&rsquo;s own tables 4, 7 and 9.</p>\n  <p class=\"isocap\">The four missing steps are one block: <b>tender, tender response,\n  appointment and mobilization</b>. The partners&rsquo; map shows a TENDER and an\n  APPOINTMENT gate twice over. Our workflow opens with the parties already in the\n  room and the goals being agreed, so the point at which exchange information\n  requirements are issued and a responsibility matrix is fixed never happens. For a\n  <i>lean</i> workflow that is a real omission: it is the step that decides what\n  everybody downstream is obliged to deliver.</p>\n\n  <h3>What the standard asks to be produced</h3>\n  <p>Every resource ISO 19650-2 generates, at the step that generates it, and\n  whether we produce anything like it.</p>\n  <div class=\"isoscroll\"><table class=\"cx-table isotab\"><thead><tr><th>Code</th><th>Resource</th><th>Step</th><th>In our workflow</th></tr></thead><tbody><tr class=\"\"><td class=\"isocl\">OIR</td><td>Organizational information requirements</td><td class=\"isostep\">5.1</td><td>Referred to by ISO 19650-2 but not generated by it. Absent, and that is correct: it belongs to the owner organisation, not the project.</td></tr><tr class=\"\"><td class=\"isocl\">AIR</td><td>Asset information requirements</td><td class=\"isostep\">5.1</td><td>HLUC2-A1 is AIR work - what to record during construction for operation - written as an activity rather than as a requirement set.</td></tr><tr class=\"\"><td class=\"isocl\">PIR</td><td>Project information requirements</td><td class=\"isostep\">5.1</td><td>HLUC1-A1 does this work without naming it.</td></tr><tr class=\"isogap\"><td class=\"isocl\">IDM</td><td>Project&#x27;s information delivery milestones</td><td class=\"isostep\">5.1</td><td>Absent. Our activities have an order but no milestones.</td></tr><tr class=\"isogap\"><td class=\"isocl\">PIS</td><td>Project&#x27;s information standard</td><td class=\"isostep\">5.1</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">PIPMP</td><td>Project&#x27;s information production methods and procedures</td><td class=\"isostep\">5.1</td><td>Absent.</td></tr><tr class=\"\"><td class=\"isocl\">REF</td><td>Project&#x27;s reference information and shared resources</td><td class=\"isostep\">5.1</td><td>This is where the ECM catalogue sits - toolkit 1.1, cited on the partners&#x27; drawing as ISO 19650-2 clause 5.1.6.</td></tr><tr class=\"\"><td class=\"isocl\">CDE</td><td>Project&#x27;s common data environment</td><td class=\"isostep\">5.1</td><td>Named as a tool (CDE-s, CDE-d) but no exchange says which state a container is in.</td></tr><tr class=\"isogap\"><td class=\"isocl\">PIP</td><td>Project&#x27;s information protocol</td><td class=\"isostep\">5.1</td><td>Absent.</td></tr><tr class=\"\"><td class=\"isocl\">EIR</td><td>Exchange information requirements</td><td class=\"isostep\">5.2</td><td>Implied by HLUC1-A1-E4 and HLUC2-A1, never written as a deliverable.</td></tr><tr class=\"isogap\"><td class=\"isocl\">TRR</td><td>Tender response requirements and evaluation criteria</td><td class=\"isostep\">5.2</td><td>Absent, with the whole tender step.</td></tr><tr class=\"isogap\"><td class=\"isocl\">BEPpre</td><td>Delivery team&#x27;s pre-appointment BIM execution plan</td><td class=\"isostep\">5.3</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">CAP</td><td>Summary of the delivery team&#x27;s capability and capacity</td><td class=\"isostep\">5.3</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">MOB</td><td>Proposed mobilization plan</td><td class=\"isostep\">5.3</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">RR</td><td>Risk register</td><td class=\"isostep\">5.3</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">BEP</td><td>Delivery team&#x27;s BIM execution plan</td><td class=\"isostep\">5.4</td><td>Absent.</td></tr><tr class=\"\"><td class=\"isocl\">HLRM</td><td>High-level responsibility matrix</td><td class=\"isostep\">5.3/5.4</td><td>Our &#x27;Participants&#x27; text carries some of this, unstructured.</td></tr><tr class=\"isogap\"><td class=\"isocl\">DRM</td><td>Detailed responsibility matrix</td><td class=\"isostep\">5.4</td><td>Absent. This is the one that says who produces each container.</td></tr><tr class=\"isogap\"><td class=\"isocl\">MIDP</td><td>Master information delivery plan</td><td class=\"isostep\">5.4</td><td>Absent.</td></tr><tr class=\"isogap\"><td class=\"isocl\">TIDP</td><td>Task information delivery plan</td><td class=\"isostep\">5.4</td><td>Absent.</td></tr><tr class=\"\"><td class=\"isocl\">PIM</td><td>Project information model</td><td class=\"isostep\">5.6/5.7</td><td>The BIM model our exchanges pass around, unnamed.</td></tr><tr class=\"\"><td class=\"isocl\">AIM</td><td>Asset information model</td><td class=\"isostep\">5.7</td><td>HLUC3-A1 builds one: records linked to equipment and monitoring sources.</td></tr></tbody></table></div>\n\n  <details class=\"fold sub\">\n    <summary>Two smaller things we should decide</summary>\n    <div class=\"foldbody\">\n      <p><b>States in the common data environment.</b> An information container has\n      four states, and only four:</p>\n      <ul><li><b>work in progress</b> &mdash; Being developed by its originator or task team, not visible to or accessible by anyone else.</li><li><b>shared</b> &mdash; Approved for sharing with other appropriate task teams and delivery teams, or with the appointing party.</li><li><b>published</b> &mdash; Authorized for use in more detailed design, for construction or for asset management.</li><li><b>archive</b> &mdash; A journal of information transactions, providing an audit trail of how the container developed.</li></ul>\n      <p>The drawing shows PUBLISHED, CLIENT SHARED and SHARED. Only two of those are states. The guidance defines SHARED as approved for sharing with other task teams and delivery teams <b>or with the appointing party</b> - so <i>client shared</i> is a SHARED container whose audience is the client, not a fourth state beside them. Keep it as a label if it helps, but not as a state, and add the two the drawing leaves out: work in progress and archive.</p>\n      <p>Our own exchanges carry <b>no state at all</b>, and a state is what makes an\n      exchange auditable: it says whether what was handed over had been checked, and\n      by whom.</p>\n      <p><b>Require, communicate, check.</b> The drawing groups the openBIM tools by\n      buildingSMART&rsquo;s triad:</p>\n      <ul><li><b>Require</b> &mdash; State what information is needed, machine-readable. <span class=\"isomute\">UCM, IDS, bSDD</span></li><li><b>Communicate</b> &mdash; Carry issues and comments between tools. <span class=\"isomute\">BCF</span></li><li><b>Check</b> &mdash; Test a delivered model against what was required. <span class=\"isomute\">IDS, validation</span></li></ul>\n      <p>Our <i>relevant tools</i> column already carries this idea with no name for\n      it. Labelling each tool entry with one of the three would cost nothing and\n      would say what the tool is doing at that point.</p>\n    </div>\n  </details>\n</section>\n\n</div>\n\n<div class=\"cx-grid bgpage\" data-bg=\"bsi\" hidden>\n\n<section class=\"cx-card cx-wide\">\n  <h2>buildingSMART, and where it shows up in the map</h2>\n  <p>The Design&ndash;Bid&ndash;Build map is not purely an ISO 19650 drawing. Two of\n  its columns are headed with the <b>buildingSMART International</b> mark, at the\n  point where a delivery team has to state what it needs and again at the point\n  where what came back is checked. The openBIM standards do the work that ISO 19650\n  only describes: the standard says an exchange information requirement must exist,\n  buildingSMART says what one looks like in a form software can act on.</p>\n\n  <h3>The three jobs</h3>\n  <p>The map groups the openBIM pieces into buildingSMART&rsquo;s own triad, and it is\n  worth learning because it answers &ldquo;what is this tool for&rdquo; in one word.</p>\n  <ul>\n    <li><b>Require</b> &mdash; state what information is needed, so a machine can read\n    it. <b>IDS</b> (Information Delivery Specification) is the requirement itself;\n    <b>bSDD</b> (buildingSMART Data Dictionary) supplies the agreed terms it refers to;\n    <b>UCM</b> (Use Case Management) is where a use case like ours gets written down in\n    a shareable form.</li>\n    <li><b>Communicate</b> &mdash; carry issues and comments between tools without\n    sending screenshots. <b>BCF</b> (BIM Collaboration Format) does this, and it is the\n    one openBIM format most practitioners meet first.</li>\n    <li><b>Check</b> &mdash; test what was delivered against what was required. The same\n    <b>IDS</b> file that stated the requirement is what the validator runs. That is the\n    point of IDS: the requirement and the test are one document.</li>\n  </ul>\n  <p>Underneath all three sits <b>IFC</b>, the neutral model format. Our survey found\n  IFC is the one openBIM standard most respondents recognise, while IDS and bSDD are\n  known to very few &mdash; which is worth remembering before the workflow leans on\n  them.</p>\n\n  <h3>How this connects to our workflow</h3>\n  <p>Three of the toolkit tools sit squarely on this triad: <b>t5.1 quality checking</b>\n  is the <i>check</i> step and is built on IDS, <b>t1.1 the ECM catalogue</b> is a\n  <i>require</i> resource in ISO terms &mdash; the project&rsquo;s reference information\n  and shared resources &mdash; and the exchanges that pass issues back for correction\n  are <i>communicate</i>. Our <i>relevant tools</i> column already carries this idea\n  with no name for it, and labelling each entry with one of the three would cost\n  nothing.</p>\n\n  <div class=\"cx-note\">\n    <p><b>Open question, for Piotr.</b> We understand the Design&ndash;Bid&ndash;Build\n    map came out of a buildingSMART workshop, but we have not been able to find the\n    source and we do not want to cite something we cannot point at. Two things would\n    help: <b>where the map came from</b>, so D3.1 can credit it properly, and\n    <b>the file itself</b> &mdash; what we were given is a cropped screen capture, so\n    stages 5 to 7 and any lane below the architect are off the edge and had to be\n    filled in from the RIBA Plan of Work instead of read from your drawing.</p>\n  </div>\n</section>\n\n</div>\n\n<div class=\"cx-grid bgpage\" data-bg=\"main\">\n\n  <section class=\"cx-card cx-wide\">\n    <h2>Approach, and why it looks so complete</h2>\n    <p>This is the <b>to-be</b> version of the workflow: <b>normative</b>, built from the\n    literature on lean construction, circularity and BIM-based renovation, and from what\n    practitioners across the value chain told us in the survey about current practice,\n    information needs and the barriers they meet. It is the ideal case, written out in full.</p>\n\n    <details class=\"fold sub\">\n      <summary>Why we wrote out every step</summary>\n      <div class=\"foldbody\">\n        <p>It is deliberately comprehensive. <b>We fully acknowledge that no real project\n        follows every single step, in this order, in the way described here.</b> Steps get\n        skipped, merged, reordered or done informally, and that is normal. The workflow is not\n        a prescription and <b>it is not an audit checklist</b>: nobody will be measured against\n        it, and a step you do not recognise is not a finding against you.</p>\n        <p>Setting it out completely is what makes it useful: a normative workflow lets us see\n        <b>what a user could potentially need at each point</b>, and therefore <b>where the\n        DTERBIM tools could help with those needs</b>. A gap only becomes visible once the ideal\n        case is written down. So when you review, the question is not &ldquo;do we do\n        this?&rdquo; but &ldquo;is this right, and is this where information is actually\n        needed?&rdquo;</p>\n      </div>\n    </details>\n  </section>\n\n  <section class=\"cx-card cx-wide\" style=\"padding:0;border:0\">\n    <details class=\"fold\">\n      <summary>How the workflow is put together</summary>\n      <div class=\"foldbody\">\n        <p>Four <b>high-level use cases</b>, one per life-cycle phase. Each contains\n        <b>activities</b>, and each activity contains the <b>information exchanges</b> that make\n        it work &mdash; who gives what to whom, for what purpose, and which tool could support\n        it.</p>\n        <ul class=\"cx-steps\">\n          <li><b>HLUC1 Design</b> &mdash; assess the building and select renovation measures</li>\n          <li><b>HLUC2 Construction and handover</b> &mdash; carry out the renovation and hand over building information</li>\n          <li><b>HLUC3 Operation</b> &mdash; monitor building performance and manage maintenance</li>\n          <li><b>HLUC4 Deconstruction and recovery</b> &mdash; plan deconstruction and material recovery</li>\n        </ul>\n        <p>Identifiers such as <span class=\"cx-code\">HLUC1-A5-E3</span> read as use case 1,\n        activity 5, exchange 3. Stakeholder groups (<span class=\"cx-code\">SG1</span>&hellip;<span\n        class=\"cx-code\">SG14</span>) and needs (<span class=\"cx-code\">N1</span>&hellip;<span\n        class=\"cx-code\">N13</span>) are numbered as in the task 3.1 report.</p>\n      </div>\n    </details>\n  </section>\n\n  <section class=\"cx-card cx-wide\" style=\"padding:0;border:0\">\n    <details class=\"fold\">\n      <summary>Where this sits in the project</summary>\n      <div class=\"foldbody\">\n        <p>DTERBIM proposes an interoperable, BIM-based way of running renovation projects\n        &mdash; the DTERBIM process &mdash; enabled by the <b>DTERBIM Toolkit</b>: BIM-based\n        tools, AI-powered services and Digital Twins. An <b>openBIM framework acts as the central\n        orchestrator</b>, integrating commercial solutions and newly developed collaborative\n        services to guide users through design, construction, operation, maintenance,\n        deconstruction and reuse. The work is validated in two virtual pilots and demonstrated in\n        three real ones: a residential historical building in Valladolid, an academic building in\n        Warsaw, and a kindergarten and elementary school in Athens.</p>\n\n        <p>This workflow is <b>WP3, task 3.1</b>. It is the first step, and the rest of WP3 builds\n        directly on what you confirm or correct here:</p>\n\n        <table class=\"cx-table\">\n          <thead><tr><th>Task</th><th>What it does</th><th>What it takes from this workflow</th></tr></thead>\n          <tbody>\n            <tr><td><b>T3.1</b><span>D3.1</span></td>\n                <td>The workflow for lean circular energy renovation, developed with participatory input.</td>\n                <td>This document. Your review decides what the other tasks inherit.</td></tr>\n            <tr><td><b>T3.2</b><span>D3.2</span></td>\n                <td>Data needs and an openBIM data collection methodology. The workflow is mapped in\n                    BPMN as part of an IDM; information requirements become IDS and LOIN, classified with bSDD.</td>\n                <td>Every information exchange you confirm becomes a data requirement. An exchange that\n                    is wrong here produces a wrong requirement there.</td></tr>\n            <tr><td><b>T3.3</b><span>D3.3</span></td>\n                <td>The DTERBIM Toolkit defined and adapted to the flow: tool inputs, outputs, integration\n                    and the information workflow in a CDE.</td>\n                <td>The <i>Relevant tools</i> column. Where a tool link is marked\n                    <span class=\"cx-code\">possible link &mdash; confirm</span>, T3.3 is what has to confirm it.</td></tr>\n            <tr><td><b>T3.4</b><span>D3.4</span></td>\n                <td>Data sufficiency: the LOD of the pilot BIM models against the LOIN the workflow and\n                    tools require.</td>\n                <td>What each receiving stakeholder needs to have, activity by activity.</td></tr>\n            <tr><td><b>T3.5</b><span>D3.5</span></td>\n                <td>BIM analysis, quality checking and the BIM enrichment methodology.</td>\n                <td>The information gaps the workflow exposes &mdash; missing material data, incomplete\n                    models, broken links to time-series data.</td></tr>\n          </tbody>\n        </table>\n\n        <p class=\"cx-note\"><b>On the tools.</b> Tool references here come from the tool summaries\n        supplied by the tool owners. <b>Documented contribution</b> means the summary states that\n        function. <b>Possible link &mdash; confirm</b> means we think it fits but the owner has not\n        confirmed it. The orchestrator is named in the project description but has no tool summary\n        yet, so wherever it appears in an exchange it is a proposal, not a commitment. Tool\n        developers: these are the rows to check hardest.</p>\n      </div>\n    </details>\n  </section>\n\n  <section class=\"cx-card cx-wide\" style=\"padding:0;border:0\">\n    <details class=\"fold\">\n      <summary>What &ldquo;lean&rdquo; means here</summary>\n      <div class=\"foldbody\">\n        <p>Every information exchange in this workflow is meant to answer four questions:\n        <b>who</b> needs this, <b>when</b> at the latest, <b>in what form</b> so it can be used\n        without being rebuilt, and <b>what it is for</b>. An exchange that cannot answer them is\n        waste &mdash; information asked for twice, or arriving too late to be used &mdash; and you\n        should say so. Circularity raises the stakes: a material passport or a dismantling plan is\n        only worth making if the information survives to the phase that needs it, which may be\n        thirty years later.</p>\n\n        <p class=\"cx-note\"><b>Where the word comes from.</b> &ldquo;Lean&rdquo; is ours, not the\n        funder&rsquo;s. The call this project answers &mdash;\n        <a href=\"https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/opportunities/topic-details/horizon-cl5-2024-d4-02\"\n           target=\"_blank\" rel=\"noopener\">HORIZON-CL5-2024-D4-02</a> on the EU Funding &amp;\n        Tenders Portal &mdash; does not use it. We put it in our own proposal: the grant agreement\n        for <a href=\"https://cordis.europa.eu/project/id/101235920\" target=\"_blank\"\n        rel=\"noopener\">DTERBIM (101235920)</a> says WP3 exists &ldquo;to create a lean workflow for\n        circular energy renovations, reducing costs, improving building performance, and promoting\n        material reuse through digitalization&rdquo;, and task 3.1 is to develop it across the\n        whole life cycle. It is a commitment we made, which is part of why your review\n        matters.</p>\n      </div>\n    </details>\n  </section>\n\n</div>\n";
/* The phone edition of this file sets this true, so it keeps the phone layout at
   any window width. In the normal file it stays false and the width decides. */
const FORCE_PHONE = true;
const PHONE_MQ = window.matchMedia('(max-width: 820px)');
let PHONE = FORCE_PHONE || PHONE_MQ.matches;

const UCC = ['#00515E','#2A5E78','#E26A48','#2F7A50'];
const LENS_COLS = ['#00515E','#E26A48','#2A5E78','#2F7A50','#8E4585','#A8701A','#4C5059','#1F8A8F'];
/* third entry is the short label, for the phone where all four sit in one row */
const VERDICTS = [['agree','Agree','Agree'],['changes','Agree with changes','Changes'],
                  ['disagree','Disagree','Disagree'],['na','N.A.','N.A.']];
const STORAGE_KEY = 'dterbim-review-v1';
const WARN_KEY = 'dterbim-review-note-seen';
const FMT_ANSWERS = 'dterbim-review-answers';
const FMT_PROGRESS = 'dterbim-review-progress';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* answers partners have already sent back, baked in when the file was built.
   Read-only: nothing here is the reader's own work and nothing here can be edited. */
const RET = (DATA.returned && typeof DATA.returned === 'object')
  ? DATA.returned : {orgs:[], ex:{}, act:{}, uc:{}, cells:{}};
const RET_ANY = RET.orgs.length > 0;
const PEN = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 10-4-4L4 16z"/></svg>';
const MOVES = [['move','Should move'],['remove','Should be removed'],
               ['missing','Something is missing'],['merge','Should be split or merged']];
const CARET = '<span class="caret"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span>';
const ARROW = '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const TICK = '<svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>';

/* ====================================================================== data
   Flat helpers over the payload. */
const UCS = DATA.use_cases;
const ACTS = UCS.flatMap((u,ui) => u.activities.map((a,ai) => ({u,a,ui,ai})));
const EXS = ACTS.flatMap(({u,a,ui,ai}) => a.exchanges.map((e,ei) => ({u,a,e,ui,ai,ei})));
const EX_BY_ID = Object.fromEntries(EXS.map(x => [x.e.id, x]));
const ACT_BY_ID = Object.fromEntries(ACTS.map(x => [x.a.id, x]));

const SG_USED = [...new Set(EXS.flatMap(x => x.e.sg))].sort((p,q) => +p.slice(2) - +q.slice(2));
const TOOLS_USED = [...new Set(EXS.flatMap(x => x.e.tools.codes))].sort();

/* a lens key is "SG4" or "T:t1.2" */
const lensLabel = k => k.startsWith('T:')
  ? k.slice(2) + ' ' + (DATA.tools[k.slice(2)] || '')
  : k + ' ' + ((DATA.stakeholders[k] || {}).short || '');
const lensShort = k => k.startsWith('T:') ? k.slice(2) : k;
const lensColor = k => LENS_COLS[Math.max(0, state.lenses.indexOf(k)) % LENS_COLS.length];
const exHasLens = (e,k) => k.startsWith('T:') ? e.tools.codes.includes(k.slice(2)) : e.sg.includes(k);
const lensCount = k => EXS.filter(x => exHasLens(x.e,k)).length;

/* ===================================================================== state
   Everything the reviewer enters. Autosaved to this browser; exported as a file. */
const newId = () => {
  try { return Array.from(crypto.getRandomValues(new Uint8Array(6)),
                          b => b.toString(16).padStart(2,'0')).join(''); }
  catch (e) { return Math.random().toString(16).slice(2,14).padEnd(12,'0'); }
};
function freshState(){
  return {rid:newId(), version:DATA.meta.review_version, org:'', orgOther:'', person:'',
          lenses:[], ex:{}, act:{}, uc:{}, savedAt:null,
          /* How the parties on an exchange are worded. The ISO 19650 alignment
             has been accepted, so 'iso' is the text now; 'ours' shows what the
             workflow said before and 'trk' shows the two against each other,
             both kept so the change stays checkable. */
          isoMode:'iso'};
}
/* Rebuild a valid state from anything (old storage, a progress file someone edited):
   unknown ids, wrong types and stray keys are dropped rather than trusted. */
function sanitize(raw){
  const out = freshState();
  if (!raw || typeof raw !== 'object') return out;
  const str = (v,n) => typeof v === 'string' ? v.slice(0,n) : '';
  if (/^[0-9a-f]{8,32}$/.test(raw.rid || '')) out.rid = raw.rid;
  out.org = str(raw.org,40); out.orgOther = str(raw.orgOther,120); out.person = str(raw.person,120);
  out.savedAt = str(raw.savedAt,40) || null;
  out.isoMode = ['trk','iso','ours'].includes(raw.isoMode) ? raw.isoMode : 'iso';
  const okLens = k => typeof k === 'string' &&
    (SG_USED.includes(k) || (k.startsWith('T:') && TOOLS_USED.includes(k.slice(2))));
  out.lenses = Array.isArray(raw.lenses) ? raw.lenses.filter(okLens).slice(0,8) : [];
  const vset = VERDICTS.map(v => v[0]);
  const cleanV = v => {
    const o = {};
    if (v && typeof v === 'object')
      for (const [k,x] of Object.entries(v))
        if ((okLens(k) || k === 'GEN') && x && typeof x === 'object')
          o[k] = {verdict: vset.includes(x.verdict) ? x.verdict : '', note: str(x.note,4000),
                  change: MOVES.some(m => m[0] === x.change) ? x.change : ''};
    return o;
  };
  const cleanCell = (c,valid) => {
    if (!c || typeof c !== 'object') return null;
    const arr = v => Array.isArray(v) ? v.filter(x => valid.includes(x)).slice(0,20) : [];
    return {ok: c.ok === true, add: arr(c.add), del: arr(c.del), note: str(c.note,4000)};
  };
  if (raw.ex && typeof raw.ex === 'object')
    for (const [id,r] of Object.entries(raw.ex)){
      if (!EX_BY_ID[id] || !r || typeof r !== 'object') continue;
      const o = {};
      const st = cleanCell(r.stake, SG_USED); if (st) o.stake = st;
      const inf = cleanCell(r.info, []);      if (inf) o.info = inf;
      const tl = cleanCell(r.tools, TOOLS_USED); if (tl) o.tools = tl;
      const v = cleanV(r.v); if (Object.keys(v).length) o.v = v;
      if (Object.keys(o).length) out.ex[id] = o;
    }
  const actIds = new Set(ACTS.map(x => x.a.id));
  if (raw.act && typeof raw.act === 'object')
    for (const [id,r] of Object.entries(raw.act)){
      if (!actIds.has(id) || !r || typeof r !== 'object') continue;
      const av = cleanV(r.v);
      /* up to v3 one change applied to the whole activity; it now belongs to a lens,
         so an older file hands it to every lens line that asked for a change */
      const legacy = MOVES.some(m => m[0] === r.change) ? r.change : '';
      if (legacy)
        for (const rec of Object.values(av))
          if (!rec.change && (rec.verdict === 'changes' || rec.verdict === 'disagree'))
            rec.change = legacy;
      out.act[id] = {v: av, note: str(r.note,4000), disc: str(r.disc,4000)};
    }
  const ucIds = new Set(UCS.map(u => u.id));
  if (raw.uc && typeof raw.uc === 'object')
    for (const [id,r] of Object.entries(raw.uc)){
      if (!ucIds.has(id) || !r || typeof r !== 'object') continue;
      out.uc[id] = {v: cleanV(r.v), note: str(r.note,8000)};
    }
  return out;
}
/* Storage is refused on opaque origins and in some locked-down setups — most often
   when the file is opened from inside a zip. Say so rather than losing work quietly. */
const STORAGE_OK = (() => {
  try { localStorage.setItem('__dterbim_t','1'); localStorage.removeItem('__dterbim_t'); return true; }
  catch (e) { return false; }
})();
function loadState(){
  if (!STORAGE_OK) return null;
  try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? sanitize(JSON.parse(raw)) : null; }
  catch (e) { return null; }
}
let state = loadState() || freshState();

let saveTimer = null;
function save(){
  state.savedAt = new Date().toISOString();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      flashSaved();   /* a dot on the save button, so autosave is visibly real */
    }
    catch (e) { /* storage unavailable; the file is the fallback */ }
  }, 250);
}
let flashTimer = null;
function flashSaved(){
  const b = $('#saveBtn');
  if (!b) return;
  b.classList.remove('flash');
  void b.offsetWidth;
  b.classList.add('flash');
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => b.classList.remove('flash'), 1100);
}
/* record helpers: create on demand so empty rows never enter the file */
function exRec(id,cell){
  const r = state.ex[id] || (state.ex[id] = {});
  if (!cell) return r;
  return r[cell] || (r[cell] = {ok:false, add:[], del:[], note:''});
}
function vRec(scope,id,lens){
  /* every verdict record carries its own verdict, change and comment */
  const bag = scope === 'ex' ? exRec(id)
            : scope === 'act' ? (state.act[id] || (state.act[id] = {v:{},note:'',disc:''}))
            : (state.uc[id] || (state.uc[id] = {v:{},note:''}));
  const v = bag.v || (bag.v = {});
  return v[lens] || (v[lens] = {verdict:'', note:'', change:''});
}

/* ================================================================== progress
   "Musts" are the exchanges that touch a selected lens. With no lens selected
   every exchange counts, so the ring still means something on first open. */
const activeLenses = () => state.lenses.length ? state.lenses : ['GEN'];
function isMust(e){
  return state.lenses.length ? state.lenses.some(k => exHasLens(e,k)) : true;
}
function exAnswered(e){
  const r = state.ex[e.id];
  if (!r || !r.v) return false;
  return activeLenses().some(k => r.v[k] && r.v[k].verdict);
}
function progress(filter){
  let must = 0, done = 0, extra = 0;
  for (const x of EXS){
    if (filter && !filter(x)) continue;
    const answered = exAnswered(x.e);
    if (!isMust(x.e)){ if (answered) extra++; continue; }   /* answered beyond the lens still counts */
    must++;
    if (answered) done++;
  }
  return {must, done, extra, pct: must ? Math.round(done / must * 100) : 0};
}
function countNotes(){
  let n = 0;
  const add = o => { if (o && o.note && o.note.trim()) n++; };
  for (const r of Object.values(state.ex)){
    ['stake','info','tools'].forEach(c => add(r[c]));
    if (r.v) Object.values(r.v).forEach(add);
  }
  for (const r of Object.values(state.act)){
    add(r);
    if (r.disc && r.disc.trim()) n++;
    if (r.v) Object.values(r.v).forEach(add);
  }
  for (const r of Object.values(state.uc)){ add(r); if (r.v) Object.values(r.v).forEach(add); }
  return n;
}
function countEdits(){
  let n = 0;
  for (const r of Object.values(state.ex))
    ['stake','info','tools'].forEach(c => { if (r[c]) n += (r[c].add||[]).length + (r[c].del||[]).length; });
  return n;
}
function paintRing(){
  const p = progress();
  $('#ringFg').setAttribute('stroke-dasharray', (p.pct * 1.005).toFixed(2) + ' 100.5');
  $('#ringPct').textContent = p.pct + '%';
  $('#ringLbl').textContent = p.done + ' of ' + p.must + (p.extra ? ' +' + p.extra : '');
}

function buildLensPanel(){
  const opt = k => {
    const on = state.lenses.includes(k);

function toggleLens(k){
  const i = state.lenses.indexOf(k);
  if (i >= 0) state.lenses.splice(i,1);
  else if (state.lenses.length < 8) state.lenses.push(k);
  else return toast('Eight lenses at once is the maximum.');
  save(); buildLensPanel(); paintLensChips(); paintRing(); render();
}

/* mark SG codes in running text, coloured when that group is a selected lens */
function sgMark(t){
  return esc(t).replace(/\(?(SG\d+)\)?/g, (m,c) => {
    const on = state.lenses.includes(c);
    const sp = '<span class="sgx'+(on?' me':'')+'"'+(on?' style="--lc:'+lensColor(c)+'"':'')+
               ' data-sg="'+c+'">'+c+'</span>';
    return (m.startsWith('(') ? '(' : '') + sp + (m.endsWith(')') ? ')' : '');
  });
}

/* A party on an information exchange, worded as the reviewer has asked for.

   Partners asked that the workflow follow ISO 19650. The role there is a
   position in one appointment, not a kind of organisation, so the same group
   changes role between phases - facility operators (SG9) are an appointed party
   while the building is designed and sit on the appointing side once they
   operate it. The label is therefore written per exchange, and our own
   stakeholder group is kept in brackets so nobody loses their landmark.

   'trk' is the default: the proposal is shown as a change, not slipped in. */
function isoParty(plain, iso, cap){
  const up = s => cap ? upFirst(s) : s;
  if (!iso || iso === plain) return sgMark(up(plain));
  if (state.isoMode === 'ours') return sgMark(up(plain));
  if (state.isoMode === 'iso')  return '<span class="isoNew">'+sgMark(up(iso))+'</span>';
  return '<span class="trk"><del>'+sgMark(up(plain))+'</del>'+
         '<ins title="ISO 19650 wording">'+sgMark(up(iso))+'</ins></span>';
}
const ISO_MODES = [['iso','accepted'],['ours','original'],['trk','marked']];
function isoModeLabel(){
  const m = ISO_MODES.find(x => x[0] === state.isoMode);
  return m ? m[1] : 'accepted';
}
function cycleIsoMode(){
  const i = ISO_MODES.findIndex(x => x[0] === state.isoMode);
  state.isoMode = ISO_MODES[(i + 1) % ISO_MODES.length][0];
  save(); render();
}

const OV = [{"n":"1 · Design","lead":"architects and engineers lead","c":"c-teal","hand":"design and what to record","b":[{"t":"Project brief","s":"goals and scope","tl":[["Orch.","Orchestrator",false],["t1.2","t1.2",false]],"a":[["A1 agree goals","HLUC1-A1"]]},{"t":"As-is picture","s":"material, energy","tl":[["t2.2","t2.2",false],["t2.1","t2.1",false],["t1.2","t1.2",false],["t5.2","t5.2",true],["BDT","BDT",false]],"a":[["A2 assess materials","HLUC1-A2"],["A4 energy baseline","HLUC1-A4"]]},{"t":"Scenarios","s":"compared options","tl":[["t1.1","t1.1",true],["t1.2","t1.2",true],["t4.1","t4.1",true],["t1.3","t1.3",true],["t5.2","t5.2",true]],"a":[["A5 identify measures","HLUC1-A5"],["A6 model scenarios","HLUC1-A6"]]},{"t":"Chosen design","s":"recorded in BIM","tl":[["t1.2","t1.2",true],["t1.3","t1.3",true],["t5.1","t5.1",true],["t2.2","t2.2",true]],"a":[["A7 select scenario","HLUC1-A7"],["A8 record in BIM","HLUC1-A8"]]}]},{"n":"2 · Construction and handover","lead":"contractors lead the works","c":"c-coral","hand":"accepted handover package","b":[{"t":"Record list","s":"what to capture","tl":[["t2.2","t2.2",true],["t5.1","t5.1",false]],"a":[["A1 agree records","HLUC2-A1"]]},{"t":"Work plan","s":"order, materials","tl":[["t5.2","t5.2",true],["t1.2","t1.2",true],["t1.3","t1.3",true],["t4.2","t4.2",true],["CDT","CDT",true],["t4.1","t4.1",false]],"a":[["A2 check products","HLUC2-A2"],["A3 plan the work","HLUC2-A3"]]},{"t":"Site records","s":"as it was built","tl":[["t2.1","t2.1",true],["CDT","CDT",true],["t2.2","t2.2",true],["t5.1","t5.1",true]],"a":[["A4 record site work","HLUC2-A4"],["A5 update as-built","HLUC2-A5"]]},{"t":"Handover pack","s":"accepted","tl":[["t2.2","t2.2",true]],"a":[["A6 assemble pack","HLUC2-A6"],["A7 accept handover","HLUC2-A7"]]}]},{"n":"3 · Operation","lead":"facility operators lead","c":"c-purple","hand":"current building records","b":[{"t":"Linked records","s":"to live data","tl":[["t2.2","t2.2",true],["t3.1","t3.1",true],["t3.2","t3.2",true],["t3.3","t3.3",true],["CDE-d","CDE-d",true],["BDT","BDT",true]],"a":[["A1 link records","HLUC3-A1"]]},{"t":"Operating data","s":"energy, comfort","tl":[["t3.1","t3.1",true],["t3.2","t3.2",true],["t3.3","t3.3",true],["BDT","BDT",true],["CDE-d","CDE-d",false]],"a":[["A2 collect data","HLUC3-A2"]]},{"t":"Findings","s":"what to fix","tl":[["BDT","BDT",true],["t3.1","t3.1",true],["t3.2","t3.2",true],["t3.3","t3.3",true]],"a":[["A3 assess findings","HLUC3-A3"]]},{"t":"Updated record","s":"after the work","tl":[["t3.3","t3.3",true],["t3.1","t3.1",true],["BDT","BDT",true],["t2.2","t2.2",true]],"a":[["A4 carry out actions","HLUC3-A4"],["A5 check effects","HLUC3-A5"],["A6 prepare for next","HLUC3-A6"]]}]},{"n":"4 · Deconstruction and recovery","lead":"contractors lead","c":"c-pink","hand":null,"b":[{"t":"Removal scope","s":"what comes out","tl":[["t4.1","t4.1",true],["t4.2","t4.2",true]],"a":[["A1 agree scope","HLUC4-A1"]]},{"t":"Inventory","s":"checked on site","tl":[["t2.1","t2.1",true],["t2.2","t2.2",true],["t5.1","t5.1",true]],"a":[["A2 check inventory","HLUC4-A2"]]},{"t":"Recovery plan","s":"where it goes","tl":[["t4.1","t4.1",true],["t1.2","t1.2",true],["t4.2","t4.2",true],["t5.1","t5.1",true]],"a":[["A3 compare options","HLUC4-A3"],["A4 plan disassembly","HLUC4-A4"],["A5 logistics","HLUC4-A5"],["A6 agree the plan","HLUC4-A6"]]},{"t":"Recovery proof","s":"what was saved","tl":[["t2.1","t2.1",false]],"a":[["A7 record recovery","HLUC4-A7"]]}]}], OVF = {"c-teal":["#E1F5EE","#0F6E56"],"c-coral":["#FAECE7","#993C1D"],"c-purple":["#EEEDFE","#534AB7"],"c-pink":["#FBEAF0","#993556"]}, OVX = [40,194,348,502], OVW = 138;
function ovDraw(){
  const cv = $('#ovcanvas');
  if (!cv) return;
  const ST = $('#swTools') && $('#swTools').checked,
        SA = $('#swActs') && $('#swActs').checked;
  let y = 30, o = '';
  /* The detail sits well clear of the subtitle: cramming it up against the two
     lines of the box was the thing that made the first draft look busy. */
  const TOP = 62;
  for (const p of OV){
    let h = 56;
    for (const b of p.b){
      let cur = TOP;
      if (SA) cur += b.a.length * 15 + 8;
      if (ST) cur += Math.ceil(b.tl.length / 3) * 18 + 4;
      const bh = (cur > TOP ? cur + 8 : 56);
      if (bh > h) h = bh;
    }
    const fill = OVF[p.c][0], line = OVF[p.c][1], by = y + 10;
    o += '<text class="ovth" x="40" y="'+y+'">'+esc(p.n)+'</text>'
      +  '<text class="ovts" x="640" y="'+y+'" text-anchor="end">'+esc(p.lead)+'</text>';
    p.b.forEach((b,i) => {
      const x = OVX[i];
      o += '<g class="ovhit" data-ovbox="'+esc(b.a.map(a => a[1]).join(','))+'"'
        +  ' data-ovname="'+esc(b.t)+'">'
        +  '<rect x="'+x+'" y="'+by+'" width="'+OVW+'" height="'+h+'" rx="8" fill="'
        +  fill+'" stroke="'+line+'" stroke-width="0.5"/>'
        +  '<text class="ovth" x="'+(x+OVW/2)+'" y="'+(by+20)+'" text-anchor="middle" fill="'
        +  line+'">'+esc(b.t)+'</text>'
        +  '<text class="ovts" x="'+(x+OVW/2)+'" y="'+(by+38)+'" text-anchor="middle">'
        +  esc(b.s)+'</text>';
      let cy = TOP;
      if (SA){
        /* a transparent rect behind each label, so the whole row is hoverable
           and not only the glyphs themselves */
        b.a.forEach((a,k) => {
          const ay = by + cy + k*15;
          o += '<g class="ovhit" data-ovact="'+esc(a[1])+'">'
            +  '<rect x="'+(x+4)+'" y="'+(ay-1)+'" width="'+(OVW-8)+'" height="14" rx="3" fill="transparent"/>'
            +  '<text class="ovtn" x="'+(x+10)+'" y="'+(ay+11)+'">'+esc(a[0])+'</text></g>';
        });
        cy += b.a.length * 15 + 8;
      }
      if (ST){
        b.tl.forEach((t,k) => {
          const c = k % 3, r = Math.floor(k / 3),
                tx = x+9+c*40, ty = by+cy+r*18;
          o += '<g class="ovhit" data-ovtool="'+esc(t[1])+'">'
            +  '<rect class="ovchip'+(t[2]?'':' q')+'" x="'+tx+'" y="'+ty+'" width="36" height="14" rx="3"/>'
            +  '<text class="ovtn" x="'+(tx+18)+'" y="'+(ty+10)+'" text-anchor="middle">'+esc(t[0])+'</text></g>';
        });
      }
      o += '</g>';
    });
    y = by + h;
    if (p.hand){
      o += '<line class="ovarr" x1="340" y1="'+(y+8)+'" x2="340" y2="'+(y+32)+'" marker-end="url(#ovhead)"/>'
        +  '<text class="ovts" x="356" y="'+(y+25)+'">'+esc(p.hand)+'</text>';
      y += 68;
    }
  }
  cv.innerHTML = '<svg width="100%" viewBox="0 0 680 '+(y+14)+'" role="img">'
    + '<title>The DTERBIM workflow in four phases</title>'
    + '<defs><marker id="ovhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" '
    + 'markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" '
    + 'stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" '
    + 'stroke-linejoin="round"/></marker></defs>' + o + '</svg>';
}

/* --------------------------------------------- overview: hover and click
   The tooltip is one element, built on first use and parked on the body, so it
   survives every redraw. It is pointer-events:none, or it would sit under the
   cursor and swallow the click meant for the box underneath. */
let OVTIP = null;
function ovTipNode(){
  if (!OVTIP){
    OVTIP = document.createElement('div');
    OVTIP.className = 'ovtip';
    OVTIP.hidden = true;
    document.body.appendChild(OVTIP);
  }
  return OVTIP;
}
function ovActs(ids){
  return ids.map(id => ACT_BY_ID[id]).filter(Boolean);
}
function ovExCount(ids){
  return ovActs(ids).reduce((n,x) => n + x.a.exchanges.length, 0);
}
function ovPlural(n){
  return n + (n === 1 ? ' information exchange' : ' information exchanges');
}
function ovFirstSentence(t){
  t = (t || '').trim();
  const m = /^[\s\S]{40,260}?\.(?=\s|$)/.exec(t);
  return m ? m[0] : (t.length > 230 ? t.slice(0,230) + '\u2026' : t);
}
/* what to say about whatever is under the cursor; the innermost thing wins */
function ovTipFor(node){
  const tl = node.closest('[data-ovtool]');
  if (tl){
    const c = tl.dataset.ovtool, d = (DATA.tool_about || {})[c] || {},
          n = EXS.filter(x => (x.e.tools.codes || []).indexOf(c) >= 0).length;
    return {h: c + ' \u00b7 ' + (d.name || DATA.tools[c] || c),
            b: d.about || 'No tool summary has been supplied for this one yet.',
            f: n === 1 ? '1 information exchange names it \u2014 click to see it'
                       : n + ' information exchanges name it \u2014 click to see them'};
  }
  const ac = node.closest('[data-ovact]');
  if (ac){
    const x = ACT_BY_ID[ac.dataset.ovact];
    if (!x) return null;
    return {h: x.a.id + ' \u00b7 ' + x.a.name,
            b: ovFirstSentence(x.a.purpose),
            f: ovPlural(x.a.exchanges.length) + ' \u2014 click to open the activity'};
  }
  const bx = node.closest('[data-ovbox]');
  if (bx){
    const ids = bx.dataset.ovbox.split(','), acts = ovActs(ids);
    return {h: bx.dataset.ovname,
            b: acts.map(x => x.a.id + ' ' + x.a.name).join(' \u00b7 '),
            f: ovPlural(ovExCount(ids)) + (acts.length === 1
                 ? ' \u2014 click to open the activity'
                 : ' \u2014 click to see them')};
  }
  return null;
}
function ovShowTip(t, ev){
  const el = ovTipNode();
  el.innerHTML = '<b>'+esc(t.h)+'</b>'
    + (t.b ? '<span>'+esc(t.b)+'</span>' : '')
    + (t.f ? '<i>'+esc(t.f)+'</i>' : '');
  el.hidden = false;
  ovMoveTip(ev);
}
function ovMoveTip(ev){
  const el = OVTIP;
  if (!el || el.hidden) return;
  const w = el.offsetWidth, h = el.offsetHeight;
  let x = ev.clientX + 16, y = ev.clientY + 18;
  if (x + w > innerWidth - 8)  x = Math.max(8, ev.clientX - w - 16);
  if (y + h > innerHeight - 8) y = Math.max(8, ev.clientY - h - 18);
  el.style.left = x + 'px';
  el.style.top  = y + 'px';
}
function ovHideTip(){ if (OVTIP) OVTIP.hidden = true; }

document.addEventListener('mouseover', ev => {
  const n = ev.target;
  if (!n || !n.closest || !n.closest('#ovcanvas')){ ovHideTip(); return; }
  const t = ovTipFor(n);
  if (t) ovShowTip(t, ev); else ovHideTip();
});
document.addEventListener('mousemove', ev => { ovMoveTip(ev); });
document.addEventListener('scroll', ovHideTip, true);
document.addEventListener('click', ev => {
  const n = ev.target;
  if (!n || !n.closest || !n.closest('#ovcanvas')) return;
  ovHideTip();
  const tl = n.closest('[data-ovtool]');
  if (tl){ showTool(tl.dataset.ovtool); return; }
  const ac = n.closest('[data-ovact]');
  if (ac){ openAct(ac.dataset.ovact); return; }
  const bx = n.closest('[data-ovbox]');
  if (bx){ openBox(bx.dataset.ovbox.split(','), bx.dataset.ovname); return; }
});
