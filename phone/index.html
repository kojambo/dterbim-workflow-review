ors (SG5) use these requirements alongside technical constraints when developing the plan.","bpmn":"Task: Specify handling and protection requirements","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed"],"to_roles":["lead"],"from_label":"appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG5 contractors)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A4-E3","from":"Contractors (SG5) and IT providers and BIM integrators (SG11)","to":"architects and engineers (SG1), facility operators (SG9) and waste and recycling firms (SG14)","from_sg":["SG5","SG11"],"to_sg":["SG1","SG9","SG14"],"sg":["SG1","SG5","SG9","SG11","SG14"],"text":"They present the proposed tasks, their sequence and the methods to be used, identifying the components affected and the dependencies between tasks. Participants then review access, technical constraints, protection measures and handling requirements within their area of responsibility. Contractors (SG5) then revise the plan in response to any conflicts or missing information.","bpmn":"Task: Develop and review the removal sequence","tools":{"status":"documented","codes":["t4.2"],"text":"t4.2 assigns dismantling task sequences and produces plans and virtual simulations."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointed party (SG1 architects and engineers) and appointed party (SG9 facility operators) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A4-E4","from":"Contractors (SG5)","to":"building owners (SG4), architects and engineers (SG1), facility operators (SG9) and waste and recycling firms (SG14)","from_sg":["SG5"],"to_sg":["SG4","SG1","SG9","SG14"],"sg":["SG1","SG4","SG5","SG9","SG14"],"text":"Contractors (SG5) share the coordinated plan, identifying the current version, the agreed assumptions, and the outstanding checks. They explain the implications for the scope and timing, and identify the requirements for Activity 5. Any changes affecting the building owners’ (SG4) recovery priorities will return to the relevant decision in Activity 3.","bpmn":"Task: Issue the coordinated sequence for logistics planning","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointing","appointed","appointed","appointed"],"from_label":"lead appointed party (SG5 contractors)","to_label":"appointing party (SG4 building owners) and appointed party (SG1 architects and engineers) and appointed party (SG9 facility operators) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}}]},{"id":"HLUC4-A5","num":5,"name":"Arrange sorting, storage, transport and receiving destinations","purpose":"If materials are removed before the handling and receiving arrangements are ready, this can result in damage, repeated handling and unplanned storage. This activity coordinates these arrangements, ensuring that the planned recovery routes are practical and that contractors (SG5) know which destinations and services have been confirmed.","when":"Contractors (SG5) and waste and recycling firms (SG14) coordinate logistics using the recovery priorities from Activity 3 and the disassembly sequence from Activity 4. They update the arrangements when quantities, condition, timing or destination availability change, before the combined review in Activity 6.","participants":"Contractors (SG5) provide the expected quantities and removal programme, as well as coordinating site arrangements. Waste and recycling firms (SG14) advise on sorting, storage, transportation and processing. Where involved, reuse buyers, material suppliers and manufacturers (SG13) offering take-back and waste and recycling firms (SG14) acting as receiving facilities confirm their acceptance conditions and availability. Architects and engineers (SG1) check consistency with the inventory and recovery priorities. The building owners (SG4) review the implications for the scope, timing and cost.","outcome":"Contractors (SG5) have a coordinated plan for material flow and logistics, linking components or material groups to expected quantities, removal dates, handling requirements, storage, transport and intended destinations. The plan also identifies acceptance status and supporting confirmations, as well as outstanding arrangements and named responsibilities.","needs_text":"N9 Planning disassembly and material recovery; N11 Coordination responsibilities and decision records; N12 Traceable evidence for compliance and assessment requirements.","needs":["N9","N11","N12"],"checks":"Contractors (SG5) match removal dates with space and transport. Waste and recycling firms (SG14) and material suppliers and manufacturers (SG13) accepting returns confirm their own conditions and services. Named reuse buyers confirm their receiving commitments. Changes to recovery priorities return to Activity 3; sequence changes return to Activity 4. Shared content. Handling and receiving requirements also occur in HLUC1-A5 and HLUC2-A3. Required detail and commitment increase as work approaches execution.","discussion":["Do removal dates match storage, collection and receiving availability?","Who confirms each destination’s acceptance conditions and delivery dates?","Which services and destinations are confirmed, and which remain provisional?","Who revises the arrangements if quantities, condition or timing change?"],"sg":["SG1","SG4","SG5","SG13","SG14"],"tool_codes":["t4.1"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A5-E1","from":"Contractors (SG5)","to":"waste and recycling firms (SG14)","from_sg":["SG5"],"to_sg":["SG14"],"sg":["SG5","SG14"],"text":"Contractors (SG5) provide details of the expected types, quantities and conditions of materials, as well as the dates of their removal, all of which are linked to inventory and disassembly tasks. They also identify any available site space, access restrictions and handling requirements, enabling collection and storage arrangements to be tailored to the work.","bpmn":"Task: Supply quantities, dates and site constraints","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointed"],"from_label":"lead appointed party (SG5 contractors)","to_label":"appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A5-E2","from":"Named reuse buyers, material suppliers and manufacturers (SG13) offering take-back and waste and recycling firms (SG14) acting as receiving facilities","to":"contractors (SG5) and waste and recycling firms (SG14)","from_sg":["SG13","SG14"],"to_sg":["SG5","SG14"],"sg":["SG5","SG13","SG14"],"text":"Named reuse buyers, material suppliers and manufacturers (SG13) offering take-back and waste and recycling firms (SG14) acting as receiving facilities specify the condition, preparation, quantity limits and delivery dates they can accept. Each named organisation confirms acceptance where possible and identifies outstanding inspections or tests. The record identifies the destination, its stakeholder group and supporting correspondence or agreement.","bpmn":"Task: Confirm receiving conditions and availability","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG13 material suppliers and manufacturers) and appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A5-E3","from":"Waste and recycling firms (SG14)","to":"contractors (SG5), architects and engineers (SG1)","from_sg":["SG14"],"to_sg":["SG5","SG1"],"sg":["SG1","SG5","SG14"],"text":"They provide proposed arrangements for sorting, storing, collecting and transporting items, including details of routes, dates, capacities and costs. They also identify which services have been booked and which remain estimates or proposals. Contractors (SG5) then check these arrangements against the removal sequence and revise the timing where necessary.","bpmn":"Task: Coordinate logistics and service arrangements","tools":{"status":"documented","codes":["t4.1"],"text":"t4.1 visualises routes and estimates transport costs. It does not confirm bookings or destination acceptance."},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A5-E4","from":"Contractors (SG5) and waste and recycling firms (SG14)","to":"building owners (SG4), architects and engineers (SG1)","from_sg":["SG5","SG14"],"to_sg":["SG4","SG1"],"sg":["SG1","SG4","SG5","SG14"],"text":"They present the coordinated logistics plan, which includes destination confirmations, outstanding conditions and responsibilities. The plan highlights any discrepancies between removal dates, storage capacity, transport availability and receiving dates. Any changes affecting recovery choices or costs should return to Activity 3, while sequence changes should be coordinated with Activity 4 before the review in Activity 6.","bpmn":"Task: Issue the coordinated logistics plan","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"appointing party (SG4 building owners) and appointed party (SG1 architects and engineers)","lane":"lead","stage":"sx"}}]},{"id":"HLUC4-A6","num":6,"name":"Review and agree the disassembly and recovery plan before work begins","purpose":"Separate disassembly and logistics plans may contain conflicting quantities, dates or assumptions. Reviewing them together helps contractors (SG5) to resolve these issues, confirm responsibilities, and identify any conditions that must be met before the affected work can proceed.","when":"This activity follows on from the planning in Activities 2–5 and takes place before disassembly begins. Contractors (SG5) will repeat the relevant review if site findings or changes to recovery arrangements affect the agreed plan.","participants":"Contractors (SG5) bring the plan together. Architects and engineers (SG1) review the technical aspects of their respective areas of responsibility. Waste and recycling firms (SG14) confirm arrangements for handling, transporting and receiving. Facility operators (SG9) review access and operating constraints where relevant. IT providers and BIM integrators (SG11) support model checks and links between records. After the relevant reviews, the building owners (SG4) agree the plan’s scope, recovery priorities, timing and cost implications.","outcome":"Contractors (SG5) have an agreed plan or clear instructions for revision. The record identifies the current inventory, the disassembly sequence, the logistics arrangements, the supporting evidence, and the decision versions. Responsibilities for outstanding checks are clearly defined, as are the tasks that depend on their resolution. Participants receive instructions for reporting and reviewing unexpected site conditions.","needs_text":"N9 Planning disassembly and material recovery; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records; N12 Traceable evidence for compliance and assessment requirements; N13 Guidance for consistent information exchange.","needs":["N9","N10","N11","N12","N13"],"checks":"Contractors (SG5) assemble the plan. Architects and engineers (SG1), facility operators (SG9), waste and recycling firms (SG14) and IT providers and BIM integrators (SG11) review their respective parts. Building owners (SG4) agree scope, timing and cost within their authority. Gateway: Conditions resolved for the affected task? Issue instructions or hold that task pending correction or required technical review.","discussion":["Are component identifiers, quantities, task sequences and logistics arrangements consistent?","Who completes each technical review, and what does the building owners’ (SG4) agreement cover?","Which unresolved conditions prevent particular tasks from proceeding?","How will site findings lead to reviewed changes and clear revised instructions?"],"sg":["SG1","SG4","SG5","SG9","SG11","SG14"],"tool_codes":["t4.1","t4.2","t5.1"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A6-E1","from":"Contractors (SG5) and waste and recycling firms (SG14)","to":"architects and engineers (SG1) and building owners (SG4)","from_sg":["SG5","SG14"],"to_sg":["SG1","SG4"],"sg":["SG1","SG4","SG5","SG14"],"text":"Contractors (SG5) and waste and recycling firms (SG14) present a combined inventory, disassembly sequence and logistics plan. This information links components and quantities to removal tasks, handling requirements, and intended destinations. It also includes recovery costs, evidence of acceptance, assumptions and any outstanding arrangements.","bpmn":"Task: Assemble the combined plan for review","tools":{"status":"documented","codes":["t4.2","t4.1"],"text":"t4.2 supplies sequences and simulations; t4.1 supplies circular material scenarios and transport costs."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointing"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"appointed party (SG1 architects and engineers) and appointing party (SG4 building owners)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A6-E2","from":"Architects and engineers (SG1), facility operators (SG9) and IT providers and BIM integrators (SG11)","to":"contractors (SG5) and waste and recycling firms (SG14)","from_sg":["SG1","SG9","SG11"],"to_sg":["SG5","SG14"],"sg":["SG1","SG5","SG9","SG11","SG14"],"text":"Architects and engineers (SG1), facility operators (SG9) and IT providers and BIM integrators (SG11) report any conflicts, missing information or unresolved technical or operating constraints within their remit. IT providers and BIM integrators (SG11) check that the model information required for the agreed exchange is present. The review findings identify the affected component, task or record, as well as the necessary corrections.","bpmn":"Task: Review technical and information conflicts","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 checks defined IFC requirements and reports BCF issues. It does not confirm site feasibility or compliance."},"iso":{"from_roles":["appointed","appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A6-E3","from":"Contractors (SG5), architects and engineers (SG1) and waste and recycling firms (SG14)","to":"building owners (SG4)","from_sg":["SG5","SG1","SG14"],"to_sg":["SG4"],"sg":["SG1","SG4","SG5","SG14"],"text":"They provide the revised plan and review the results, explaining how the conflicts were resolved and what remains outstanding. They also identify any dependencies or required inspections, as well as changes to the scope, recovery priorities, timing or costs that require the building owners’ (SG4) decision.","bpmn":"Task: Resolve comments and identify open conditions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointed","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers) and appointed party (SG14 waste and recycling firms)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A6-E4","from":"Building owners (SG4)","to":"contractors (SG5), architects and engineers (SG1), waste and recycling firms (SG14) and facility operators (SG9)","from_sg":["SG4"],"to_sg":["SG5","SG1","SG14","SG9"],"sg":["SG1","SG4","SG5","SG9","SG14"],"text":"Building owners (SG4) agree the plan within their authority or request revisions. The decision identifies the covered versions, reasons, conditions and unresolved actions. Technical reviews and decisions remain the responsibility of the relevant architects and engineers (SG1) and contractors (SG5) within their remit.","bpmn":"Task: Agree the plan within the relevant authority","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["lead","appointed","appointed","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers) and appointed party (SG14 waste and recycling firms) and appointed party (SG9 facility operators)","lane":"appointing","stage":"sx"}},{"id":"HLUC4-A6-E5","from":"Contractors (SG5)","to":"contractors (SG5) acting as site supervisors and disassembly crews and waste and recycling firms (SG14)","from_sg":["SG5"],"to_sg":["SG5","SG14"],"sg":["SG5","SG14"],"text":"Contractors (SG5) provide details of the current agreed tasks, their sequence and handling instructions, as well as the conditions affecting the work. They also explain who receives reports of unexpected materials, damage or changed quantities, and how tasks that are affected return for review before revised instructions are issued.","bpmn":"Task: Issue current instructions to disassembly crews","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["lead","appointed"],"from_label":"lead appointed party (SG5 contractors)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}}]},{"id":"HLUC4-A7","num":7,"name":"Carry out disassembly, record recovery results and update material records","purpose":"Contractors (SG5) carry out the agreed disassembly and record what is removed, its quantity and condition. Waste and recycling firms (SG14) record the movements they handle, and named receiving organisations provide receipt evidence. Architects and engineers (SG1) reconcile the records so building owners (SG4) can distinguish achieved recovery from planned or unresolved outcomes.","when":"Contractors (SG5) record their findings during disassembly and update these after sorting, collecting and receiving items at their destination. Contractors (SG5) revise the relevant plan and make a record when the actual quantities, condition or receiving arrangements differ from those agreed in Activity 6.","participants":"Contractors (SG5) carry out disassembly and report site findings. Waste and recycling firms (SG14) provide collection and receiving records. Material suppliers and manufacturers (SG13) confirm take-back receipts where offered. Reuse buyers are identified by their actual stakeholder group and named in the project arrangements. Architects and engineers (SG1) reconcile evidence, while IT providers and BIM integrators (SG11) update model and component links. Building owners (SG4) receive the results, and facility operators (SG9) receive changes affecting assets still in use.","outcome":"Architects and engineers (SG1) reconcile actual removal and receiving evidence. IT providers and BIM integrators (SG11) update the linked material and model records within their remit. Current records identify quantities, condition, removal dates, destinations and supporting evidence, including materials still in storage, rejected deliveries and unconfirmed outcomes. Building owners (SG4) receive the results and the named organisations responsible for outstanding corrections.","needs_text":"N6 Material tracking and continuity of records; N7 Usable information handover between lifecycle stages; N9 Planning disassembly and material recovery; N10 Information quality for the next activity; N12 Traceable evidence for compliance and assessment requirements.","needs":["N6","N7","N9","N10","N12"],"checks":"Contractors (SG5) carry out disassembly and report actual findings. Architects and engineers (SG1) reconcile movement and receipt evidence; IT providers and BIM integrators (SG11) update record links. The named organisation responsible for each discrepancy corrects it. Receipt at a recycling facility alone does not establish subsequent recycling. Site changes affecting remaining work return for review. Shared content. Material movements and receiving evidence correspond to HLUC2-A4. Different removal contexts do not require separate definitions of the same record fields.","discussion":["Who records actual quantities and condition, and who checks them?","How will component or batch identifiers remain consistent through removal and delivery?","What evidence supports each reported recovery outcome?","Who follows up missing receipts, rejected deliveries and materials still in storage?"],"sg":["SG1","SG4","SG5","SG9","SG11","SG13","SG14"],"tool_codes":["t2.1"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A7-E1","from":"Contractors (SG5)","to":"architects and engineers (SG1) and IT providers and BIM integrators (SG11)","from_sg":["SG5"],"to_sg":["SG1","SG11"],"sg":["SG1","SG5","SG11"],"text":"Contractors (SG5) report components removed, actual quantities, condition after removal and dates. Records identify original components or locations and any handling batch references. Contractors (SG5) explain differences from the inventory, damage, unexpected materials and items remaining on site. Findings affecting further work return to the relevant planning and review activity before changed instructions are used.","bpmn":"Task: Carry out disassembly and record removals","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG5 contractors)","to_label":"appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A7-E2","from":"Waste and recycling firms (SG14), material suppliers and manufacturers (SG13) accepting returns and named reuse buyers","to":"contractors (SG5) and architects and engineers (SG1)","from_sg":["SG14","SG13"],"to_sg":["SG5","SG1"],"sg":["SG1","SG5","SG13","SG14"],"text":"Waste and recycling firms (SG14), material suppliers and manufacturers (SG13) accepting returns and named reuse buyers provide evidence for the stage each handled. Collection records, delivery receipts, accepted quantities and rejection notices identify the material or batch, date and destination. Evidence of subsequent reuse or processing is retained where available; otherwise that outcome remains unconfirmed. Reuse buyers’ stakeholder codes follow their actual organisation type.","bpmn":"Task: Provide collection and receiving evidence","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG14 waste and recycling firms) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A7-E3","from":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"contractors (SG5), waste and recycling firms (SG14), material suppliers and manufacturers (SG13) or named reuse buyers responsible for an affected record","from_sg":["SG1","SG11"],"to_sg":["SG5","SG14","SG13"],"sg":["SG1","SG5","SG11","SG13","SG14"],"text":"Architects and engineers (SG1) compare removal, storage, collection and receipt evidence. IT providers and BIM integrators (SG11) check the record and component links within their remit. They identify missing evidence, inconsistent quantities or units and request corrections from the named contractors (SG5), waste and recycling firms (SG14), material suppliers and manufacturers (SG13) or reuse buyers responsible. Remaining uncertainties retain assigned follow-up responsibilities.","bpmn":"Task: Reconcile evidence and request corrections","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms) and appointed party (SG13 material suppliers and manufacturers)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A7-E4","from":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"building owners (SG4) and relevant facility operators (SG9)","from_sg":["SG1","SG11"],"to_sg":["SG4","SG9"],"sg":["SG1","SG4","SG9","SG11"],"text":"They provide updated material records and a summary of the results achieved compared to the plan. This information distinguishes between components that remain in the building and materials that have been removed, and identifies confirmed destinations, materials in storage, and unresolved outcomes. Facility operators (SG9) receive details of any changes affecting assets still in use.","bpmn":"Task: Issue actual recovery results and current records","tools":{"status":"confirm","codes":["t2.1"],"text":"t2.1: confirm support for deconstruction quantities, condition, destinations, receipt evidence and unresolved recovery status."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["appointing","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG4 building owners) and appointed party (SG9 facility operators)","lane":"appointed","stage":"sx"}}]}]}],"returned":{"orgs":[],"ex":{},"act":{},"uc":{},"cells":{}},"needs":{"N1":{"code":"N1","name":"Material information for circular renovation planning","addresses":["B1","B2","E1"],"why":"Addresses B1, B2, E1. The barrier to circularity that respondents selected most often was missing material and product data (65.9%), followed by missing standards for secondary materials (56.1%). Respondents also expressed a desire for material tracking (68.2%) and residual-value assessment (70.5%).","what":"Before choosing renovation measures or removing anything, the project team needs to establish which existing materials and components can be kept, repaired or reused, and what can be used as an alternative where this is not possible.","place":"Initial assessment and early design, before the team chooses measures or removes anything. The result feeds the energy assessment (N4), the scenario comparison (N2) and the business case (N5), which adds costs to the options identified here.","who":"Facility operators (SG9) provide maintenance records. Contractors (SG5) report on their findings on site and any limitations to the work. Material suppliers (SG13) provide comparable product information and waste and recycling firms (SG14) advise on what can be recovered and accepted. Architects and engineers (SG1) compile all this information into a single record for each material or component, detailing what it is, where it is located, how much of it there is, its condition, and any limits on reuse. The team updates the record whenever a later inspection reveals new information about a material.","receiver":"The design team (architects and engineers, SG1) requires a material assessment showing whether each material or component can be kept, repaired or reused and which comparable product could replace it if cannot be retained. Each entry specifies what has been confirmed and what is still an assumption. For example, this could be a condition of material that has not yet been inspected, or a reuse option that has not yet been accepted by a recovery firm. This is clear before the assessment is used to build renovation scenarios.","benefit":"There is less repeated data collection, gaps are found early and there are fewer late design changes caused by unnecessary replacement."},"N2":{"code":"N2","name":"Building information suitable for renovation energy assessment","addresses":["B1","B4","B5","B11","E2"],"why":"Addresses B1, B4, B5, B11, E2. Fifteen respondents rated the barriers to BIM-based energy renovation on a scale from 1 (not a barrier) to 3 (a significant barrier). The lack of usable or up-to-date BIM models of existing buildings was rated at 2.07, while the lack of compatibility between BIM and energy modelling tools was rated at 2.27. Eighty per cent (12 out of 15) of respondents wished for the automated or semi-automated conversion of BIM models into energy models.","what":"The team needs building information that they can use to prepare and check an energy model. The level of detail required depends on the purpose of the assessment. Parts of the building outside the scope of the renovation still affect the energy results, so the model should include these in a simplified form and explain why.","place":"It should be used early in the design process, before the baseline energy assessment, and again after design changes. It uses the BIM model and its updates (N3). The energy model it produces provides the results used in the scenario comparison (N2).","who":"Energy consultants (SG7) define the scope of the assessment and the information they require. Architects and engineers (SG1) provide current geometry, construction, and system information. Facility operators (SG9) provide operating and maintenance records, while material suppliers (SG13) provide product properties. IT providers and BIM integrators (SG11) support the conversion and exchange. Before simulation, the team reviews missing inputs and simplifications. Following each design change, the team passes on the new information with its scenario and model versions before recalculating the results.","receiver":"Energy consultants (SG7) require a simulation-ready energy model that is linked to the renovation scenario. The model records its scope, assumptions, and missing inputs. The geometry, thermal and system information are checked for the purposes of the assessment. Estimated inputs are distinguished from verified values and each reassessment uses the matching design version.","benefit":"There is less repeated model preparation and manual entry, no modelling beyond what the assessment requires and information gaps are identified before they delay the analysis or distort comparisons."},"N3":{"code":"N3","name":"Updating BIM with selected renovation measures","addresses":["B4","B5","B11","E2"],"why":"Addresses B4, B5, B11, E2. Eighty-six per cent of respondents (13 out of 15) wanted measure parameters mapped to BIM properties, and 80 per cent (12 out of 15) wanted version and scenario tracking. Preparing and maintaining models was rated as having the highest barrier (2.40 on a 1–3 scale) and nine out of fifteen respondents called it significant.","what":"The parameters of the selected measures are entered into the relevant BIM elements, eliminating the need for manual entry. For a new window, for example, this means its thermal performance and size. The updated model shows the chosen scenario and can be used for energy assessment, specifications, and later project activities.","place":"Early and detailed design. The team updates the BIM model each time it selects measures to assess, first for the scenarios it compares (N2) and then for the scenario chosen by the owners. The updated model is used for the energy assessment (N4) and then for the chosen scenario, moving on to specification and later project activities.","who":"Architects and engineers (SG1) specify the selected measures and the building elements affected. Material suppliers (SG13) provide the product and measure parameters, and the team reuses information collected in N1 and N2 rather than asking for it again. IT providers and BIM integrators (SG11) establish the link between these parameters and BIM properties. Energy consultants (SG7) verify that the model contains the information required for the energy assessment, and contractors (SG5) confirm any installation limitations. The team updates the model before each assessment or specification that depends on it. They also keep earlier scenario versions and records of existing components that remain in place so that every change can be traced.","receiver":"Energy consultants (SG7) and the project team require a BIM model that links each selected measure and its parameters to the relevant building elements. The model indicates which scenario and version is being shown, distinguishes between proposed changes and existing conditions, and lists any parameters that could not be linked. Nothing is lost when the model moves to the next tool.","benefit":"There is less manual parameter entry and model editing, and no mismatched versions of the same scenario. There is also less rework from outdated or incorrectly transferred selections."},"N4":{"code":"N4","name":"Assessing the business case for recovery and reuse","addresses":["B8","B14","E1","E4"],"why":"Addresses B8, B14, E1, E4. Two respondents identified missing business cases and weak economic incentives as barriers to circular reuse. Respondents also requested the cost and value information required for a business case: 70.5% (31 out of 44) wanted residual-value assessments and 80.0% (20 out of 25) wanted long-term cost forecasts.","what":"The team compares the costs and benefits of keeping, repairing, reusing, recovering or replacing each component. This shows how recovery effort, possible resale or reuse value, and market conditions affect the practicality of each option.","place":"The design stage, before the team commits to removing or buying anything. It uses the material assessment (N1) and provides a cost comparison for the scenario comparison (N2). The options supported carry through to recovery planning (N9).","who":"Architects and engineers (SG1) define the material options and quantities, starting from the material assessment (N1). Contractors (SG5) explain what the work involves, including how components are separated. Waste and recycling firms (SG14) provide information on recovery, transport, storage, and acceptance. Material suppliers (SG13) provide replacement costs and market information. The team reuses the cost information from N2 where it covers the same products. Building owners (SG4) and financial stakeholders (SG10) determine the investment strategy and decision criteria. The team replaces early estimates with more accurate information from inspections, quotations or confirmed destinations.","receiver":"Building owners (SG4) and financial stakeholders (SG10) require a cost comparison of circular options. This should cover implementation and recovery costs, as well as the estimated residual value. It should also distinguish between estimates and confirmed offers and costs. It states its time horizon and assumptions and specifies the factors on which the result depends, such as the condition of the material and whether a destination will accept it.","benefit":"The team identifies circular options that suit the project, avoids late reversals caused by an incomplete business case and considers costs throughout the entire workflow rather than shifting them between activities."},"N5":{"code":"N5","name":"Comparing renovation scenarios and selecting measures","addresses":["B8","E4","E5"],"why":"Addresses B8, E4, E5. Sixty per cent of respondents (nine out of 15) rated weak links between analysis results and project decisions as a significant barrier. They also asked for better support when it came to weighing up scenarios. 84% (21 out of 25) wanted risk and uncertainty analysis and automated reports.","what":"The team compares renovation scenarios, each with a different set of measures for the building, against the project's energy, environmental, circularity and cost goals. This comparison reveals the trade-offs and uncertainties, as well as the requirements for each scenario, enabling owners to select a scenario or request a revision.","place":"This is done in the early stages of the design process, once the team has scenarios to compare. This stage builds on the material assessment (N1), the energy results (N4) and the business case (N5). The outcome — the preferred scenario and its measures — goes into the BIM model (N3).","who":"Architects and engineers (SG1) define the scenarios and what each one covers; they also reuse the material assessment from N1. Energy consultants (SG7) provide the energy results and the assumptions behind them. Material suppliers (SG13) add cost information to the product information already collected in N1, ensuring that no one is asked for the same product data twice. Contractors (SG5) provide installation costs and explain the requirements for each scenario on site. Financial actors (SG10) can provide investment assumptions. Building owners (SG4) review the results together before agreeing on a preferred scenario. When a measure, assumption or project goal changes, the team updates the comparison using the matching scenario versions.","receiver":"Building owners (SG4) and the project team require a comparison of the scenarios, as well as a record of the preferred one. For each scenario, the results of the energy, environmental, circularity and cost analyses are shown, measured against the same baseline, scope and basis of comparison. It states its assumptions and uncertainties, and the impacts it leaves out. It also links to the scenario and model versions used.","benefit":"There are fewer separate comparison exercises and repeated explanations, trade-offs are visible before anyone commits and there is no design work on scenarios that miss the project's goals."},"N6":{"code":"N6","name":"Material tracking and continuity of records","addresses":["B6","B13","E1"],"why":"Addresses B6, B13, E1. Tracking of materials and components was wished for by 68.2% of respondents (30 of 44). 33.3% (17 out of 51) said that the greatest loss of information or efficiency occurs between the construction and operation phases. 41.5% (17 out of 41) cited the lack of standardised supply chains and logistics, including storage, as a barrier to circular strategies.","what":"During construction and renovation, the team tracks which materials are kept, installed, removed and recovered, and compares them with the planned scope. Each record remains linked to its building component, meaning that purchasing, handover and recovery decisions are based on actual inventory.","place":"Construction and renovation works, from the start of site work until handover. It takes the materials and quantities planned in design (N1, N3) and provides the material records at handover (N7) and to recovery planning (N9).","who":"Contractors (SG5) record site changes, quantities, and material movements. Material suppliers (SG13) provide information on products delivered, along with supporting documents. Waste and recycling firms (SG14) provide details of the destination and acceptance conditions for materials leaving the site. Architects and engineers (SG1) ensure that each record is linked to the model and the specification. IT providers and BIM integrators (SG11) support the exchange process. The team updates a record each time a product is substituted, installed, or removed. Facility operators (SG9) receive these records at handover. If a recovered material has no confirmed destination, the record states this and does not count it as reused.","receiver":"Facility operators (SG9) and subsequent renovation and recovery teams require material records, or passports, linked to building components. Each record shows the quantities used, product information, changes made, and where materials went. Planned and actual information is clearly distinguished. Each record shows when it was last updated and provides links to supporting documents, location information and the intended or confirmed destination","benefit":"There is less duplicate site and material reporting, no later rebuilding of what was installed and recovery and purchasing are arranged before delays or unnecessary storage arise."},"N7":{"code":"N7","name":"Usable information handover between lifecycle stages","addresses":[],"why":"37.1% of respondents (23 out of 62) reported challenges when exchanging information between the construction and operation phases, and 33.3% (17 out of 51) said that this is where the greatest loss of information or efficiency occurs. 53.7% (22 out of 41) of respondents cited the lack of standards and harmonised procedures as a barrier to circular strategies. One respondent pointed to unclear contractual responsibilities for circularity data across the project.","what":"Before handover from construction to operation, the team must deliver information that the receiving organisation can use to operate and maintain the building. The same approach applies when information is passed on for later renovation or deconstruction planning.","place":"Handover takes place at the end of construction and renovation works. The handover package (N8) is provided to operation and maintenance using the material records (N6). The same process applies when information is transferred to recovery planning (N9).","who":"Building owners (SG4) and facility operators (SG9) specify the information required to operate and maintain the building. This is then agreed with architects and engineers (SG1) and contractors (SG5) prior to handover. Contractors (SG5) then provide verified as-built changes, commissioning records, and maintenance documents. Material suppliers (SG13) provide product information. The architects and engineers (SG1) then combine the model and the records into one package. IT providers and BIM integrators (SG11) support the agreed formats and importing them into the operators' systems. Before completion, facility operators (SG9) review the package, list what is still missing and agree with the project team who will be responsible for each part after handover.","receiver":"Facility operators (SG9) and building owners (SG4) require a handover package containing current models, asset and material records, supporting documents, and an acceptance record. This package shows which version of each item is current and who is responsible for it. It also lists anything that is still missing or not agreed at handover. Operators can find and use this information without having to rebuild it from separate documents.","benefit":"There will be fewer requests for missing information after handover, no repeated entry into operational systems and fewer delays caused by unclear responsibilities or unusable records."},"N8":{"code":"N8","name":"Operational information for maintenance and future renovation","addresses":["B3","B7","E3"],"why":"Addresses B3, B7, E3. Eighty percent of respondents (20 out of 25) said that BIM is not linked to facility management in their organisation. Furthermore, 92 percent (23 out of 25) said that energy, facility management, and circularity data are not exchanged in a connected way. 50.0% (nine out of 18) rated the reliability of circularity indicators as low. All four respondents who answered the facility management questions said that integration with digital models and predictive maintenance needs improvement, though this is a very small group.","what":"During operation, facility operators (SG9) consider energy usage, system performance and maintenance information simultaneously. This enables them to identify when the building's performance differs from expectations, plan maintenance work, and provide valuable insights for future renovations. Observations and completed actions remain accessible when the building is assessed again.","place":"It uses the information provided at the end of the construction stage (N7). It provides performance and maintenance information to the energy assessment (N4) and recovery planning (N9) for later work.","who":"Facility operators (SG9) supply operating and maintenance records. Energy utility companies and ESCOs (SG8) provide service and energy information where they are involved. IT providers and BIM integrators (SG11) link monitoring data to the spaces, systems, and assets from which it originates. Energy consultants (SG7) interpret the energy performance and architects and engineers (SG1) use the findings when a renovation assessment begins. The team updates the information at the agreed monitoring intervals, when equipment or operating conditions change, and after each maintenance task is completed. Alerts and recommendations are sent to the person responsible for deciding how to respond and documenting the outcome.","receiver":"Facility operators (SG9) and subsequent renovation teams require a record of each asset's performance, maintenance events, recommendations and completed actions. Each measurement shows its period, what it covers, and whether its quality has been checked. Measured results are clearly distinguished from modelled results. When equipment changes, the links between the operating data and the asset records are updated.","benefit":"There is less repeated investigation of known operating problems, maintenance is focused on identified needs and operating evidence is reused instead of the same building information being collected again for a renovation."},"N9":{"code":"N9","name":"Planning disassembly and material recovery","addresses":["B9","B13","E1"],"why":"Addresses B9, B13, E1. A total of 53.7% (22 out of 41) of respondents cited the absence of standards and harmonised procedures, such as digital pre-demolition audits, as an obstacle to implementing circular strategies. 41.5% (17 out of 41) cited the lack of standardised supply chains and logistics, including storage, as a barrier. Meanwhile, 46.8% of respondents (29 out of 62) indicated that coordination with contractors and subcontractors was among the more challenging aspects of stakeholder engagement.","what":"Before any selective removal, deconstruction or demolition work begins, the team needs a coordinated plan. This plan should detail the components to be recovered, the order of removal and how and where they will be handled. The team revises the plan if what they find on site differs from the records.","place":"The deconstruction stage includes selective removal during a renovation. This stage uses the material information from earlier needs (N1, N6) and the asset records from operation (N8) to choose the recovery options, as defined in the business case (N5). The confirmed results are then fed back into the material records (N6).","who":"Facility operators (SG9) and architects and engineers (SG1) provide current information on assets, materials and models. Contractors (SG5) explain how components are accessed, how they are connected to the building, and the order in which they can be removed. Waste and recycling firms (SG14) provide information on acceptance, sorting, storage and transport requirements. Material suppliers (SG13) can help to identify products and confirm whether they accept returns. The team brings these inputs together before deciding what to remove and updates the plan when further information emerges from inspections or the initial dismantling. The confirmed quantities and condition of the recovered materials are entered into the material records.","receiver":"Contractors (SG5) and recovery firms (SG14) require a plan that links each recoverable component and material to its removal steps, handling and intended destination. The plan distinguishes between components that can potentially be recovered and those for which a receiving party has confirmed acceptance. It also lists the remaining inspections and the known limits at that point. Each component retains the same identifier and quantity in the model, removal sequence and material records.","benefit":"This results in less damage to components that can be recovered, no repeated handling or unplanned storage, and removal timed to when transport and receiving organisations are available."},"N10":{"code":"N10","name":"Information quality for the next activity","addresses":["B1","B3","B5"],"why":"Addresses B1, B3, B5. Sixty-five point nine per cent of respondents (27 out of 41) cited missing data on suitable materials and products as a barrier to circular strategies, and 53.7 per cent (22 out of 41) cited the lack of standards and harmonised procedures. 50.0% (nine of 18) rated the reliability of circularity indicators as low.","what":"Before using information supplied by someone else for an assessment, model update or handover, the receiving team needs to know whether it is complete, consistent and reliable enough for that use. The effort spent checking this information should match the purpose of the exchange and the potential cost of a gap.","place":"This should be done at all stages before information is used in the next activity. This applies before the model update (N3), the energy assessment (N4) and the handover (N7), for example. The check results are given to whoever supplied the information so they can correct it.","who":"The team that will use the information specifies what they need. For example, energy consultants (SG7) require information before an energy assessment, and facility operators (SG9) require information before a handover. Architects and engineers (SG1), contractors (SG5), energy consultants (SG7) and facility operators (SG9) each supply or review information relating to their own area. IT providers and BIM integrators (SG11) set up the checks and how issues are communicated. Building certification and standards bodies (SG3) can advise on the relevant standards and criteria. The information arrives with details of its source, version, assumptions and known gaps. The provider corrects any issues and the exchange is checked again before the information is reused.","receiver":"The team using the information needs it together with the results of the checks, details of any issues found and the assumptions made, as well as a statement on whether it is fit for purpose. Each check specifies the intended use and the version it covers. Missing and estimated values remain visible. The receiving team decides whether to proceed with the remaining issues.","benefit":"Errors are found before they spread between tools; information that has not changed is not checked again; and only the details needed by the next activity are collected."},"N11":{"code":"N11","name":"Coordination responsibilities and decision records","addresses":["B9","B10","E5"],"why":"Addresses B9, B10, E5. Of the 62 respondents, 46.8% (29) named contractors and subcontractors as one of the groups that are challenging to coordinate with, and 40.3% (25) named public authorities. One respondent highlighted unclear contractual responsibilities for circularity data across the project. Seventy-six per cent (19 out of 25) wanted visual dashboards to communicate results, and one comment described a shared dashboard for decision-making, revisions and approvals.","what":"At every stage, the team should have a shared record of who supplies, checks, uses and updates each piece of information and who decides on changes. Material choices, the choice of scenario, revisions and open questions are linked to the information they were based on.","place":"This occurs at all stages where the team makes a decision. This records decisions such as the choice of scenario (N2), material choices (N1 and N5), and the handover agreement (N7). This record is sent to everyone who then acts on those decisions.","who":"Building owners (SG4) agree with the organisations involved on who decides what. Architects and engineers (SG1), contractors (SG5), energy consultants (SG7) and facility operators (SG9) each maintain a record of their own activities. IT providers and BIM integrators (SG11) make these accessible to those who need them. Each decision specifies the scenario, model or asset version to which it applies, the person responsible, and any follow-up actions. The team informs the affected parties of a change before proceeding with their own activity. Advice from outside the team, such as from suppliers or recovery firms, is recorded alongside the relevant decision.","receiver":"Anyone acting on a decision requires a shared record linking responsibilities, decisions, revisions and unanswered issues to the relevant project information. This record shows the current decision and what it was based on, and each person can see the information relevant to their role. Each outstanding action has an owner and a status: 'open' or 'done'. Decisions that have been replaced stay in the record so that people can trace what changed and why.","benefit":"There is less repetition of clarifications, fewer conflicting instructions, less waiting for decisions and less rework when changes are not passed on to the relevant people."},"N12":{"code":"N12","name":"Traceable evidence for compliance and assessment requirements","addresses":["B2","B5","B15"],"why":"Addresses B2, B5, B15. The lack of standards and harmonised procedures was identified as a barrier by 53.7% of respondents (22 out of 41), while 36.6% (15 out of 41) selected regulatory or legal barriers. These findings highlight the need to clarify which requirements apply to a project and what evidence is required to demonstrate compliance.","what":"The team must link applicable requirements to product information, project records, and assessment results that support them. For instance, a claim about a material’s potential for reuse should be linked to evidence regarding its condition and suitability. Checking that information is complete is different from assessing whether it meets a regulatory or certification requirement.","place":"Requirements are identified during the planning stage and reviewed before relevant design, procurement, handover and recovery decisions are made. This process involves the reuse of material and product information (N1, N6), assessment results (N2) and recovery information (N9). Relevant evidence accompanies the handover package (N7), and information quality checks are provided through N10.","who":"Building owners (SG4) agree the project’s assessment objectives. Local governments and public bodies (SG12), as well as building certification and standards bodies (SG3), help to identify or review requirements within their respective areas of responsibility. Architects and engineers (SG1) compile the design evidence, while energy consultants (SG7) contribute energy assessments. Material suppliers (SG13) provide product evidence; contractors (SG5), installation and construction records; and waste and recycling firms (SG14) provide recovery records. IT providers and BIM integrators (SG11) support the reuse of this information. The team updates the evidence before submission in the event of any changes to the design, products or requirements.","receiver":"The relevant public authority (SG12) or certification body (SG3) requires an evidence package showing how the project addresses applicable national and local regulations, policy objectives and assessment criteria. For each requirement, it identifies its source, whether it is mandatory or voluntary, and the supporting evidence, such as energy-performance calculations, product documentation or waste and recovery records. The evidence relates to the project version being reviewed. Missing documents, unresolved checks and outstanding approvals are listed so the receiving body can determine what is still needed before making its decision.","benefit":"Verified information can be reused across assessments, missing evidence can be identified before submission and there is less need for repeated preparation and late clarification of requirements."},"N13":{"code":"N13","name":"Guidance for consistent information exchange","addresses":["B5","B10","B12"],"why":"Addresses B5, B10, B12. The lack of skills was identified as a barrier by 46.3% of respondents (19 out of 41), while 53.7% (22 out of 41) cited the absence of standards and harmonised procedures. One respondent also highlighted the issue of unclear contractual responsibilities for circularity data. These findings point to the need for practical guidance on exchanging information and carrying out agreed responsibilities.","what":"Participants need clear instructions on what information to provide, who will receive it, when it is needed, and how it will be checked. The instructions should also explain what to do when information is missing or inconsistent. This will help organisations to follow the workflow without having to interpret technical standards independently.","place":"Guidance is agreed when the project is set up and provided before each relevant activity begins. It supports the exchanges defined in the preceding priorities, including passing updated building information to the energy assessment (N3–N4), completing the handover process (N7), and preparing recovery plans (N9). It follows the quality checks in N10 and the responsibilities agreed in N11.","who":"Architects (SG1), engineers (SG1), contractors (SG5), energy consultants (SG7) and facility operators (SG9) describe the tasks they perform and the information exchanges they find challenging. IT providers and BIM integrators (SG11) use this feedback to create instructions and worked examples for each activity. Where needed, standards bodies (SG3) clarify relevant standards. Users then review the instructions to ensure they are clear and practical. The guidance is shared with participants before each activity begins and is updated when users identify unclear steps or changes to the tools, requirements or responsibilities.","receiver":"Each participant requires practical instructions, checklists and examples for their activity. These should identify the required inputs, expected outputs, receiving party and timing. Required information is distinguished from optional detail. For instance, guidance on an energy assessment would explain which model version to use, who would check missing inputs, and where corrections would be returned. It also identifies the person to contact when an issue requires expert judgement.","benefit":"There are fewer clarification requests and repeated mistakes, and less time is needed to learn unfamiliar processes. Organisations with different levels of digital experience can also follow the same agreed workflow"}},"stakeholders":{"SG1":{"code":"SG1","report_name":"Architectural & Engineering Firms","short":"Architects and engineers"},"SG2":{"code":"SG2","report_name":"Associations and Non-Governmental Organisations","short":"Associations and non-governmental organisations"},"SG3":{"code":"SG3","report_name":"Building Certification & Standards Bodies","short":"Building certification and standards bodies"},"SG4":{"code":"SG4","report_name":"Building owners (incl. housing associations) & Corporate landlords","short":"Building owners"},"SG5":{"code":"SG5","report_name":"Construction & Building Contractors (e.g. HVAC installers, façade installers, structural contractors)","short":"Contractors"},"SG6":{"code":"SG6","report_name":"Educational & Research Institutions","short":"Educational and research institutions"},"SG7":{"code":"SG7","report_name":"Energy Efficiency Consultants (including energy audit companies)","short":"Energy consultants"},"SG8":{"code":"SG8","report_name":"Energy Utility Companies (including ESCOs and energy service providers)","short":"Energy utility companies and ESCOs"},"SG9":{"code":"SG9","report_name":"Facility operators / asset managers","short":"Facility operators"},"SG10":{"code":"SG10","report_name":"Financial actors (banks, investors, funding bodies)","short":"Financial actors"},"SG11":{"code":"SG11","report_name":"IT Providers & BIM integrators","short":"IT providers and BIM integrators"},"SG12":{"code":"SG12","report_name":"Local Governments or Public Bodies/Contracting Authorities","short":"Local governments and public bodies"},"SG13":{"code":"SG13","report_name":"Materials Suppliers and Manufacturers","short":"Material suppliers and manufacturers"},"SG14":{"code":"SG14","report_name":"Waste Management & Recycling Firms","short":"Waste and recycling firms"}},"tools":{"t1.1":"ECM catalogue","t1.2":"Early design tool","t1.3":"BIM upgrade","t2.1":"Material passport","t2.2":"Building logbook","t3.1":"Energy profiling","t3.2":"IEQ simulation","t3.3":"SRI and O&M services","t4.1":"Circular value flows","t4.2":"Dismantling planner","t5.1":"Quality checking, IDS","t5.2":"BIM2BEM","CDE-s":"Static CDE","CDE-d":"Dynamic CDE","CDT":"Construction twin","BDT":"Building twin","Orchestrator":"DTERBIM Orchestrator"},"tool_about":{"BDT":{"name":"Building Digital and Sustainable Twin","about":"Provide a digital replica of the building during operation that integrates BIM data, real operational data, data processing algorithm and simulation models to continuously assess and improve the energy performance and sustainability aspects (Health, comfort, LCA and water conservation)."},"CDT":{"name":"for planning, progress monitoring & quality control","about":"Create a dynamic digital replica of the construction project by combining 4D BIM with real-time site data, to continuously track planned vs. actual progress and support quality control decisions."},"CDE-d":{"name":"Common Data Environment","about":""},"CDE-s":{"name":"Common Data Environment","about":"BIMserver.center is a CDE (Common Data Environment) - Free of use & Open formats - Types of Accounts - Developers, Corporate, Education, Manufacturers, - AECO Community – Connect AECO sector - Projects – Storage, Management, Users, Issues - BIM viewer - Online - Open API - connection with software tools"},"t1.1":{"name":"SRI-aligned catalogue of ECMs enhanced by circularity principles","about":"the tool offers a structured catalogue of passive, active, RES and control measures, enriched with technical, economic, environmental and circularity-related information. ECMs are mapped to SRI domains and impacts and provided in a machine-readable format to support automated workflows."},"t1.2":{"name":"Early design tool supporting circularity, material reuse and sustainability","about":"Decision-support tool to compare design and retrofitting scenarios at early stages, leveraging BIM tools. Integration of existing tools and technologies to support energy efficiency, circularity and inclusiveness principles-informed decision-making Stage: Early-design phase Output measurements: Energy, Economic, Enviro…"},"t1.3":{"name":"BIM upgrading tool","about":"The tool provides a semi-automatic workflow to upgrade and enrich existing BIM models by integrating ECMs from the DTERBIM catalogue. It enables the embedding of technical, performance, and system-related information into BIM models, ensuring consistency with DTERBIM workflows, openBIM standards, and DT environments."},"t2.1":{"name":"Building materials and construction products tracker (Building Material Passport)","about":"Real-time tracking of building products and material quantities in construction stage. Functionalities include: -3D visualisation of updated BIM model -Dashboards for real-time monitoring of material flow -Measuring circularity KPIs -Export material passports"},"t2.2":{"name":"Digital Building Logbook (handover process)","about":"To standardize and automate the collection,
