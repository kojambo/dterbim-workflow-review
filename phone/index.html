. Contractors (SG5) carry out repairs and maintenance as required. The building owners (SG4) make decisions regarding major works or investments. IT providers and BIM integrators (SG11) support the integration of building records, equipment and monitoring data.","needs_text":"Principal needs: N8. N10–N13 apply at relevant checks, decisions and exchanges. The full need names are listed in the shared guidance.","needs":["N8","N10","N13"],"outcome":"The facility operators (SG9) carry out or arrange the agreed operating adjustments and maintenance. They also check the effects of these adjustments and record any unresolved problems. Current equipment records, performance data and maintenance history are kept on file for continued operation, future renovations in HLUC1 and recovery planning in HLUC4.","lean":"The aim is to reduce the need for repeated investigations and unnecessary maintenance, as well as the time spent searching for reliable information. Keeping records up to date should also eliminate the need to collect the same building information again before a future renovation.","notes":"Monitoring and maintenance form an ongoing cycle. Records are updated when equipment or settings change; intervention effects are assessed after a suitable observation period. New renovation or recovery planning draws on Activity 6.","review_questions":["Are the activities and their results necessary for this high-level use case?","Are the named stakeholder groups and information exchanges appropriate in practice?","Which assumptions, tool links or responsibilities require correction or confirmation?"],"iso_part":["ISO 19650-3","Operational phase. The project information model has become the asset information model; work is triggered by events rather than by stages."],"activities":[{"id":"HLUC3-A1","num":1,"name":"Link building records to current equipment and monitoring sources","purpose":"Facility operators (SG9) need monitoring data linked to the correct equipment, systems and spaces. IT providers and BIM integrators (SG11) establish these links with the accepted building records, enabling facility operators (SG9) to locate the relevant information and interpret the coverage of each measurement.","when":"This activity begins when the facility operators (SG9) start using the handover information accepted in Use Case 2. Facility operators (SG9) review the links whenever there is a change to the equipment, sensors, meters or monitoring arrangements.","participants":"Facility operators (SG9) identify the equipment, systems and records in use. Energy utility companies and ESCOs (SG8) provide meter and service information where involved. IT providers and BIM integrators (SG11) establish the data links. Energy consultants (SG7) clarify assessment requirements and monitoring coverage. Building owners (SG4) confirm the responsibilities of the named organisations.","outcome":"Facility operators (SG9) have building and asset records linked to the relevant monitoring sources. Each record identifies what the source covers, its location, how frequently it is updated and who is responsible for it. Any missing links, unmonitored areas or discrepancies between the records and the equipment in use are clearly visible.","needs_text":"N7 Usable information handover between lifecycle stages; N8 Operational information for maintenance and future renovation; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records; N13 Guidance for consistent information exchange.","needs":["N7","N8","N10","N11","N13"],"checks":"Facility operators (SG9) verify equipment identity and coverage with energy consultants (SG7). IT providers and BIM integrators (SG11) correct source and model links. If no accepted handover or monitoring system exists, building owners (SG4) and facility operators (SG9) agree the records and monitoring preparation required before relying on the selected services.","discussion":["Who checks that asset, meter and sensor identifiers refer to the correct equipment or spaces?","Is the available monitoring coverage sufficient for the intended assessments?","Who updates the links when equipment or monitoring arrangements change?","What role does CDE-d perform, and which exchanges require partner confirmation?"],"sg":["SG4","SG7","SG8","SG9","SG11"],"tool_codes":["BDT","CDE-d","t2.2","t3.1","t3.2","t3.3"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A1-E1","from":"Facility operators (SG9)","to":"IT providers and BIM integrators (SG11) and energy consultants (SG7)","from_sg":["SG9"],"to_sg":["SG11","SG7"],"sg":["SG7","SG9","SG11"],"text":"Facility operators (SG9) provide access to accepted models, asset and material records, commissioning information, and operating schedules. They also identify any known changes to the equipment and outstanding handover issues, enabling facility operators (SG9) to determine which records represent the current building.","bpmn":"Task: Identify current handover and asset records","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 provides handover models and technical documentation as an earlier reference."},"iso":{"from_roles":["lead"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointed party (SG7 energy consultants)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A1-E2","from":"Facility operators (SG9), energy utility companies and ESCOs (SG8)","to":"IT providers and BIM integrators (SG11) and energy consultants (SG7)","from_sg":["SG9","SG8"],"to_sg":["SG11","SG7"],"sg":["SG7","SG8","SG9","SG11"],"text":"Facility operators (SG9) identify available meters, sensors, and building management system data. They provide the following information for each item: source identifier; location; measurement unit; recording interval; and the equipment or areas covered. They also provide relevant device specifications and operating schedules.","bpmn":"Task: Identify monitoring sources and coverage","tools":{"status":"documented","codes":["t3.1","t3.2"],"text":"t3.1 uses consumption, device specifications and schedules; t3.2 uses static BIM and sensor/BMS information."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointed party (SG7 energy consultants)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A1-E3","from":"IT providers and BIM integrators (SG11)","to":"facility operators (SG9) and energy consultants (SG7)","from_sg":["SG11"],"to_sg":["SG9","SG7"],"sg":["SG7","SG9","SG11"],"text":"They establish links between monitoring sources and the relevant assets, systems or spaces. Facility operators (SG9) and energy consultants (SG7) then review whether these links and the resulting measurement coverage support the intended uses. Any incorrect or missing links are returned to the person responsible for the building record or monitoring source.","bpmn":"Task: Establish and review asset-to-source links","tools":{"status":"documented","codes":["t3.3","CDE-d","BDT"],"text":"BDT integrates BIM, monitoring and simulation information; t3.3 harmonises static and operational data.\nPossible link — confirm: CDE-d: confirm data routes and identifier handling. Automatic asset-to-sensor matching is not established."},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A1-E4","from":"Building owners (SG4) and facility operators (SG9)","to":"IT providers and BIM integrators (SG11), energy consultants (SG7) and relevant energy utility companies and ESCOs (SG8)","from_sg":["SG4","SG9"],"to_sg":["SG11","SG7","SG8"],"sg":["SG4","SG7","SG8","SG9","SG11"],"text":"Building owners (SG4) and facility operators (SG9) agree with IT providers and BIM integrators (SG11), energy consultants (SG7) and energy utility companies and ESCOs (SG8) who maintains each information source and link. They confirm monitoring coverage, report changes and assign responsibility for missing or incorrect links. Each named organisation confirms its role and any limitations affecting later assessments.","bpmn":"Task: Agree source and link responsibilities","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","lead"],"to_roles":["appointed","appointed","appointed"],"from_label":"appointing party (SG4 building owners) and lead appointed party (SG9 facility operators)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointed party (SG7 energy consultants) and appointed party (SG8 energy utility companies and ESCOs)","lane":"appointing","stage":"s7"}}]},{"id":"HLUC3-A2","num":2,"name":"Collect and check data on energy use, indoor conditions and equipment operation","purpose":"Missing readings, faulty sensors or unexplained operating changes can lead to incorrect conclusions about building performance. Collecting and verifying the data enables facility operators (SG9) to distinguish between real operating issues and issues with the information, before recommending adjustments or maintenance.","when":"This activity follows on from the identification of information sources and links in Activity 1. Checks are carried out throughout the operation, both before the data is used for assessment and when there are changes to the equipment, monitoring arrangements or operating conditions.","participants":"Facility operators (SG9) provide monitoring data, operating schedules, and records of faults and changes. Where involved, energy utility companies and ESCOs (SG8) supply consumption and service data. IT providers and BIM integrators (SG11) support data collection and technical checks. Energy consultants (SG7) then review the suitability of the information for the planned energy assessments.","outcome":"Facility operators (SG9) have an operating record which specifies the measurement period, source, units, and the equipment or areas covered. The record shows any missing or suspect readings, estimated values, and relevant changes in operating conditions. Any unresolved data issues identify the responsible person and any limitations on the use of the information in Activity 3.","needs_text":"N8 Operational information for maintenance and future renovation; N10 Information quality for the next activity.","needs":["N8","N10"],"checks":"Facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11) review readings and context. Energy utility companies and ESCOs (SG8) correct their source data where involved. Gateway: Data adequate for the intended assessment? Record limitations or investigate further. A shared procedure does not make sensor checks equivalent to IFC checks.","discussion":["Which checks are automatic, and who reviews the remaining data issues?","How will missing readings, suspect values and estimates remain visible?","How will operating changes remain linked to the relevant measurement periods?","When is the available information sufficient for assessment, and when is further investigation needed?"],"sg":["SG1","SG7","SG8","SG9","SG11"],"tool_codes":["BDT","CDE-d","t3.1","t3.2","t3.3"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A2-E1","from":"Facility operators (SG9), energy utility companies and ESCOs (SG8)","to":"IT providers and BIM integrators (SG11) and energy consultants (SG7)","from_sg":["SG9","SG8"],"to_sg":["SG11","SG7"],"sg":["SG7","SG8","SG9","SG11"],"text":"Facility operators (SG9) and energy utility companies and ESCOs (SG8) supply available consumption readings, indoor-condition measurements and building management system records from the sources identified in Activity 1. Each dataset identifies the measurement period, units, recording interval and coverage so facility operators (SG9) and energy consultants (SG7) can interpret it correctly.","bpmn":"Task: Collect operating readings","tools":{"status":"documented","codes":["t3.1","t3.2"],"text":"t3.1 uses consumption and device data; t3.2 uses sensor and BMS data for IEQ assessment."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointed party (SG7 energy consultants)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A2-E2","from":"Facility operators (SG9)","to":"energy consultants (SG7) and IT providers and BIM integrators (SG11)","from_sg":["SG9"],"to_sg":["SG7","SG11"],"sg":["SG7","SG9","SG11"],"text":"Facility operators (SG9) provide operating schedules, equipment changes, maintenance events, reported faults and unusual conditions such as temporary closures. Energy consultants (SG7) and IT providers and BIM integrators (SG11) use these records to explain changes in the readings and identify periods requiring separate treatment.","bpmn":"Task: Supply operating changes and context","tools":{"status":"documented","codes":["t3.1","t3.3"],"text":"t3.1 uses device schedules; t3.3 uses time-series data with weather, occupancy and BIM context."},"iso":{"from_roles":["lead"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators)","to_label":"appointed party (SG7 energy consultants) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A2-E3","from":"Facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11)","to":"The facility operators (SG9), energy utility companies and ESCOs (SG8) or IT providers and BIM integrators (SG11) responsible for the affected source","from_sg":["SG9","SG7","SG11"],"to_sg":["SG9","SG8","SG11"],"sg":["SG7","SG8","SG9","SG11"],"text":"Facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11) report missing periods, duplicate readings, inconsistent units or timestamps, suspect values and incorrect asset links. The facility operators (SG9), energy utility companies and ESCOs (SG8) or IT providers and BIM integrators (SG11) responsible for the source investigate and supply corrections or explain the remaining issue. Excluded and estimated values retain the reason for their treatment.","bpmn":"Task: Investigate and correct data issues","tools":{"status":"confirm","codes":["CDE-d","BDT"],"text":"BDT and CDE-d: confirm supported checks for gaps, faults, timestamps and quality flags."},"iso":{"from_roles":["lead","appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG8 energy utility companies and ESCOs) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A2-E4","from":"Facility operators (SG9) and IT providers and BIM integrators (SG11)","to":"energy consultants (SG7) and architects and engineers (SG1) responsible for the relevant assessments","from_sg":["SG9","SG11"],"to_sg":["SG7","SG1"],"sg":["SG1","SG7","SG9","SG11"],"text":"Facility operators (SG9) and IT providers and BIM integrators (SG11) provide energy consultants (SG7) and architects and engineers (SG1) undertaking relevant technical assessments with the checked operating record and its context. Energy consultants (SG7) decide whether it supports the energy analysis. Architects and engineers (SG1) responsible for other assessments review the relevant coverage and limitations before use. Any unresolved issues remain linked to the affected sources and periods.","bpmn":"Task: Review whether data supports assessment","tools":{"status":"documented","codes":["BDT"],"text":"BDT combines operational monitoring with BIM and simulation information.\nPossible link — confirm: The summaries do not establish a complete operational-data checking procedure."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointed party (SG7 energy consultants) and appointed party (SG1 architects and engineers)","lane":"lead","stage":"s7"}}]},{"id":"HLUC3-A3","num":3,"name":"Assess performance and identify problems or opportunities for improvement","purpose":"Checked readings alone do not indicate whether the building is performing as expected or where action is required. This activity helps facility operators (SG9) to identify performance gaps, comfort issues and areas for improvement while taking into account operating conditions and uncertainty, before recommending a course of action.","when":"This activity uses the operating information checked in Activity 2. Facility operators (SG9) assess performance at agreed intervals, investigating significant changes, reported problems and unexpected results. These findings inform the operating adjustments or maintenance decisions made in Activity 4.","participants":"Energy consultants (SG7) interpret energy results. Facility operators (SG9) review operating conditions, comfort findings and equipment behaviour, consulting relevant architects and engineers (SG1) where necessary. Where involved, energy utility companies and ESCOs (SG8) contribute to service analysis. The building owners (SG4) receive the findings and their implications for potential interventions.","outcome":"Energy consultants (SG7) provide energy findings and architects and engineers (SG1) provide relevant comfort or other technical findings within their competence. Facility operators (SG9) bring these together against the relevant assets, systems and spaces. The record identifies performance differences, possible explanations, uncertainties and further investigations, distinguishing measured results from simulations and forecasts. It supports consideration of action in Activity 4.","needs_text":"N8 Operational information for maintenance and future renovation; N10 Information quality for the next activity; N12 Traceable evidence for compliance and assessment requirements.","needs":["N8","N10","N12"],"checks":"Energy consultants (SG7) review energy findings and architects and engineers (SG1) review comfort or other technical findings within their competence. Facility operators (SG9) consider the results together. Unexpected differences return to Activity 2 if data are suspect, or pass to Activity 4 for investigation or action. Tool recommendations require interpretation before work is instructed.","discussion":["Are measured and expected results comparable in scope, period and operating conditions?","Who reviews energy and comfort findings together?","Which findings justify considering action, and which require further investigation?","How will practitioners access t3.2 results and trace findings to their supporting evidence?"],"sg":["SG1","SG4","SG7","SG8","SG9"],"tool_codes":["BDT","t3.1","t3.2","t3.3"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A3-E1","from":"Facility operators (SG9) and relevant energy utility companies and ESCOs (SG8)","to":"energy consultants (SG7) and architects and engineers (SG1) undertaking technical assessments","from_sg":["SG9","SG8"],"to_sg":["SG7","SG1"],"sg":["SG1","SG7","SG8","SG9"],"text":"Facility operators (SG9) and energy utility companies and ESCOs (SG8) provide the checked operating record, relevant design or simulation results, schedules and agreed performance or comfort requirements. Energy consultants (SG7) and architects and engineers (SG1) responsible for technical assessments identify changes in occupancy, weather, equipment or use that affect the comparison.","bpmn":"Task: Supply the checked record and comparison basis","tools":{"status":"documented","codes":["BDT"],"text":"BDT combines BIM, operating data and energy/comfort simulation results."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"appointed party (SG7 energy consultants) and appointed party (SG1 architects and engineers)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A3-E2","from":"Energy consultants (SG7) and energy utility companies and ESCOs (SG8)","to":"facility operators (SG9)","from_sg":["SG7","SG8"],"to_sg":["SG9"],"sg":["SG7","SG8","SG9"],"text":"They provide energy profiles and relevant forecasts, as well as findings on differences from expected energy performance. They identify the periods, equipment and areas covered; explain the assumptions used for the comparison; and distinguish possible causes from confirmed faults.","bpmn":"Task: Assess and communicate energy performance","tools":{"status":"documented","codes":["t3.1","BDT"],"text":"t3.1 produces profiles, forecasts and flexibility assessments; BDT compares expected and actual performance."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead"],"from_label":"appointed party (SG7 energy consultants) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"lead appointed party (SG9 facility operators)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A3-E3","from":"Architects and engineers (SG1) and energy consultants (SG7) responsible for comfort and IEQ assessments","to":"facility operators (SG9)","from_sg":["SG1","SG7"],"to_sg":["SG9"],"sg":["SG1","SG7","SG9"],"text":"Architects and engineers (SG1) and energy consultants (SG7) responsible for the relevant assessments provide comfort and indoor environmental quality findings. They identify the spaces, periods, measurements, simulation assumptions and applicable assessment criteria. Recommendations and modelled results remain distinguishable from measured conditions. Facility operators (SG9) use these findings with the energy assessment when considering action in Activity 4.","bpmn":"Task: Assess and communicate comfort and IEQ findings","tools":{"status":"documented","codes":["t3.2","t3.3","BDT"],"text":"t3.2 produces scenario-testing results and optimisation recommendations; its summary states that it has no user interface.\nPossible link — confirm: Confirm how t3.2 results reach the named assessors and facility operators through BDT, t3.3 or another agreed interface."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"lead appointed party (SG9 facility operators)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A3-E4","from":"Facility operators (SG9) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG9","SG7"],"to_sg":["SG4"],"sg":["SG4","SG7","SG9"],"text":"They present the combined findings, explaining the performance gaps, affected assets or spaces, potential improvements, and any remaining uncertainties. They link each finding to its supporting measurements, assessment results and applicable requirements. They also identify matters for consideration in Activity 4, as well as those requiring further investigation.","bpmn":"Task: Present combined findings for consideration","tools":{"status":"documented","codes":["BDT"],"text":"BDT provides energy, IEQ and sustainability indicators and scenario assessments."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s7"}}]},{"id":"HLUC3-A4","num":4,"name":"Agree and carry out operating adjustments, repairs or maintenance","purpose":"Performance findings only lead to improvement when someone decides on an appropriate course of action and takes responsibility for carrying it out. This activity helps facility operators (SG9) turn the findings into agreed adjustments or maintenance work while considering costs, practical constraints, and the effects on occupants and building services.","when":"This activity follows on from the assessment in Activity 3. Facility operators (SG9) arrange actions within their agreed authority and seek the building owners’ (SG4) approval where necessary. Any findings that remain uncertain are subject to further investigation before facility operators (SG9) commit to an intervention.","participants":"Facility operators (SG9) coordinate and carry out operating adjustments within their remit. Energy consultants (SG7) explain findings and expected effects. Building owners (SG4) decide interventions requiring their approval. Contractors (SG5) carry out repairs or maintenance. Energy utility companies and ESCOs (SG8) contribute service work where contracted. IT providers and BIM integrators (SG11) support changes to monitoring or control connections.","outcome":"Facility operators (SG9) record the agreed action, the reasons for it, the affected assets or spaces, who is responsible for it and when it is planned to take place. Completed work identifies what changed and when, supported by service or maintenance records. Deferred actions retain a reason and a review date. These records form the basis for verifying the outcomes in Activity 5.","needs_text":"N8 Operational information for maintenance and future renovation; N11 Coordination responsibilities and decision records.","needs":["N8","N11"],"checks":"Facility operators (SG9) authorise actions within their remit and seek building owners’ (SG4) approval where required. Gateway: Action authorised? Proceed within the confirmed scope, investigate further or defer with a reason and review date. Contractors (SG5) and other named service organisations report actual completion.","discussion":["Which actions can facility operators (SG9) authorise, and which require the building owners’ (SG4) approval?","Who reviews recommendations before they become work instructions or control changes?","How will completed work, changed settings and deferred actions be recorded?","Which records are needed to check the effects of each action in Activity 5?"],"sg":["SG4","SG5","SG7","SG8","SG9","SG11"],"tool_codes":["t3.3"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A4-E1","from":"Facility operators (SG9) and energy consultants (SG7)","to":"building owners (SG4), where approval is required","from_sg":["SG9","SG7"],"to_sg":["SG4"],"sg":["SG4","SG7","SG9"],"text":"They explain the findings and the proposed response, including the expected benefits, uncertainties, costs, and effects on comfort and building services. They distinguish between actions that can proceed within the facility operators’ (SG9) authority and those that require a decision. Where equipment work is proposed, they will explain whether the problem could be addressed through adjustment or repair before replacement is considered.","bpmn":"Task: Propose adjustments or maintenance","tools":{"status":"documented","codes":["t3.3"],"text":"t3.3 supplies efficiency recommendations, predictive-maintenance alerts and IEQ actions for user review."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A4-E2","from":"Building owners (SG4), or facility operators (SG9) acting within agreed authority","to":"facility operators (SG9), contractors (SG5) or relevant energy utility companies and ESCOs (SG8) responsible for the action","from_sg":["SG4","SG9"],"to_sg":["SG9","SG5","SG8"],"sg":["SG4","SG5","SG8","SG9"],"text":"The authorised person confirms the action, requests a further investigation, or records a decision to defer it. The instruction specifies the affected equipment or spaces, the scope of the work, the timing, the conditions, and the reporting requirements.","bpmn":"Task: Authorise, investigate or defer the action","tools":{"status":"confirm","codes":["t3.3"],"text":"t3.3: confirm whether authorisation, responsibilities and deferred actions can be recorded in its dashboard."},"iso":{"from_roles":["appointing","lead"],"to_roles":["lead","appointed","appointed"],"from_label":"appointing party (SG4 building owners) and lead appointed party (SG9 facility operators)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG5 contractors) and appointed party (SG8 energy utility companies and ESCOs)","lane":"appointing","stage":"s7"}},{"id":"HLUC3-A4-E3","from":"Facility operators (SG9)","to":"contractors (SG5), relevant energy utility companies and ESCOs (SG8) and IT providers and BIM integrators (SG11) involved in the work","from_sg":["SG9"],"to_sg":["SG5","SG8","SG11"],"sg":["SG5","SG8","SG9","SG11"],"text":"Facility operators (SG9) provide asset information, fault findings, operating constraints and agreed instructions to the named contractors (SG5), relevant energy utility companies and ESCOs (SG8) and IT providers and BIM integrators (SG11) carrying out the action. Each organisation confirms access and service interruptions within its remit. Findings that change the scope return for a revised decision before the changed work proceeds.","bpmn":"Task: Coordinate access and work instructions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointed","appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators)","to_label":"appointed party (SG5 contractors) and appointed party (SG8 energy utility companies and ESCOs) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A4-E4","from":"Facility operators (SG9), contractors (SG5) or relevant energy utility companies and ESCOs (SG8) carrying out the action","to":"facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11)","from_sg":["SG9","SG5","SG8"],"to_sg":["SG9","SG7","SG11"],"sg":["SG5","SG7","SG8","SG9","SG11"],"text":"The named facility operators (SG9), contractors (SG5) or energy utility companies and ESCOs (SG8) carrying out the action report its completion date, affected assets, changed settings, repairs or replacements and remaining faults. Available test and service reports accompany the record. Facility operators (SG9) retain this evidence for current record updates and the subsequent effect assessment in Activity 5.","bpmn":"Task: Carry out and report the completed action","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG5 contractors) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s7"}}]},{"id":"HLUC3-A5","num":5,"name":"Check the effects of actions and update building records","purpose":"Simply completing an adjustment or maintenance task does not confirm that the problem has been solved. This activity checks the effects of the task and ensures that the building records are kept consistent with any changes to the equipment, settings or operating conditions. This means that any later assessments will use current information.","when":"Facility operators (SG9) update affected asset information and operating records when the work in Activity 4 changes equipment or settings. IT providers and BIM integrators (SG11) update the relevant model and monitoring links. Energy consultants (SG7) and architects and engineers (SG1) assess intervention effects once sufficient operating data are available, repeating the assessment if further monitoring is needed.","participants":"Facility operators (SG9) confirm operating changes and keep asset records current. Contractors (SG5) and relevant energy utility companies and ESCOs (SG8) supply completion records and subsequent consumption data within their remit. Energy consultants (SG7) assess energy effects, and architects and engineers (SG1) assess other technical findings where required. IT providers and BIM integrators (SG11) update model and monitoring links. Building owners (SG4) receive the findings and outstanding issues.","outcome":"Facility operators (SG9) record whether the action achieved its intended result, what remains uncertain, and whether further attention is required. Current asset records, operating schedules and monitoring links are updated to reflect completed changes. Any revised assessment baseline specifies the reason for the revision and its effective date, while retaining the earlier reference. Responsibilities for outstanding issues are clearly defined.","needs_text":"N8 Operational information for maintenance and future renovation; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records.","needs":["N8","N10","N11"],"checks":"Facility operators (SG9) keep current records when changes occur; IT providers and BIM integrators (SG11) update links within their remit. Energy consultants (SG7) and relevant architects and engineers (SG1) assess effects after sufficient observation. Further intervention returns to Activity 4; unresolved data issues return to Activity 2. Any revised baseline retains its reason and earlier reference.","discussion":["Which observation period and comparison conditions are most suitable for each action?","Who will decide whether the evidence demonstrates the intended improvement?","How will changes to equipment reach BIM, asset records, monitoring links and the logbook?","When is a revised baseline justified, and how will earlier references remain available?"],"sg":["SG1","SG4","SG5","SG7","SG8","SG9","SG11"],"tool_codes":["BDT","t2.2","t3.1"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A5-E1","from":"Facility operators (SG9), contractors (SG5) and relevant energy utility companies and ESCOs (SG8)","to":"energy consultants (SG7) and IT providers and BIM integrators (SG11)","from_sg":["SG9","SG5","SG8"],"to_sg":["SG7","SG11"],"sg":["SG5","SG7","SG8","SG9","SG11"],"text":"Facility operators (SG9), contractors (SG5) and relevant energy utility companies and ESCOs (SG8) provide completion records from Activity 4, with dates, affected equipment, changed settings and repairs or replacements. Facility operators (SG9) and energy utility companies and ESCOs (SG8) supply subsequent readings and operating context. Energy consultants (SG7) and architects and engineers (SG1) responsible for assessments apply the collection and checking arrangements from Activity 2 before using the readings.","bpmn":"Task: Supply completion records and subsequent data","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointed","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG5 contractors) and appointed party (SG8 energy utility companies and ESCOs)","to_label":"appointed party (SG7 energy consultants) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A5-E2","from":"Energy consultants (SG7) and relevant architects and engineers (SG1)","to":"facility operators (SG9)","from_sg":["SG7","SG1"],"to_sg":["SG9"],"sg":["SG1","SG7","SG9"],"text":"They compare the outcome of an action with the intended result and an earlier reference point. They also consider differences in weather, occupancy, schedules, and measurement coverage. The findings distinguish between observed changes and effects that can reasonably be attributed to the action, and identify any need for further monitoring.","bpmn":"Task: Assess intervention effects","tools":{"status":"documented","codes":["t3.1","BDT"],"text":"BDT supports performance comparisons and scenario assessment; t3.1 supports updated profiles and forecasts."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead"],"from_label":"appointed party (SG7 energy consultants) and appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG9 facility operators)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A5-E3","from":"IT providers and BIM integrators (SG11)","to":"facility operators (SG9) and energy consultants (SG7)","from_sg":["SG11"],"to_sg":["SG9","SG7"],"sg":["SG7","SG9","SG11"],"text":"IT providers and BIM integrators (SG11) provide updated model information, asset links and monitoring connections when confirmed equipment or settings change. Facility operators (SG9) update and check the operating and asset records within their remit. Records retain the effective date, supporting evidence and relevant history. This update does not wait for the later performance assessment. Any revised assessment baseline remains distinguishable from the earlier reference.","bpmn":"Task: Update affected records and monitoring links","tools":{"status":"confirm","codes":["t2.2","BDT"],"text":"BDT and t2.2: confirm how operational changes update BIM, asset records and the logbook."},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A5-E4","from":"Facility operators (SG9) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG9","SG7"],"to_sg":["SG4"],"sg":["SG4","SG7","SG9"],"text":"They report on the assessed outcome, any remaining faults or uncertainties, and the proposed further action. The record links the findings to the completed work, the measurement periods, and the current asset information. Matters requiring further intervention return to Activity 4, while unresolved data problems return to Activity 2.","bpmn":"Task: Report outcomes and further action","tools":{"status":"documented","codes":["BDT"],"text":"BDT supplies relevant energy, IEQ and sustainability indicators."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s7"}}]},{"id":"HLUC3-A6","num":6,"name":"Prepare current building and performance records for future renovation or recovery planning","purpose":"Architects and engineers (SG1) undertaking renovation, and contractors (SG5) and waste and recycling firms (SG14) preparing recovery planning, need current building records and the history of changes. Facility operators (SG9) prepare the relevant records so that the named organisations can reuse existing evidence and identify the new surveys or assessments required.","when":"Facility operators (SG9) are responsible for maintaining the records during operation and preparing the relevant information when the building owners (SG4) initiate a renovation or recovery assessment. This activity makes use of the updated records from Activity 5, as well as the accumulated operating and maintenance history.","participants":"Building owners (SG4) initiate the proposed intervention. Facility operators (SG9) provide current asset, material and maintenance records, and energy consultants (SG7) explain performance findings. IT providers and BIM integrators (SG11) support access and organisation. Architects and engineers (SG1) undertaking renovation, or contractors (SG5) and waste and recycling firms (SG14) preparing recovery planning, review the information for the next assessment.","outcome":"Architects and engineers (SG1) undertaking renovation, or contractors (SG5) and waste and recycling firms (SG14) preparing recovery planning, have access to current building records and relevant performance and maintenance history. The records identify sources, versions, measurement periods and known limitations. The named organisations undertaking the next assessment identify the evidence suitable for reuse and the further investigations required.","needs_text":"N7 Usable information handover between lifecycle stages; N8 Operational information for maintenance and future renovation; N12 Traceable evidence for compliance and assessment requirements; N13 Guidance for consistent information exchange.","needs":["N7","N8","N12","N13"],"checks":"Architects and engineers (SG1) undertaking renovation, or contractors (SG5) undertaking recovery planning, identify the next assessment’s needs. Facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11) provide and clarify their records. HLUC1-A2/A4 and HLUC4-A2 check the supplied evidence for its new use rather than assuming it remains sufficient. Shared content. This outgoing handover connects to HLUC1-A2/A4 or HLUC4-A2. These are the two ends of the same transfer, with receiving-use checks.","discussion":["Which parts of the operating and maintenance history are relevant to the proposed intervention?","Can Architects and engineers (SG1) or contractors (SG5) undertaking the next assessment identify the current records and trace the supporting evidence for them?","Which quantities, conditions or recovery assumptions require further investigation?","How will unresolved issues and information limitations be passed on to the next assessment?"],"sg":["SG1","SG5","SG7","SG9","SG11","SG14"],"tool_codes":["BDT","t2.2","t3.1","t3.3"],"iso_stage":"s7","exchanges":[{"id":"HLUC3-A6-E1","from":"Architects and engineers (SG1) preparing a renovation assessment, or contractors (SG5) and waste and recycling firms (SG14) preparing deconstruction and recovery planning","to":"facility operators (SG9) and energy consultants (SG7)","from_sg":["SG1","SG5","SG14"],"to_sg":["SG9","SG7"],"sg":["SG1","SG5","SG7","SG9","SG14"],"text":"They explain the proposed renovation or recovery assessment and identify the necessary information. They agree on the relevant areas, systems and periods, as well as the supporting evidence, so that the facility operators (SG9) can prepare information suited to the intended use.","bpmn":"Task: Identify the next assessment’s information needs","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","lane":"appointed","stage":"s7"}},{"id":"HLUC3-A6-E2","from":"Facility operators (SG9) and energy consultants (SG7)","to":"architects and engineers (SG1) undertaking the next assessment","from_sg":["SG9","SG7"],"to_sg":["SG1"],"sg":["SG1","SG7","SG9"],"text":"Facility operators (SG9) and energy consultants (SG7) provide architects and engineers (SG1) undertaking the next assessment with relevant energy and indoor-condition history, assessment findings, maintenance actions and persistent problems. Records identify periods, operating conditions and affected assets or spaces. Measured results remain distinguishable from forecasts, simulations and recommendations not implemented. HLUC1-A4 uses the relevant evidence when preparing a new baseline.","bpmn":"Task: Supply relevant operating and maintenance history","tools":{"status":"documented","codes":["t3.1","t3.3","BDT"],"text":"BDT supplies performance indicators; t3.1 supplies profiles and forecasts; t3.3 supplies diagnostic and recommendation history.\nPossible link — confirm: These outputs alone do not establish which interventions were completed."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants)","to_label":"appointed party (SG1 architects and engineers)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A6-E3","from":"Facility operators (SG9) and IT providers and BIM integrators (SG11)","to":"The architects and engineers (SG1), contractors (SG5) or waste and recycling firms (SG14) requiring the building records","from_sg":["SG9","SG11"],"to_sg":["SG1","SG5","SG14"],"sg":["SG1","SG5","SG9","SG11","SG14"],"text":"Facility operators (SG9) and IT providers and BIM integrators (SG11) give architects and engineers (SG1), contractors (SG5) and waste and recycling firms (SG14) access to current models, asset and material records, product documents and repair history. They identify current versions, evidence and uncertain quantities or condition. These records provide the starting information for HLUC1-A2 or HLUC4-A2; the next assessment requests further inspection only where needed.","bpmn":"Task: Provide current building and material records","tools":{"status":"documented","codes":["t2.2","BDT"],"text":"t2.2 supplies earlier handover models and documents; their currentness depends on later updates.\nPossible link — confirm: BDT and t2.2: confirm retrieval of current asset changes and maintenance history for new planning."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed","appointed"],"from_label":"lead appointed party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointed party (SG1 architects and engineers) and appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"s7"}},{"id":"HLUC3-A6-E4","from":"Architects and engineers (SG1), contractors (SG5) or waste and recycling firms (SG14) undertaking the next assessment","to":"facility operators (SG9), energy consultants (SG7) and IT providers and BIM integrators (SG11) responsible for the affected records","from_sg":["SG1","SG5","SG14"],"to_sg":["SG9","SG7","SG11"],"sg":["SG1","SG5","SG7","SG9","SG11","SG14"],"text":"Architects and engineers (SG1), contractors (SG5) or waste and recycling firms (SG14) undertaking the next assessment identify missing records, conflicting versions and information unsuitable for the intended use. The named facility operators (SG9), energy consultants (SG7) or IT providers and BIM integrators (SG11) supply corrections or explain the remaining limits. Architects and engineers (SG1) or contractors (SG5) responsible for the next assessment identify the evidence to reuse and the investigations still needed.","bpmn":"Task: Resolve gaps and identify further investigation","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG9 facility operators) and appointed party (SG7 energy consultants) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointed","stage":"s7"}}]}]},{"id":"HLUC4","num":4,"name":"Plan deconstruction and material recovery","reviewers":[{"code":"WUT","name":"Warsaw University of Technology","country":"Poland"},{"code":"CONTECH","name":"Contech GmbH, Berlin","country":"Germany"}],"phase":"Deconstruction and recovery phase","phase_short":"Deconstruction & recovery","purpose":"This high-level use case assists building owners (SG4) and contractors (SG5) in planning the removal of building components for the recovery of materials for reuse or recycling. Contractors (SG5) consider the condition of the components, the removal methods and the costs, as well as whether receiving organisations, such as secondary marketplaces and recycling firms, will accept the materials.","basis":"Respondents to the survey reported a lack of consistent procedures for circularity, fragmented material logistics, and difficulties in coordinating with contractors (SG5). They also requested improved material tracking and residual-value assessments. The literature review highlights gaps in building records and uncertainty about conditions that only become apparent during removal.","start":"The building owners (SG4) initiate the deconstruction planning process by explaining what can be removed and the recovery objectives. The facility operators (SG9) and architects and engineers (SG1) then provide available building models, material records, and maintenance history.","scope":"Contractors (SG5) check the material inventory, compare recovery options and plan the order and method of removal. They also arrange sorting, storage, transport and receiving organisations. As work proceeds, contractors (SG5) and waste and recycling firms (SG14) record actual quantities and destinations. These activities may also support selective removal during renovation in HLUC2.","participants":"The building owners (SG4) agree the recovery objectives and plan. Contractors (SG5) will assess the most suitable removal methods and carry out the work. Waste and recycling firms (SG14) provide advice on sorting, transport and acceptance conditions. Facility operators (SG9), architects and engineers (SG1) provide and update building records. Material suppliers and manufacturers (SG13) may assist with identifying products and confirming take-back arrangements.","needs_text":"Principal needs: N4, N9. N10–N13 apply at relevant checks, decisions and exchanges. The full need names are listed in the shared guidance.","needs":["N4","N9","N10","N13"],"outcome":"Contractors (SG5) have an agreed plan that identifies what should be removed, how it should be removed, and where the materials should go. As work progresses, contractors (SG5) and waste and recycling firms (SG14) record the quantities, conditions and destinations of the materials. These records support the subsequent reuse or recycling of materials and identify those whose destination remains unconfirmed. The cost and value comparison in Activity 3 informs recovery priorities before detailed planning.","lean":"The aim is to minimise damage to reusable components and the need for repeated handling and unplanned storage. Coordinating the removal process with transport and receiving organisations should help to avoid unnecessary delays and material losses.","notes":"Inventory checks, sequence planning and logistics are coordinated before removal. Proposed destinations remain provisional until the named receiving organisation confirms acceptance. Actual receipt and subsequent recovery require evidence.","review_questions":["Are the activities and their results necessary for this high-level use case?","Are the named stakeholder groups and information exchanges appropriate in practice?","Which assumptions, tool links or responsibilities require correction or confirmation?"],"iso_part":["none","Neither part covers planning a deconstruction or the information needed to recover materials. We are extending the standard here, not applying it."],"activities":[{"id":"HLUC4-A1","num":1,"name":"Agree the removal scope and material recovery goals","purpose":"Before developing a plan, contractors (SG5) and waste and recycling firms (SG14) need to establish a shared understanding of the intended removal work and recovery objectives. Agreeing on the scope, constraints and responsibilities helps to prevent the overlooking of recoverable components and avoids conflicting assumptions about what should be retained, removed or recovered.","when":"This activity begins when the building owners (SG4) start planning the selective removal or deconstruction of the building. It makes use of the available building and material records. Contractors (SG5) then review the scope and recovery objectives, establishing what is feasible through inspections and later assessments.","participants":"The building owners (SG4) establish the project's objectives and the intended scope of the removal. Architects and engineers (SG1) provide information on the building and technical constraints. Contractors (SG5) advise on access and removal considerations. Waste and recycling firms (SG14) advise on recovery arrangements and necessary documentation. Facility operators (SG9) provide current records and information on operating constraints. Local governments and public bodies (SG12) and building certification and standards bodies (SG3) provide advice within their areas of responsibility where relevant. IT providers and BIM integrators (SG11) support the preparation and exchange of information.","outcome":"Contractors (SG5) record the intended removal scope, the areas or components to protect, recovery objectives, timing and known constraints. The scope record identifies the criteria for comparing recovery options, the required evidence and the organisations responsible for supplying it. Uncertain conditions and matters requiring inspection are explicit.","needs_text":"N9 Planning disassembly and material recovery; N11 Coordination responsibilities and decision records; N12 Traceable evidence for compliance and assessment requirements; N13 Guidance for consistent information exchange.","needs":["N9","N11","N12","N13"],"checks":"Building owners (SG4) confirm objectives and scope. Architects and engineers (SG1) identify applicable requirements with local governments and public bodies (SG12) and building certification and standards bodies (SG3) where relevant. Gateway: Assessment scope agreed? Missing records trigger an agreed inspection or preparation task, not an assumed complete inventory.","discussion":["Is it clear what is intended for removal and what must remain protected?","Which recovery objectives and comparison criteria should guide the assessment?","What requirements and supporting evidence apply to the proposed work?","Who resolves information gaps and approves changes to the scope?"],"sg":["SG1","SG3","SG4","SG5","SG9","SG11","SG12","SG14"],"tool_codes":["t4.1","t4.2"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A1-E1","from":"Building owners (SG4)","to":"architects and engineers (SG1), contractors (SG5) and waste and recycling firms (SG14)","from_sg":["SG4"],"to_sg":["SG1","SG5","SG14"],"sg":["SG1","SG4","SG5","SG14"],"text":"The building owners (SG4) explain why removal is proposed, the intended extent of the work, timing and recovery objectives. The building owners (SG4) identify areas or components intended to remain and any budget or operational constraints. These establish the starting scope for assessment rather than confirming which materials can be recovered.","bpmn":"Task: Communicate removal scope and recovery goals","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["appointed","lead","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"appointing","stage":"sx"}},{"id":"HLUC4-A1-E2","from":"Facility operators (SG9), architects and engineers (SG1)","to":"contractors (SG5), waste and recycling firms (SG14) and IT providers and BIM integrators (SG11)","from_sg":["SG9","SG1"],"to_sg":["SG5","SG14","SG11"],"sg":["SG1","SG5","SG9","SG11","SG14"],"text":"They provide records of the available models, assets and materials, maintenance history, and known access or service constraints. They identify current versions, uncertain information and known gaps. Contractors (SG5) and waste and recycling firms (SG14) explain what additional information is required for inspection and planning purposes.","bpmn":"Task: Supply available building records and constraints","tools":{"status":"documented","codes":["t4.1","t4.2"],"text":"t4.1 requires an inventory and georeferenced BIM; t4.2 requires openBIM and an inventory. These are prerequisites for later planning."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"appointed party (SG9 facility operators) and appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A1-E3","from":"Relevant local governments and public bodies (SG12) and building certification and standards bodies (SG3)","to":"building owners (SG4), architects and engineers (SG1) and contractors (SG5)","from_sg":["SG12","SG3"],"to_sg":["SG4","SG1","SG5"],"sg":["SG1","SG3","SG4","SG5","SG12"],"text":"Local governments and public bodies (SG12) and building building certification and standards bodies (SG3) clarify applicable requirements and supporting evidence within their remit, where involved. Architects and engineers (SG1) identify the requirements relevant to the proposed work and matters needing further advice. The same conditional requirement-and-evidence procedure applies at relevant HLUC1 and HLUC2 decisions.","bpmn":"Task: Identify applicable requirements and evidence","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["third","third"],"to_roles":["appointing","appointed","lead"],"from_label":"third party (SG12 local governments and public bodies) and third party (SG3 building certification and standards bodies)","to_label":"appointing party (SG4 building owners) and appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"third","stage":"sx"}},{"id":"HLUC4-A1-E4","from":"Building owners (SG4)","to":"architects and engineers (SG1), contractors (SG5), waste and recycling firms (SG14), facility operators (SG9) and IT providers and BIM integrators (SG11)","from_sg":["SG4"],"to_sg":["SG1","SG5","SG14","SG9","SG11"],"sg":["SG1","SG4","SG5","SG9","SG11","SG14"],"text":"Following discussion with these participants, the building owners (SG4) confirm the assessment scope and recovery objectives. The shared record identifies who is responsible for supplying information, reviewing recovery options and making decisions, as well as how changes or missing information are reported. It also specifies the inspections and evidence required prior to subsequent decisions.","bpmn":"Task: Agree assessment scope and responsibilities","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["appointed","lead","appointed","appointed","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms) and appointed party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointing","stage":"sx"}}]},{"id":"HLUC4-A2","num":2,"name":"Check the material inventory and assess component condition","purpose":"Existing records may not reflect subsequent replacements, deterioration or undocumented changes. Checking the materials and their condition helps contractors (SG5) to avoid planning the recovery process based on incorrect quantities or unsuitable components, and to identify where further investigation is needed.","when":"This activity builds on the scope and recovery objectives agreed in Activity 1, providing an inventory to inform the comparison of recovery options in Activity 3. Contractors (SG5) will update the findings as further inspections and initial dismantling expose components that were previously inaccessible.","participants":"Facility operators (SG9) provide up-to-date asset and maintenance records. Architects and engineers (SG1) provide building information and review technical findings within their area of expertise. Contractors (SG5) inspect accessible components and report on their quantities, condition, connections, and access constraints. Waste and recycling firms (SG14) advise on recovery requirements. Material suppliers and manufacturers (SG13) assist with identifying products where necessary. IT providers and BIM integrators (SG11) update the inventory and its links to model elements.","outcome":"Contractors (SG5) have an inventory that has been checked and which identifies components, materials, locations, quantities and recorded condition. It distinguishes between inspected findings and estimates, as well as unverified records. For each item, it identifies relevant access or removal constraints, possible recovery options, and any further inspections or evidence required.","needs_text":"N9 Planning disassembly and material recovery; N10 Information quality for the next activity.","needs":["N9","N10"],"checks":"Contractors (SG5) inspect quantities and condition; architects and engineers (SG1) review technical findings. IT providers and BIM integrators (SG11) check required model information. Each responsible organisation corrects its records. Estimates and inaccessible conditions remain visible. Site evidence is needed to establish physical condition. Shared content. Core inventory and inspection fields correspond to HLUC1-A2. Deconstruction requires an updated review of condition, connections and removal constraints.","discussion":["Who is responsible for verifying quantities, condition and technical suitability?","How will the findings of inspections remain distinguishable from estimates and older records?","Which concealed conditions or uncertain properties require further investigation?","How will inventory entries retain consistent identifiers across the model and in subsequent recovery plans?"],"sg":["SG1","SG4","SG5","SG9","SG11","SG13","SG14"],"tool_codes":["t2.1","t2.2","t5.1"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A2-E1","from":"Facility operators (SG9), architects and engineers (SG1)","to":"contractors (SG5), waste and recycling firms (SG14) and IT providers and BIM integrators (SG11)","from_sg":["SG9","SG1"],"to_sg":["SG5","SG14","SG11"],"sg":["SG1","SG5","SG9","SG11","SG14"],"text":"Facility operators (SG9) and architects and engineers (SG1) provide contractors (SG5), waste and recycling firms (SG14) and IT providers and BIM integrators (SG11) with available models, material passports, asset records, maintenance histories and inspection findings. They reuse records prepared through HLUC3-A6 where available and identify replacements, uncertain quantities and gaps. Contractors (SG5) use these limits to focus site inspections.","bpmn":"Task: Supply existing inventory and building records","tools":{"status":"documented","codes":["t2.1","t2.2"],"text":"t2.1 supplies construction-stage material passports; t2.2 supplies handover models and documentation, where available."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed","appointed"],"from_label":"appointed party (SG9 facility operators) and appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A2-E2","from":"Contractors (SG5), with architects and engineers (SG1) reviewing relevant technical findings","to":"IT providers and BIM integrators (SG11) and waste and recycling firms (SG14)","from_sg":["SG5","SG1"],"to_sg":["SG11","SG14"],"sg":["SG1","SG5","SG11","SG14"],"text":"Contractors (SG5), architects and engineers (SG1) report on the components found, including their locations, quantities, visible condition, connections and access constraints. The findings include the inspection date and supporting evidence, such as photographs or measurements. Any inaccessible or concealed conditions remain unverified and require further checks.","bpmn":"Task: Inspect and report material condition","tools":{"status":"confirm","codes":["t2.1"],"text":"t2.1: confirm whether deconstruction inspection, condition evidence and revised quantities can update its records."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A2-E3","from":"Waste and recycling firms (SG14), with material suppliers and manufacturers (SG13) where relevant","to":"contractors (SG5), architects and engineers (SG1)","from_sg":["SG14","SG13"],"to_sg":["SG5","SG1"],"sg":["SG1","SG5","SG13","SG14"],"text":"Waste and recycling firms (SG14) and, where relevant, material suppliers and manufacturers (SG13) explain how the recorded properties and condition affect possible reuse, recycling or take-back. They identify further evidence or tests needed. Advice on recovery potential remains distinct from confirmed acceptance by a named receiving organisation; actual arrangements are developed in Activity 5.","bpmn":"Task: Assess potential recovery suitability","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG14 waste and recycling firms) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A2-E4","from":"Contractors (SG5), architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"building owners (SG4) and waste and recycling firms (SG14)","from_sg":["SG5","SG1","SG11"],"to_sg":["SG4","SG14"],"sg":["SG1","SG4","SG5","SG11","SG14"],"text":"Contractors (SG5) and architects and engineers (SG1) compile the checked inventory for building owners (SG4) and waste and recycling firms (SG14). IT providers and BIM integrators (SG11) maintain component and model links and check the required model information. Contractors (SG5) and architects and engineers (SG1) compare the inventory with site evidence and request corrections from the named organisations responsible. Remaining uncertainties pass with the inventory to Activity 3.","bpmn":"Task: Check and issue the current inventory","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 checks defined IFC requirements and generates results and BCF issues. It does not verify physical condition."},"iso":{"from_roles":["lead","appointed","appointed"],"to_roles":["appointing","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG4 building owners) and appointed party (SG14 waste and recycling firms)","lane":"lead","stage":"sx"}}]},{"id":"HLUC4-A3","num":3,"name":"Compare recovery options, costs and potential value","purpose":"The potential for recovery of a component does not establish whether it is practical or financially worthwhile to recover it. Comparing the options helps the building owners (SG4) to understand the work involved, the costs, the possible value and the uncertainties, before deciding which recovery routes to pursue. This comparison also takes into account the recovery objectives agreed in Activity 1.","when":"This activity uses the inventory checks and condition findings from Activity 2. It takes place before detailed disassembly and logistics planning. Contractors (SG5) will revisit the comparison if the inspections, prices or receiving arrangements change.","participants":"Contractors (SG5) estimate the cost of removal and preparation work. Waste and recycling firms (SG14) provide information on handling, transport and receiving. Material suppliers and manufacturers (SG13) offer advice on take-back or product recovery. Architects and engineers (SG1) coordinate technical constraints and provide reviews and comparisons. The building owners (SG4) agree the recovery priorities, with financial actors (SG10) providing advice on investment criteria where relevant.","outcome":"Architects and engineers (SG1) compile the recovery comparison with contractors (SG5) and waste and recycling firms (SG14). It identifies components and quantities, implementation and logistics costs, potential income or avoided costs, practical constraints and supporting evidence. Estimates remain distinct from quotations and confirmed offers. Building owners’ (SG4) agreed priorities and conditions guide subsequent planning.","needs_text":"N4 Assessing the business case for recovery and reuse; N9 Planning disassembly and material recovery.","needs":["N4","N9"],"checks":"Architects and engineers (SG1), contractors (SG5) and waste and recycling firms (SG14) identify the basis of costs and value. Building owners (SG4) choose priorities. Gateway: Recovery priorities agreed? Plan the selected routes or revise the comparison. Potential income and a proposed destination remain conditional until substantiated. Shared content. Cost, value and investment exchanges correspond to HLUC1-A5-E2/E3/E4. Earlier estimates are reviewed before they support current recovery choices.","discussion":["Does the comparison include the work and costs needed to make each recovery option feasible?","Which costs and values are estimates, and which have supporting quotations or offers?","How do recovery objectives influence the choice alongside financial results?","Which uncertainties must be resolved before detailed planning proceeds?"],"sg":["SG1","SG4","SG5","SG10","SG13","SG14"],"tool_codes":["t1.2","t4.1"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A3-E1","from":"Contractors (SG5)","to":"architects and engineers (SG1) and building owners (SG4)","from_sg":["SG5"],"to_sg":["SG1","SG4"],"sg":["SG1","SG4","SG5"],"text":"Contractors (SG5) estimate the work and costs required to remove components without causing unnecessary damage, preparing them for the proposed recovery route in the process. They also identify any access, separation, cleaning or repair requirements, and explain any assumptions, exclusions or uncertainties in their estimates.","bpmn":"Task: Estimate removal and preparation costs","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointed","appointing"],"from_label":"lead appointed party (SG5 contractors)","to_label":"appointed party (SG1 architects and engineers) and appointing party (SG4 building owners)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A3-E2","from":"Waste and recycling firms (SG14), material suppliers and manufacturers (SG13)","to":"architects and engineers (SG1) and building owners (SG4)","from_sg":["SG14","SG13"],"to_sg":["SG1","SG4"],"sg":["SG1","SG4","SG13","SG14"],"text":"They provide information on the costs of sorting, storage, transport, processing and receiving, together with the potential resale value or take-back terms. Each proposal specifies the materials, quantities and condition requirements, as well as the validity period. Possible destinations are distinguishable from those with confirmed acceptance and offers.","bpmn":"Task: Estimate logistics costs and potential value","tools":{"status":"documented","codes":["t4.1"],"text":"t4.1 estimates transport costs from inventory and location information. Estimates do not establish quotations or acceptance."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["appointed","appointing"],"from_label":"appointed party (SG14 waste and recycling firms) and appointed party (SG13 material suppliers and manufacturers)","to_label":"appointed party (SG1 architects and engineers) and appointing party (SG4 building owners)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A3-E3","from":"Building owners (SG4) and financial actors (SG10), where involved","to":"architects and engineers (SG1) and contractors (SG5)","from_sg":["SG4","SG10"],"to_sg":["SG1","SG5"],"sg":["SG1","SG4","SG5","SG10"],"text":"Building owners (SG4) and financial actors (SG10) confirm the budget, assessment period and financial criteria for the comparison. They explain how to consider implementation costs, potential income and avoided purchases against the recovery objectives from Activity 1. Earlier information from HLUC1-A5 can be reused where still relevant; condition, prices and acceptance must be reviewed for the current work.","bpmn":"Task: Confirm financial comparison assumptions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","third"],"to_roles":["appointed","lead"],"from_label":"appointing party (SG4 building owners) and third party (SG10 financial actors)","to_label":"appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"appointing","stage":"sx"}},{"id":"HLUC4-A3-E4","from":"Architects and engineers (SG1), contractors (SG5) and waste and recycling firms (SG14)","to":"building owners (SG4)","from_sg":["SG1","SG5","SG14"],"to_sg":["SG4"],"sg":["SG1","SG4","SG5","SG14"],"text":"They consistently present the recovery options, identifying the components, quantities, work, costs and potential value included in each one. They also explain any trade-offs, unconfirmed assumptions or missing evidence, helping the building owners (SG4) to understand how these factors could affect the comparison.","bpmn":"Task: Compare feasible recovery options","tools":{"status":"documented","codes":["t4.1","t1.2"],"text":"t4.1 supplies circular material scenario data and transport costs for part of the comparison.\nPossible link — confirm: t1.2: confirm whether earlier relevant results can be reused; no deconstruction business-case capability is established."},"iso":{"from_roles":["appointed","lead","appointed"],"to_roles":["appointing"],"from_label":"appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"sx"}},{"id":"HLUC4-A3-E5","from":"Building owners (SG4)","to":"architects and engineers (SG1), contractors (SG5) and waste and recycling firms (SG14)","from_sg":["SG4"],"to_sg":["SG1","SG5","SG14"],"sg":["SG1","SG4","SG5","SG14"],"text":"Building owners (SG4) confirm the recovery options to develop and their reasons, identifying the inventory and comparison versions and any conditions. This decision sets planning priorities; it does not release the combined disassembly and logistics plan for execution. Contractors (SG5) develop the sequence in Activity 4 and coordinate logistics in Activity 5 before the review in Activity 6.","bpmn":"Task: Agree recovery priorities for planning","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["appointed","lead","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","lane":"appointing","stage":"sx"}}]},{"id":"HLUC4-A4","num":4,"name":"Plan the order and method of disassembly","purpose":"If removal activities occur in the wrong order, recoverable components can be damaged or made inaccessible. Planning the sequence and method of removal in advance helps contractors (SG5) to protect components selected for recovery, while also accounting for building connections, access and service constraints.","when":"This activity uses the inventory checked in Activity 2 and the recovery priorities agreed in Activity 3. Contractors (SG5) coordinate the sequence with the handling and logistics arrangements in Activity 5, revising it as necessary when inspections or initial dismantling reveal different conditions.","participants":"Contractors (SG5) develop the disassembly plan. Architects and engineers (SG1) explain relevant building connections and technical constraints, and review matters within their area of expertise. Facility operators (SG9) identify service and access restrictions. Waste and recycling firms (SG14) explain the requirements for handling the intended recovery routes. IT providers and BIM integrators (SG11) establish links between tasks and model elements, and create visualisations where applicable. The building owners (SG4) review the implications for the agreed scope and timing.","outcome":"Contractors (SG5) produce a plan that links the selected components to the removal tasks, detailing their order, dependencies, and proposed methods. The plan also identifies the necessary protection and handling requirements, as well as any relevant technical reviews and unresolved site checks. Each outstanding action is assigned to a responsible person, and it is specified which task depends on its resolution.","needs_text":"N9 Planning disassembly and material recovery; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records.","needs":["N9","N10","N11"],"checks":"Contractors (SG5) develop the sequence; architects and engineers (SG1) review relevant connections and technical constraints. Facility operators (SG9) and waste and recycling firms (SG14) clarify access and handling. A simulation does not verify concealed conditions. Sequence and logistics changes are coordinated with Activity 5. Shared content. Selective-removal sequencing can support HLUC2-A3. Disassembly methods and site feasibility remain specific to the current work.","discussion":["Does the sequence protect components intended for recovery and those remaining in place?","Who reviews connections, service constraints and site feasibility?","Which tasks depend on further inspection or technical review?","How will changes remain coordinated with handling, transport and receiving arrangements?"],"sg":["SG1","SG4","SG5","SG9","SG11","SG14"],"tool_codes":["t4.2"],"iso_stage":"sx","exchanges":[{"id":"HLUC4-A4-E1","from":"Architects and engineers (SG1) and facility operators (SG9)","to":"contractors (SG5) and IT providers and BIM integrators (SG11)","from_sg":["SG1","SG9"],"to_sg":["SG5","SG11"],"sg":["SG1","SG5","SG9","SG11"],"text":"They provide the current model and a checked inventory, together with available information on connections, access, building services, and components that must be protected. They also identify any uncertain conditions and the technical investigations required before the affected removal tasks can be planned in detail.","bpmn":"Task: Supply component and technical constraints","tools":{"status":"documented","codes":["t4.2"],"text":"t4.2 uses openBIM and inventory information for component sequence planning."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG1 architects and engineers) and appointed party (SG9 facility operators)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointed","stage":"sx"}},{"id":"HLUC4-A4-E2","from":"Waste and recycling firms (SG14)","to":"contractors (SG5)","from_sg":["SG14"],"to_sg":["SG5"],"sg":["SG5","SG14"],"text":"They explain the handling and protection requirements associated with the recovery options chosen in Activity 3. They also identify any conditions that could affect the removal method or sequence, such as the need to keep components intact or separate materials. Contract
