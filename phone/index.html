   need room, but they should not stand between a reviewer and the workflow. */
function bgPage(which){

/* ------------------------------------------- filtered exchange lists
   The overview is a picture of 16 boxes; these are the ways back out of it into
   the rows underneath. An activity has a page of its own already, so a click on
   one simply goes there. A tool and a multi-activity box do not, so they get a
   list: the same exchanges, filtered, each row a door into the activity page
   where the reviewer can actually answer. */
function openAct(id){
  const x = ACT_BY_ID[id];
  if (!x) return;
  S.openUC.add(x.ui); S.openAC.add(x.ui + ':' + x.ai);
  go('act', x.ui, x.ai);
}
function showTool(code){
  S.filt = {kind:'tool', code:code, acts:null, name:null};
  go('filter');
}
function openBox(ids, name){
  const known = ids.filter(id => ACT_BY_ID[id]);
  if (!known.length) return;
  if (known.length === 1){ openAct(known[0]); return; }
  S.filt = {kind:'acts', code:null, acts:known, name:name || null};
  go('filter');
}
function filterHits(){
  const f = S.filt;
  if (!f) return [];
  if (f.kind === 'tool')
    return EXS.filter(x => (x.e.tools.codes || []).indexOf(f.code) >= 0);
  return EXS.filter(x => f.acts.indexOf(x.a.id) >= 0);
}
function filtHash(){
  const f = S.filt;
  if (!f) return '#overview';
  return f.kind === 'tool' ? '#tool=' + encodeURIComponent(f.code)
                           : '#box=' + f.acts.join(',');
}
function filterView(){
  const f = S.filt;
  if (!f){ S.view = 'overview'; return contextView(); }
  const hits = filterHits();
  const nAct = new Set(hits.map(x => x.a.id)).size;
  let head;
  if (f.kind === 'tool'){
    const d = (DATA.tool_about || {})[f.code] || {};
    head = '<div class="cx-sec"><h2>' + esc(f.code) + ' &middot; ' +
        esc(d.name || DATA.tools[f.code] || f.code) + '</h2>' +
        '<span>Every information exchange in the workflow that names this tool</span></div>' +
      '<div class="cx-grid"><section class="cx-card cx-wide">' +
      (d.about ? '<p>' + esc(d.about) + '</p>'
               : '<p class="cx-note">No tool summary has been supplied for this entry yet, ' +
                 'so everything below is our reading rather than the owner&rsquo;s.</p>') +
      '<p class="fcount"><b>' + hits.length + '</b> of the ' + EXS.length +
        ' information exchanges name it, across <b>' + nAct + '</b> ' +
        (nAct === 1 ? 'activity' : 'activities') +
        '. Open any row to answer it where it belongs.</p></section></div>';
  } else {
    const names = f.acts.map(id => (ACT_BY_ID[id] || {a:{}}).a.name).filter(Boolean);
    head = '<div class="cx-sec"><h2>' + esc(f.name || names[0] || 'Selected activities') +
        '</h2><span>The activities this box covers, and every exchange in them</span></div>' +
      '<div class="cx-grid"><section class="cx-card cx-wide">' +
      '<p class="fcount">One box on the overview, <b>' + f.acts.length +
        '</b> activities and <b>' + hits.length +
        '</b> information exchanges. Open any row to answer it where it belongs.</p>' +
      '</section></div>';
  }
  /* EXS is already in workflow order, so grouping is a single pass */
  const groups = [];
  hits.forEach(x => {
    const last = groups[groups.length - 1];
    if (last && last.a.id === x.a.id) last.rows.push(x);
    else groups.push({a:x.a, ui:x.ui, ai:x.ai, rows:[x]});
  });
  const body = groups.map(g =>
    '<section class="cx-card cx-wide fgrp">' +
      '<button class="fact" data-fact="' + g.ui + ':' + g.ai + '">' +
        '<span class="fid">' + esc(g.a.id) + '</span><b>' + esc(g.a.name) + '</b>' +
        '<i>' + g.rows.length + ' of ' + g.a.exchanges.length + '</i></button>' +
      g.rows.map(x => {
        const e = x.e;
        return '<button class="frow" data-fex="' + x.ui + ':' + x.ai + ':' + x.ei + '">' +
          '<span class="fid">' + esc(e.id.split('-').pop()) + '</span>' +
          '<span class="fbody">' +
            '<span class="fparty">' + esc(e.from) + ' &rarr; ' + esc(e.to) + '</span>' +
            '<span class="ftext">' + sgMark(e.text) + '</span>' +
            (e.tools.text ? '<span class="ftool">' + toolMark(e.tools.text) + '</span>' : '') +
          '</span></button>';
      }).join('') +
    '</section>').join('');
  const back = '<div class="nextbar fback"><button class="btn" data-goto="view:overview">' +
    '<span class="nx"><i>Back</i><b>The overview</b></span></button></div>';
  return head + '<div class="cx-grid">' + body + '</div>' + back + foot();
}

  $('#cascade').innerHTML =

    '<button class="ctxnav'+(S.view==='background'?' sel':'')+'" data-view="background">'+

/* ================================================================ rendering */
/* bottom pager on the phone: step through activities without opening the drawer */
function paintPager(){
  const bar = $('#pbar');
  if (!PHONE || S.view !== 'act'){ bar.innerHTML = ''; return; }
  const i = ACTS.findIndex(x => x.ui === S.uc && x.ai === S.act);
  const a = curAC();
  const p = progress(x => x.ui === S.uc && x.ai === S.act);
  const arrow = d => '<svg viewBox="0 0 24 24"><path d="M'+(d<0?'15 6l-6 6 6 6':'9 6l6 6-6 6')+'"/></svg>';
  bar.innerHTML =

      '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>'+
    '<span class="pg"><b>'+esc(a.id)+' &middot; '+esc(a.name)+'</b>'+
      p.done+' of '+p.must+' answered here</span>'+

function render(opts){
  document.body.classList.toggle('phone', PHONE);
  document.body.style.setProperty('--accent', UCC[S.uc]);
  buildCascade();
  if (CTXV.includes(S.view)) $('#view').innerHTML = contextView();
  else if (S.view === 'progress') $('#view').innerHTML = progressView();
  else if (S.view === 'filter') $('#view').innerHTML = filterView();
  else if (S.view === 'uc') $('#view').innerHTML = ucView();
  else $('#view').innerHTML = actView();
  buildNeeds();
  paintPager();
  const im = $('#isoMode'); if (im) im.textContent = isoModeLabel();
  if (S.view === 'overview') ovDraw();
  document.body.classList.toggle('onlyhits', S.only);
  $('#drawerBtn').classList.toggle('hidden', !PHONE);
  paintRing();
  /* jump, never animate: smoothly scrolling a long activity back to the top is
     slow on a phone, and the page has just been replaced anyway */
  if (opts && opts.top) $('#main').scrollTo({top:0, behavior:'auto'});
  if (S.view === 'act' && S.ex != null){
    const e = curAC().exchanges[S.ex];
    const tr = document.getElementById('ex-'+e.id);
    if (tr){ tr.classList.remove('flash'); void tr.offsetWidth; tr.classList.add('flash');
             tr.scrollIntoView({block:'center', behavior:'smooth'}); }
  }
  const t = S.view === 'act' ? curAC().id + ' · ' + curAC().name
          : S.view === 'uc' ? curUC().id + ' · ' + curUC().name
          : 'Workflow review';
  document.title = t + ' · DTERBIM';
  try {
    history.replaceState(null,'', S.view === 'act'
      ? '#'+curAC().id + (S.ex != null ? '-'+(S.ex+1) : '')
      : S.view === 'uc' ? '#'+curUC().id
      : S.view === 'filter' ? filtHash() : '#'+S.view);
  } catch (err) { /* opaque origin: the page works, the address bar just stops following */ }
}

/* ----------------------------------------------------------- progress page */
function progressView(){
  const p = progress();
  const rows = UCS.map((u,ui) => {
    const q = progress(x => x.ui === ui);
    return '<div class="progrow"><span class="pn" style="background:'+UCC[ui]+'">'+u.num+'</span>'+

  }).join('');

    ? esc(state.org === 'OTHER' ? (state.orgOther || 'Other') :
        (DATA.meta.orgs.find(o => o.code === state.org) || {name:state.org}).name)
    : '<span style="color:var(--chg)">not set &mdash; please set it on <i>Read this first</i></span>';
  const saved = state.savedAt
    ? 'Saved in this browser at ' + new Date(state.savedAt).toLocaleTimeString([],
        {hour:'2-digit',minute:'2-digit'}) : 'Nothing entered yet';

  return '<div class="prog">'+
    '<h2>My review</h2>'+
    '<p style="font-size:12.5px;color:var(--steel);margin:0 0 4px">Reviewer: <b>'+who+'</b>'+
    (state.person ? ' &middot; ' + esc(state.person) : '')+' &middot; '+esc(saved)+'</p>'+
    '<div class="tally">'+
      '<div class="tl"><b>'+p.done+' / '+p.must+'</b><i>exchanges answered</i></div>'+
      '<div class="tl"><b>'+Object.keys(state.act).filter(k => {
          const r = state.act[k];
          return (r.v && Object.values(r.v).some(v => v.verdict))
              || (r.note||'').trim() || (r.disc||'').trim();
        }).length+'</b><i>activities answered</i></div>'+
      '<div class="tl"><b>'+countNotes()+'</b><i>comments written</i></div>'+
      '<div class="tl"><b>'+countEdits()+'</b><i>additions &amp; removals</i></div>'+
    '</div>'+
    '<p style="font-size:11.5px;color:var(--mute);margin:2px 0 12px">'+
      (state.lenses.length
        ? 'Counted against your lens: '+state.lenses.map(k => esc(lensShort(k))).join(', ')+
          '. Exchanges that do not involve your lens are not counted as outstanding.'
        : 'No lens selected, so every one of the '+DATA.meta.counts.exchanges+
          ' exchanges counts. Pick your lens to see only what concerns you.')+'</p>'+
    rows +
    '<div class="btnrow">'+
      '<button class="btn pri" id="btnExport"><svg viewBox="0 0 24 24">'+
        '<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg>Download my answers</button>'+
      '<button class="btn" id="btnSaveProg"><svg viewBox="0 0 24 24">'+
        '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7"/></svg>Save progress file</button>'+
      '<button class="btn ghost" id="btnLoadProg"><svg viewBox="0 0 24 24">'+
        '<path d="M12 20V8M7 13l5-5 5 5M4 4h16"/></svg>Load progress file</button>'+
      '<button class="btn ghost" id="btnReset">Clear everything</button>'+
    '</div>'+
    '<p style="font-size:11px;color:var(--mute);margin-top:11px;line-height:1.55">'+
      '<b>Download my answers</b> writes a JSON file &mdash; email it back to us. '+
      '<b>Save progress</b> writes a file you can load on another computer to carry on. '+
      'On a phone both offer the share sheet, so you choose where the file goes; only if the '+
      'browser refuses to write a file at all is the text shown to copy out. '+
      'Your answers also save themselves in this browser as you type, but clearing site data '+
      'or using a private window loses them, so keep a file of your own at the end of a session.</p>'+
    '</div>' + foot();
}

/* ---------------------------------------------------------- use case page */

  const steps = u.activities.map((a,i) => {
    const q = progress(x => x.ui === S.uc && x.ai === i);
    return '<div class="step"><button class="box'+(q.must&&q.done===q.must?' isdone':'')+
      '" data-uc="'+S.uc+'" data-ac="'+i+'">'+
      '<span class="sid">A'+a.num+'</span><span class="snm">'+esc(a.name)+'</span></button>'+
      (i < u.activities.length-1 ? '<span class="arr">'+ARROW+'</span>' : '')+'</div>';
  }).join('');
  return '<section class="ahead">'+
      '<div class="crumb"><span class="pill">'+esc(u.id)+'</span><span>'+esc(u.phase)+
        '</span></div>'+
      '<h1>'+esc(u.name)+'</h1>'+
      /* folded by default: the same wording returns on every activity page below */
      '<details class="fold"><summary>What this use case is for</summary>'+
        '<div class="foldbody"><div class="facts">'+
          fact('Purpose', u.purpose)+
          fact('Expected outcome and next activity', u.outcome)+
        '</div>'+
        fold('The rest of the description', '<div class="facts">'+
          fact('Basis in the findings', u.basis)+fact('Starting point', u.start)+

          fact('Intended lean benefit', u.lean)+fact('Needs addressed', u.needs_text)+
        '</div>', true)+

    '<section class="exbox"><div class="exboxhead"><h2>Activities</h2>'+

      '<div class="flownote" style="margin-top:13px"><span>&#9432;</span><span>'+
      esc(u.notes)+'</span></div></div></section>'+
    verdictBlock('uc', u.id, 'Your verdict on '+u.id+' as a whole',
      'After going through its activities: does this use case describe the right work, in the '+
      'right order, with the right people?') + nextBar() + foot();
}

/* ----------------------------------------------------------- activity page */
function actView(){
  const u = curUC(), a = curAC();
  return flowStrip() + actHead() + exTable() + extraCards() +
    verdictBlock('act', a.id, 'Your verdict on '+a.id,
      'Is this activity needed, in the right place, and complete?', true) + nextBar() + foot();
}
function flowStrip(){
  const u = curUC(), a = curAC();
  const phases = UCS.map((x,i) =>
    '<button class="phase'+(i===S.uc?' on':'')+'" data-uc="'+i+'"'+
    (i===S.uc?' style="background:'+UCC[i]+';border-color:'+UCC[i]+'"':'')+'>'+
    '<span class="n" style="background:'+UCC[i]+';'+(i===S.uc?'color:'+UCC[i]:'')+'">'+x.num+
    '</span><span class="px">'+esc(x.phase_short)+'<i>'+x.activities.length+' activities &middot; '+
    x.activities.reduce((s,y)=>s+y.exchanges.length,0)+' exchanges</i></span></button>').join('');
  const steps = u.activities.map((x,i) => {
    const q = progress(y => y.ui === S.uc && y.ai === i);
    return '<div class="step'+(i===S.act?' on':'')+'">'+
      '<button class="box'+(q.must&&q.done===q.must?' isdone':'')+'" data-uc="'+S.uc+'" data-ac="'+i+'">'+
      '<span class="sid">A'+x.num+'</span><span class="snm">'+esc(x.name)+'</span></button>'+
      (i < u.activities.length-1 ? '<span class="arr">'+ARROW+'</span>' : '')+'</div>';
  }).join('');
  return '<section class="flow'+(S.flow?' open':'')+'" id="flow">'+
    '<div class="flowbar" id="flowBar"><button class="iconbtn" tabindex="-1">'+
      '<svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></button>'+
      '<span class="t">Where am I in the workflow</span>'+
      '<span class="here">'+esc(u.phase_short)+' · '+esc(a.id)+'</span>'+CARET+'</div>'+
    '<div class="flowbody"><div class="phases">'+phases+'</div>'+
      '<div class="steps">'+steps+'</div>'+
      '<div class="flownote"><span>&#9432;</span><span>'+esc(u.notes)+'</span></div></div></section>';
}
/* On a desktop everything can be on screen at once and the structure reads well;
   on a phone it is a wall, so the same blocks start folded. */
const foldOpen = () => PHONE ? '' : ' open';
function fold(title, body, sub){
  return '<details class="fold'+(sub?' sub':'')+'"'+(sub?'':foldOpen())+'>'+
    '<summary>'+esc(title)+'</summary><div class="foldbody">'+body+'</div></details>';
}
/* The tick on an assignment card is a fact, so it is only shown for a partner
   who has actually returned something for that use case. */
function didReview(uc){
  return RET.orgs.filter(o => (o.ucs || []).includes(uc.id)).map(o => o.code);
}
function fact(h,t){ return t ? '<div class="fact"><h4>'+h+'</h4><p>'+sgMark(t)+'</p></div>' : ''; }
function actHead(){

    '<div class="crumb"><span class="pill">'+esc(u.id)+'</span><span>'+esc(u.phase)+'</span>'+

    '<div class="aidbig">'+esc(a.id)+'</div><h1>'+esc(a.name)+'</h1>'+
    '<details class="fold"><summary>What this activity is for</summary>'+
      '<div class="foldbody"><div class="facts">'+
        fact('Purpose',a.purpose)+fact('Expected outcome',a.outcome)+'</div>'+

/* ----------------------------------------------------- the exchange table */
function exTable(){
  const a = curAC();
  const hits = state.lenses.length
    ? a.exchanges.filter(e => isMust(e)).length : a.exchanges.length;
  const head = '<div class="exboxhead"><h2>Information exchanges</h2>'+
    '<span class="n">'+a.exchanges.length+' in '+esc(a.id)+
    (state.lenses.length ? ' &middot; '+hits+' involve your lens' : '')+'</span>'+
    (state.lenses.length ? '<label class="n" style="margin-left:auto;cursor:pointer">'+
      '<input type="checkbox" id="onlyHits"'+(S.only?' checked':'')+'> show only mine</label>' : '')+
    '</div>';
  if (PHONE)
    return '<section class="exbox" style="border:0;background:none">'+
      '<section class="exbox" style="border-radius:12px 12px 0 0;border-bottom:0">'+head+
      '</section><div style="margin-top:11px">'+
      a.exchanges.map(e => exCard(e)).join('')+'</div></section>';
  return '<section class="exbox">'+head+
    '<table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4">'+
    '</colgroup><thead><tr><th>Exchange</th><th>Stakeholders</th>'+
    '<th>Information exchange and purpose</th><th>Relevant tools</th></tr></thead><tbody>'+
    a.exchanges.map(e => exRow(e)).join('')+'</tbody></table></section>';
}

/* one exchange as a card: everything the table row holds, stacked, with the
   add / remove / confirm controls folded away behind "Change something". */
function exCard(e){
  const miss = state.lenses.length && !isMust(e);
  const r = state.ex[e.id] || {};
  const open = S.openEdit.has(e.id);
  const touched = ['stake','info','tools'].some(c => r[c] &&
    (r[c].ok || r[c].add.length || r[c].del.length || (r[c].note||'').trim()));
  const answered = exAnswered(e);
  const lensPips = state.lenses.filter(k => exHasLens(e,k)).map(k =>
    '<span class="chip" style="background:'+lensColor(k)+'">'+esc(lensShort(k))+'</span>').join('');
  const cell = (c,label) => '<div class="eh">'+label+'</div>'+cellCtl(e,c,r[c]);

  return '<article class="xcard'+(miss?' miss':'')+(open?' editing':'')+'" id="ex-'+esc(e.id)+'">'+
    '<div class="xtop"><span class="eid">'+esc(e.id)+'</span>'+
      (lensPips ? '<div class="exlens">'+lensPips+'</div>' : '')+
      '<span class="xmark '+(answered?'done':'todo')+'">'+
        (answered ? 'answered' : 'not answered')+'</span></div>'+
    '<div class="xsec xflow">'+
      '<div class="xnode"><span class="role">from</span>'+isoParty(e.from,e.iso&&e.iso.from_label,false)+'</div>'+
      '<div class="xconn"><span class="xtx">'+sgMark(flowText(e))+'</span></div>'+
      '<div class="xnode to"><span class="role">to</span>'+isoParty(e.to,e.iso&&e.iso.to_label,true)+'</div>'+
    '</div>'+
    '<div class="xsec"><h5>Relevant tools</h5><div class="toolcell">'+toolCell(e)+'</div></div>'+
    '<div class="xverd">'+verdLines('ex',e.id,true)+saidBlock('ex',e.id)+'</div>'+
    '<button class="xmore" data-edit="'+esc(e.id)+'">'+
      (open ? 'Hide the change controls' :
        (touched ? 'Changes recorded · show them' : 'Confirm, add or remove something'))+
      '<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>'+
    '<div class="xedit">'+cell('stake','Stakeholders')+cell('info','Information and purpose')+
      cell('tools','Relevant tools')+'</div>'+
    '</article>';
}
/* The sender is the box directly above the arrow, so the text on the arrow does
   not need to open by naming them again. Only an exact repetition is removed; an
   exchange phrased any other way keeps its wording untouched. */
/* the receiving party sits after the arrow in the source sentence, so it arrives
   lower-cased; as a box of its own it should read as one */
function upFirst(t){
  t = (t || '').trim();
  return t ? t.charAt(0).toUpperCase() + t.slice(1) : t;
}
function flowText(e){
  const who = (e.from || '').trim().replace(/,$/,'');
  let t = (e.text || '').trim();
  if (who && t.startsWith(who)) t = t.slice(who.length).replace(/^[\s,:;—-]+/,'');
  return t || (e.text || '');
}
/* Mark the tool codes where they already stand in the sentence, instead of listing
   them again above it. Hovering one says what the tool is; tapping one does the same
   on a phone, where there is no hover. */
const TOOL_RE = /\b(CDE-[sd]|Orchestrator|BDT|CDT|t\d\.\d)\b/g;
function toolTitle(c){
  const d = (DATA.tool_about || {})[c];
  const nm = (d && d.name) || DATA.tools[c] || c;
  return d && d.about ? nm + ' \u2014 ' + d.about : nm;
}
function toolMark(t){
  return esc(t).replace(TOOL_RE, c => {
    const on = state.lenses.includes('T:' + c);
    return '<span class="tcode'+(on?' me':'')+'"'+
      (on ? ' style="--lc:'+lensColor('T:'+c)+'"' : '')+
      ' data-tool="'+esc(c)+'" title="'+esc(toolTitle(c))+'">'+esc(c)+'</span>';
  });
}
function toolCell(e){
  const t = e.tools;
  if (t.status === 'none')
    return '<div class="tstat none"><span class="sq"></span>none identified</div>'+
           '<div class="tnone">No specific tool contribution identified for this handoff.</div>';
  if (t.status === 'same')
    return '<div class="tstat none"><span class="sq"></span>as above</div>'+
           '<div class="tnone">'+esc(t.text)+'</div>';
  /* One cell often carries two statements: what a tool is documented to do, and a
     further link the owner still has to confirm. Labelling them separately beats one
     status chip contradicting the sentence underneath it. */
  const unsaid = t.codes.filter(c => t.text.indexOf(c) < 0);
  return toolParts(t).map(p =>
      '<div class="tpart"><div class="tstat '+p.status+'"><span class="sq"></span>'+
      (p.status === 'documented' ? 'documented contribution' : 'possible link &mdash; confirm')+
      '</div><div>'+toolMark(p.text)+'</div></div>').join('')+
    (unsaid.length ? '<div class="talso">also '+toolMark(unsaid.join(', '))+'</div>' : '');
}
const CONFIRM_RE = new RegExp(
  '\\s*Possible link\\s*[\\u2014,-]\\s*(?:confirm|to be confirmed)\\s*:?\\s*', 'ig');
function toolParts(t){
  const chunks = (t.text || '').split(CONFIRM_RE).map(x => x.trim()).filter(Boolean);
  if (chunks.length < 2) return [{status: t.status, text: (t.text || '').trim()}];
  return [{status: t.status, text: chunks[0]}].concat(
    chunks.slice(1).map(x => ({status: 'confirm', text: x})));
}
function exRow(e){
  const miss = state.lenses.length && !isMust(e);
  const r = state.ex[e.id] || {};
  const tool = toolCell(e);
  const lensPips = state.lenses.filter(k => exHasLens(e,k)).map(k =>
    '<span class="chip" style="background:'+lensColor(k)+'">'+esc(lensShort(k))+'</span>').join('');

  return '<tr class="body'+(miss?' miss':'')+'" id="ex-'+esc(e.id)+'">'+
      '<td><span class="eid">'+esc(e.id.split('-').pop())+'</span>'+
        (lensPips ? '<div class="exlens">'+lensPips+'</div>' : '')+'</td>'+
      '<td><div class="party">'+isoParty(e.from,e.iso&&e.iso.from_label,false)+'<div class="arrow">'+ARROW+'<i>to</i></div>'+
        isoParty(e.to,e.iso&&e.iso.to_label,false)+'</div>'+cellCtl(e,'stake',r.stake)+'</td>'+
      '<td><div class="purpose">'+sgMark(e.text)+'</div>'+
        cellCtl(e,'info',r.info)+'</td>'+
      '<td><div class="toolcell">'+tool+'</div>'+cellCtl(e,'tools',r.tools)+'</td>'+
    '</tr>'+
    '<tr class="verd'+(miss?' miss':'')+'"><td colspan="4">'+verdLines('ex',e.id,true)+
      saidBlock('ex',e.id)+'</td></tr>';
}

/* confirm / add / remove / comment, per cell */
const CELL_CFG = {
  stake: {kind:'sg',   addLbl:'Add group',  delLbl:'Remove group'},
  tools: {kind:'tool', addLbl:'Add tool',   delLbl:'Remove tool'},
  info:  {kind:null},
};
function cellCtl(e, cell, rec){
  const c = CELL_CFG[cell];
  rec = rec || {ok:false, add:[], del:[], note:''};
  const has = rec.ok || rec.add.length || rec.del.length || (rec.note||'').trim();
  let bar = '<button class="cb'+(rec.ok?' ok':'')+'" data-cell="'+cell+'" data-ex="'+esc(e.id)+
    '" data-do="ok">'+TICK+(rec.ok?'Confirmed':'Confirm')+'</button>';
  if (c.kind){
    bar += '<button class="cb" data-cell="'+cell+'" data-ex="'+esc(e.id)+'" data-do="add">'+
      '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'+c.addLbl+'</button>'+
      '<button class="cb" data-cell="'+cell+'" data-ex="'+esc(e.id)+'" data-do="del">'+
      '<svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>'+c.delLbl+'</button>';
  }
  bar += '<button class="cb'+((rec.note||'').trim()?' act':'')+'" data-cell="'+cell+
    '" data-ex="'+esc(e.id)+'" data-do="note">'+
    '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 10-4-4L4 16z"/></svg>'+
    ((rec.note||'').trim() ? 'Comment · written' : 'Comment')+'</button>';

  const chips = rec.add.map(v => '<span class="edit add" data-ex="'+esc(e.id)+'" data-cell="'+cell+
      '">+ '+esc(v)+' '+esc(lookupName(c.kind,v))+
      '<span class="x" data-undo="add" data-val="'+esc(v)+'">&times;</span></span>')
    .concat(rec.del.map(v => '<span class="edit del" data-ex="'+esc(e.id)+'" data-cell="'+cell+
      '">&minus; <s>'+esc(v)+' '+esc(lookupName(c.kind,v))+'</s>'+
      '<span class="x" data-undo="del" data-val="'+esc(v)+'">&times;</span></span>')).join('');

  const open = openPick.ex === e.id && openPick.cell === cell;
  let pick = '';
  if (open){
    const opts = openPick.mode === 'del'
      ? (cell === 'stake' ? e.sg : e.tools.codes)
      : (cell === 'stake' ? SG_USED : TOOLS_USED);
    const noun = c.kind === 'sg' ? 'stakeholder group' : 'tool';
    const verb = openPick.mode === 'del' ? 'removed' : 'added';
    pick = '<div class="pick">'+
      '<span class="picklbl">Which '+noun+' should be '+verb+'?</span>'+
      '<select id="pickSel">'+
      (opts.length
        ? '<option value="">— choose a '+noun+' —</option>'+
          opts.map(v => '<option value="'+esc(v)+'">'+esc(v)+' — '+
            esc(lookupName(c.kind,v))+'</option>').join('')
        : '<option value="">nothing listed here to remove</option>')+
      '</select><button class="cb act" data-pickok="1">'+
      (openPick.mode === 'del' ? 'Remove this' : 'Add this')+'</button>'+
      '<button class="cb" data-pickcancel="1">Cancel</button></div>';
  }
  const noteOpen = (rec.note||'').trim() || openNote === e.id+'|'+cell ||
                   rec.add.length || rec.del.length;
  const note = noteOpen ? '<textarea class="note" data-note="cell" data-ex="'+esc(e.id)+
    '" data-cell="'+cell+'" placeholder="'+
    (rec.add.length || rec.del.length ? 'Why this change?' : 'Comment on this cell')+
    '">'+esc(rec.note||'')+'</textarea>' : '';

  return '<div class="cellbar">'+bar+'</div>'+
    (chips ? '<div class="edits">'+chips+'</div>' : '') + pick + note;
}
function lookupName(kind,v){
  if (kind === 'sg') return (DATA.stakeholders[v] || {}).short || '';
  if (kind === 'tool') return DATA.tools[v] || '';
  return '';
}

/* One line per active lens. The change options and the comment box are not there
   until they are wanted: the options appear on "agree with changes" or "disagree",
   the comment with them or on the pen. Nothing greyed out, nothing taking space. */
function verdLines(scope, id, withMoves){
  const ks = activeLenses();
  const bag = scope === 'ex' ? (state.ex[id] || {}) :
              scope === 'act' ? (state.act[id] || {}) : (state.uc[id] || {});
  const v = bag.v || {};
  const lines = ks.map(k => {
    const rec = v[k] || {verdict:'', note:'', change:''};
    const col = k === 'GEN' ? '' : lensColor(k);
    const lbl = k === 'GEN' ? 'Overall' : lensShort(k) + '-lens';
    const why = rec.verdict === 'changes' || rec.verdict === 'disagree';
    const d = ' data-scope="'+scope+'" data-id="'+esc(id)+'" data-lens="'+esc(k)+'"';
    const open = why || (rec.note||'').trim() || S.openV.has(scope+'|'+id+'|'+k);
    const chips = (withMoves && why)
      ? '<div class="vchg">'+MOVES.map(([val,txt]) =>
          '<button class="cb'+(rec.change===val?' act':'')+'" data-vchg="'+val+'"'+d+'>'+
          esc(txt)+'</button>').join('')+'</div>' : '';
    const note = open
      ? '<span class="vnote"><textarea class="note" data-note="v"'+d+' placeholder="'+
        (why ? 'What should change, and why?' : 'Optional comment')+'">'+esc(rec.note||'')+
        '</textarea></span>'
      : '<button class="cb vpen" data-vnote="1"'+d+'>'+PEN+'Comment</button>';
    return '<div class="vline">'+
      '<span class="vlens'+(k==='GEN'?' gen':'')+'"'+(col?' style="background:'+col+'"':'')+'>'+
        esc(lbl)+'</span>'+
      '<span class="vbtns">'+VERDICTS.map(([val,txt,short]) =>
        '<button class="vb'+(rec.verdict===val?' on':'')+'" data-v="'+val+'"'+d+
        ' title="'+esc(txt)+'">'+esc(PHONE ? short : txt)+'</button>').join('')+'</span>'+
      (chips ? '' : note) + chips + (chips ? note : '') + '</div>';
  }).join('');
  const hint = '';
  return (hint ? '<div class="verds"><div class="verdhint">'+hint+'</div>' : '<div class="verds">')+
    lines + '</div>';
}

/* activity / use case verdict block. The change options now live on each lens line,
   because the answer can differ by lens; this block keeps only a free comment. */
function verdictBlock(scope, id, title, sub, withMoves){
  const rec = scope === 'act' ? (state.act[id] || {}) : (state.uc[id] || {});
  const open = (rec.note||'').trim() || S.openB.has(scope+'|'+id);
  const d = ' data-scope="'+scope+'" data-id="'+esc(id)+'"';
  const note = open
    ? '<textarea class="note" data-note="block"'+d+' placeholder="'+
      (scope === 'uc' ? 'Anything about this use case as a whole'
                      : 'Anything about this activity')+'">'+esc(rec.note||'')+'</textarea>'
    : '<div class="blockpen"><button class="cb" data-bnote="1"'+d+'>'+PEN+
      'Add a comment</button></div>';
  return '<div class="revblock"><h3>'+esc(title)+'</h3><p class="rh">'+esc(sub)+'</p>'+
    verdLines(scope,id,withMoves) + note + saidBlock(scope,id) + '</div>';
}

function extraCards(){
  const a = curAC();
  const rec = state.act[a.id] || {};
  const open = (rec.disc||'').trim() || S.openD.has(a.id);
  return '<section class="extra">'+
    (a.checks ? '<div class="card gate"><h3>Checks and decisions</h3><p>'+sgMark(a.checks)+'</p>'+
      '<p class="src">What has to be true before the activity can close, and the record it '+
      'leaves behind. Taken from the <i>Checks and decisions</i> section of this activity\'s '+
      'write-up, which is also where its BPMN gateway comes from.</p></div>' : '')+
    (a.discussion.length ? '<div class="card disc"><h3>Points for discussion</h3><ul>'+
      a.discussion.map(d => '<li>'+sgMark(d)+'</li>').join('')+'</ul>'+
      '<p class="src">Our own open questions on this activity, from the <i>Points for '+
      'discussion</i> list in its write-up. Answer any of them here.</p>'+
      (open
        ? '<textarea class="note" data-note="disc" data-id="'+esc(a.id)+
          '" placeholder="Your answer to any of these">'+esc(rec.disc||'')+'</textarea>'
        : '<div class="blockpen"><button class="cb" data-dnote="'+esc(a.id)+'">'+PEN+
          'Answer these</button></div>')+
      '</div>' : '')+
    '</section>';
}

/* what other partners have already said about this exchange, activity or use case */
function saidBlock(scope, id){
  if (!RET_ANY) return '';
  const rows = (RET[scope] || {})[id] || [];
  const cells = scope === 'ex' ? ((RET.cells || {})[id] || []) : [];
  if (!rows.length && !cells.length) return '';
  const vtxt = v => (VERDICTS.find(x => x[0] === v) || [,''])[1];
  const mtxt = c => (MOVES.find(x => x[0] === c) || [,''])[1];
  const who = r => '<span class="saidorg">'+esc(r.org)+
    (r.who ? '<i>'+esc(r.who)+'</i>' : '')+'</span>';
  const lensTx = k => !k ? '' : (k.startsWith('T:') ? 'as tool '+esc(k.slice(2))
                                                    : 'as '+esc(lensShort(k)));
  const vrows = rows.map(r => '<div class="saidrow">'+who(r)+
    (r.verdict ? '<span class="saidv '+esc(r.verdict)+'">'+esc(vtxt(r.verdict))+'</span>' : '')+
    '<span class="saidtx">'+
      (r.lens ? '<em>'+lensTx(r.lens)+'</em> ' : '')+
      (r.change ? '<em>'+esc(mtxt(r.change))+'.</em> ' : '')+
      (r.kind === 'disc' ? '<em>on the points for discussion:</em> ' : '')+
      (r.note ? esc(r.note) : (r.verdict ? '' : '<em>no comment</em>'))+
    '</span></div>').join('');
  const crows = cells.map(c => '<div class="saidrow">'+who(c)+
    '<span class="saidtx"><em>'+esc({stake:'stakeholders', info:'information and purpose',
      tools:'relevant tools'}[c.cell] || c.cell)+':</em> '+
      (c.add.length ? 'add '+esc(c.add.join(', '))+'. ' : '')+
      (c.del.length ? 'remove '+esc(c.del.join(', '))+'. ' : '')+
      esc(c.note)+'</span></div>').join('');
  const orgs = [...new Set(rows.concat(cells).map(r => r.org))];
  return '<details class="said"><summary>Already said by others '+
    '<b>'+orgs.map(esc).join(', ')+'</b></summary>'+vrows+crows+'</details>';
}

/* the way on, at the foot of every page */
function nextBar(){
  let goTo = '', kicker = '', label = '';
  if (S.view === 'overview'){
    goTo = 'view:background'; kicker = 'Next'; label = 'Background';
  } else if (S.view === 'background'){
    goTo = 'view:instructions'; kicker = 'Next'; label = 'Instructions';
  } else if (S.view === 'instructions'){
    goTo = 'uc:0'; kicker = 'Start the review';
    label = UCS[0].id + ' \u00b7 ' + UCS[0].name;
  } else if (S.view === 'uc'){
    goTo = 'act:'+S.uc+':0'; kicker = 'First activity';
    label = curUC().activities[0].id + ' \u00b7 ' + curUC().activities[0].name;
  } else if (S.view === 'act'){
    const i = ACTS.findIndex(x => x.ui === S.uc && x.ai === S.act);
    if (i >= 0 && i < ACTS.length-1){
      const nx = ACTS[i+1];
      goTo = 'act:'+nx.ui+':'+nx.ai;
      kicker = nx.ui === S.uc ? 'Next activity' : 'Next use case \u00b7 ' + UCS[nx.ui].id;
      label = nx.a.id + ' \u00b7 ' + nx.a.name;
    } else { goTo = 'view:progress'; kicker = 'That was the last activity';
             label = 'My review and export'; }
  } else return '';
  return '<div class="nextbar"><button class="btn pri" data-goto="'+esc(goTo)+'">'+
    '<span class="nx"><i>'+esc(kicker)+'</i><b>'+esc(label)+'</b></span>'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" '+
    'stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'+
    '</button></div>';
}

function buildNeeds(){
  document.body.classList.toggle('showneeds', S.needs && S.view === 'act');
  if (!(S.needs && S.view === 'act')) return;
  const a = curAC();
  const items = a.needs.map(code => {
    const n = DATA.needs[code];
    if (!n) return '';
    return '<div class="need'+(S.openNeed.has(code)?' open':'')+'">'+
      '<button class="needhead" data-need="'+code+'"><span class="ncode">'+code+'</span>'+
      '<span class="nname">'+esc(n.name)+'</span>'+CARET+'</button><div class="needbody">'+
      nf('What the workflow needs',n.what)+nf('Place in the workflow',n.place)+
      nf('Who exchanges what, and when',n.who)+nf('What the receiver needs to have',n.receiver)+
      nf('Lean workflow benefit',n.benefit)+'</div></div>';
  }).join('');
  $('#needsPad').innerHTML =
    '<div class="nhead"><h2>Needs</h2><button class="iconbtn" id="needsClose" title="Hide  n">'+
      '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>'+
    '<div class="nsub">Improvement priorities from report section 4.2 that '+esc(a.id)+
      ' is intended to address.</div>'+
    '<div class="nsrc"><b>As written in the activity sheet:</b><br>'+sgMark(a.needs_text)+'</div>'+
    items +
    '<div class="later"><b>Barriers come next.</b> The report links every need to the barriers and '+
    'expressed priorities it addresses (B1&ndash;B15, E1&ndash;E5 in section 4.1). Those are held '+
    'in the data already, so this panel can show the barriers behind each need once you confirm '+
    'the activity &rarr; need &rarr; barrier chain.</div>';
}
function nf(h,t){ return t ? '<div class="nf"><h5>'+h+'</h5><p>'+sgMark(t)+'</p></div>' : ''; }

/* ================================================================ files */
function buildExport(){
  const s = sanitize(state);
  return {format:FMT_ANSWERS, review_version:DATA.meta.review_version, schema:1,
          built_from:DATA.meta.release.version + ' (' + DATA.meta.release.date + ')'
                     + (FORCE_PHONE ? ' phone edition' : ''),
          reviewer_id:s.rid, exported_at:new Date().toISOString(),
          organisation: s.org === 'OTHER' ? s.orgOther : s.org,
          organisation_code: s.org, person: s.person, lenses: s.lenses,
          answers: {exchanges:s.ex, activities:s.act, use_cases:s.uc},
          summary: {...progress(), comments:countNotes(), edits:countEdits(),
                    counts:DATA.meta.counts}};
}
/* Saving a file from a phone. The share sheet is the only route that lets the
   reviewer choose where the file goes — Files, Drive, a mail draft — so it comes
   first there. A plain download is next. A download that is silently ignored
   cannot be detected, so on a phone the text is offered as well: nothing a
   reviewer typed should ever be trapped inside the page. */
function canShareFile(f){
  try { return !!(navigator.canShare && navigator.canShare({files:[f]})); }
  catch (e) { return false; }
}
function tryDownload(name, text){
  try {
    const url = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  } catch (e) { return false; }
}
async function saveJson(name, obj, ok){
  const text = JSON.stringify(obj, null, 2);
  if (navigator.share){
    let f = null;
    try { f = new File([text], name, {type:'application/json'}); } catch (e) {}
    if (f && canShareFile(f)){
      try { await navigator.share({files:[f], title:name}); return toast(ok); }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
  }
  if (tryDownload(name, text)) return toast(ok);
  sheetSave(name, text);
}

/* the fallback sheet, in two modes: show text to copy out, or take text pasted in */
function openSheet(name, note, value, buttons, readonly){
  $('#shName').textContent = name;
  $('#shNote').innerHTML = note;
  const ta = $('#shText');
  ta.value = value; ta.readOnly = !!readonly;
  $('#shBtns').innerHTML = buttons;
  $('#sheet').classList.remove('hidden');
  if (readonly){ ta.focus(); try { ta.setSelectionRange(0, 0); } catch (e) {} }
}
/* only reached when the browser refused to write the file at all */
function sheetSave(name, text){
  openSheet(name,
    '<b>This browser would not write the file.</b> Copy the text below and paste it into an '
    + 'email to us — it is your complete review.',
    text,
    '<button class="btn pri" id="shCopy">Copy to clipboard</button>'
    + '<button class="btn ghost" id="shClose2">Close</button>', true);
}
function closeSheet(){ $('#sheet').classList.add('hidden'); $('#shText').value = ''; }
function saveAnswers(){
  const name = 'DTERBIM_review_'+orgTag()+'_'+stamp()+'.json';
  saveJson(name, buildExport(), 'Saved ' + name + ' — please send it back to us.');
}
function saveProgress(){
  if (!state.org)
    toast('Tip: set your organisation under “Tell us who you are”, '+
          'so we can tell whose file this is.');
  const name = 'DTERBIM_review_progress_'+orgTag()+'_'+stamp()+'.json';
  saveJson(name, {format:FMT_PROGRESS, review_version:DATA.meta.review_version,
                  built_from:DATA.meta.release.version+' ('+DATA.meta.release.date+')'+
                             (FORCE_PHONE?' phone edition':''),
                  saved_at:new Date().toISOString(), state:sanitize(state)},
           'Saved ' + name + ' — keep it to carry on elsewhere.');
}
/* one reader for both routes: a chosen file, and text pasted into the sheet */
function applyLoaded(data){
  let body = null;
  if (data && data.format === FMT_PROGRESS) body = data.state;
  else if (data && data.format === FMT_ANSWERS){
    const a = data.answers || {};
    body = {rid:data.reviewer_id, org:data.organisation_code, orgOther:data.organisation,
            person:data.person, lenses:data.lenses,
            ex:a.exchanges, act:a.activities, uc:a.use_cases};
  }
  if (!body){ toast('This is not a DTERBIM review file.'); return false; }
  if (data.review_version && data.review_version !== DATA.meta.review_version
      && !confirm('That file is from review version ' + data.review_version + ', this file is '
                + DATA.meta.review_version + '. Answers that no longer fit will be dropped. Load it anyway?'))
    return false;
  state = sanitize(body);
  save(); buildLensPanel(); paintLensChips(); render({top:true});
  toast('Loaded. ' + progress().done + ' of ' + progress().must + ' exchanges answered.');
  return true;
}
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
function orgTag(){
  const o = state.org === 'OTHER' ? (state.orgOther || 'other') : (state.org || 'unnamed');
  return o.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'unnamed';
}
let toastTimer = null;
function toast(msg, big){
  const el = $('#toast');
  el.classList.toggle('big', !!big);
  el.textContent = msg; el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), big ? 9000 : 3200);
}

/* ================================================================= events */
let openPick = {ex:null, cell:null, mode:null};
let openNote = null;

function go(view, ui, ai, ei){
  const same = S.view === view && S.uc === ui && S.act === ai;
  document.body.classList.remove('navopen');   /* a phone drawer closes on navigation */
  S.view = view;
  if (ui != null) S.uc = ui;
  if (ai != null) S.act = ai;
  S.ex = (ei == null ? null : ei);
  if (ui != null) S.openUC.add(ui);
  if (ei != null) S.openAC.add(ui+':'+ai);
  render({top: !same && ei == null});
}

document.addEventListener('click', ev => {
  const t = ev.target;

  /* lens panel */
  if (t.closest('#lensBtn')){
    const d = t.closest('[data-dropLens]');
    if (d){ toggleLens(d.getAttribute('data-dropLens')); return; }
    $('#lensPanel').classList.toggle('open'); return;
  }
  if (t.closest('#lensGo')){ $('#lensPanel').classList.remove('open'); return; }
  const lo = t.closest('.lensopt');
  if (lo){ toggleLens(lo.dataset.lens); return; }
  if (!t.closest('.lenspanel')) $('#lensPanel').classList.remove('open');

  const tc = t.closest('[data-tool]');
  if (tc){ toast(toolTitle(tc.getAttribute('data-tool')), true); return; }

  /* rows of a filtered list: into the activity, at the exchange that was clicked */
  const fx = t.closest('[data-fex]');
  if (fx){
    const q = fx.dataset.fex.split(':');
    S.openUC.add(+q[0]); S.openAC.add(q[0]+':'+q[1]);
    go('act', +q[0], +q[1], +q[2]); return;
  }
  const fa = t.closest('[data-fact]');
  if (fa){
    const q = fa.dataset.fact.split(':');
    S.openUC.add(+q[0]); go('act', +q[0], +q[1]); return;
  }

  if (t.closest('#progBtn')){ go('progress'); return; }

  /* the next-step button at the foot of a page */
  const gt = t.closest('[data-goto]');
  if (gt){
    const p = gt.getAttribute('data-goto').split(':');
    if (p[0] === 'view') go(p[1]);
    else if (p[0] === 'uc'){ S.openUC.add(+p[1]); go('uc', +p[1], 0); }
    else { S.openUC.add(+p[1]); S.openAC.add(p[1]+':'+p[2]); go('act', +p[1], +p[2]); }
    return;
  }

  /* navigation */
  const vn = t.closest('[data-view]');
  if (vn){
    const v = vn.getAttribute('data-view');
    if (v === 'uc'){ S.openUC.add(+vn.dataset.uc); go('uc', +vn.dataset.uc, 0); }
    else go(v);
    return;
  }
  const cr = t.closest('[data-togglelUC]');
  if (cr){
    ev.stopPropagation();
    const ui = +cr.getAttribute('data-togglelUC');
    S.openUC.has(ui) ? S.openUC.delete(ui) : S.openUC.add(ui);
    buildCascade(); return;
  }
  const ca = t.closest('[data-toggleAC]');
  if (ca){
    /* the arrow only folds the exchange list open; it must not navigate, because
       navigating closes the drawer on a phone and the list is never seen */
    ev.stopPropagation();
    const k = ca.getAttribute('data-toggleAC');
    S.openAC.has(k) ? S.openAC.delete(k) : S.openAC.add(k);
    buildCascade(); return;
  }
  const uh = t.closest('.uchead');
  if (uh){ const ui = +uh.dataset.uc; S.openUC.add(ui); go('uc', ui, 0); return; }
  const ah = t.closest('.achead');
  if (ah){
    const ui = +ah.dataset.uc, ai = +ah.dataset.ac, k = ui+':'+ai;
    if (S.view === 'act' && S.uc === ui && S.act === ai){
      S.openAC.has(k) ? S.openAC.delete(k) : S.openAC.add(k);
      buildCascade(); return;
    }
    S.openAC.add(k); go('act', ui, ai); return;
  }
  const el = t.closest('.exli');
  if (el){ go('act', +el.dataset.uc, +el.dataset.ac, +el.dataset.ex); return; }
  const ph = t.closest('.phase');
  if (ph){ S.openUC = new Set([+ph.dataset.uc]); go('act', +ph.dataset.uc, 0); return; }
  const bx = t.closest('.step .box');
  if (bx){ go('act', +bx.dataset.uc, +bx.dataset.ac); return; }
  const rl = t.closest('.rail[data-uc]');
  if (rl){ S.openUC = new Set([+rl.dataset.uc]); go('uc', +rl.dataset.uc, 0); return; }

  if (t.closest('#drawerBtn') || t.closest('#drawerBtn2') || t.closest('#scrim')){
    document.body.classList.toggle('navopen'); return;
  }
  const stp = t.closest('[data-step]');
  if (stp && !stp.disabled){
    let i = ACTS.findIndex(x => x.ui === S.uc && x.ai === S.act) + (+stp.dataset.step);
    i = Math.max(0, Math.min(ACTS.length-1, i));
    S.openUC.add(ACTS[i].ui);
    go('act', ACTS[i].ui, ACTS[i].ai);
    return;
  }
  const ed = t.closest('[data-edit]');
  if (ed){
    const id = ed.getAttribute('data-edit');
    S.openEdit.has(id) ? S.openEdit.delete(id) : S.openEdit.add(id);
    render(); return;
  }
  if (t.closest('#sideToggle')){
    if (PHONE) document.body.classList.remove('navopen');
    else document.body.classList.toggle('narrow');
    return;
  }
  if (t.closest('#needsBtn') || t.closest('#needsClose')){
    S.needs = !S.needs; render(); return;
  }
  if (t.closest('#flowBar')){ S.flow = !S.flow; render(); return; }
  const nh = t.closest('.needhead');
  if (nh){
    const c = nh.dataset.need;
    S.openNeed.has(c) ? S.openNeed.delete(c) : S.openNeed.add(c);
    buildNeeds(); return;
  }

  /* ---- review controls ---- */
  const cb = t.closest('.cb[data-do]');
  if (cb){
    const id = cb.dataset.ex, cell = cb.dataset.cell, what = cb.dataset.do;
    const rec = exRec(id, cell);
    if (what === 'ok'){ rec.ok = !rec.ok; openPick = {ex:null,cell:null,mode:null}; }
    else if (what === 'note'){ openNote = openNote === id+'|'+cell ? null : id+'|'+cell; }
    else { openPick = (openPick.ex===id && openPick.cell===cell && openPick.mode===what)
             ? {ex:null,cell:null,mode:null} : {ex:id, cell:cell, mode:what}; }
    save(); render(); return;
  }
  if (t.closest('[data-pickcancel]')){ openPick = {ex:null,cell:null,mode:null}; render(); return; }
  if (t.closest('[data-pickok]')){
    const sel = $('#pickSel');
    if (sel && !sel.value && sel.options.length > 1)
      return toast('Open the list and choose one first.');
    if (sel && sel.value){
      const rec = exRec(openPick.ex, openPick.cell);
      const list = openPick.mode === 'add' ? rec.add : rec.del;
      if (!list.includes(sel.value)) list.push(sel.value);
      openNote = openPick.ex+'|'+openPick.cell;
      save();
    }
    openPick = {ex:null,cell:null,mode:null}; render(); return;
  }
  const un = t.closest('[data-undo]');
  if (un){
    const wrap = un.closest('.edit');
    const rec = exRec(wrap.dataset.ex, wrap.dataset.cell);
    const list = un.getAttribute('data-undo') === 'add' ? rec.add : rec.del;
    const i = list.indexOf(un.getAttribute('data-val'));
    if (i >= 0) list.splice(i,1);
    save(); render(); return;
  }
  const vb = t.closest('.vb');
  if (vb){
    const rec = vRec(vb.dataset.scope, vb.dataset.id, vb.dataset.lens);
    rec.verdict = rec.verdict === vb.dataset.v ? '' : vb.dataset.v;
    save(); render();
    if (rec.verdict === 'changes' || rec.verdict === 'disagree'){
      const sel = '[data-note="v"][data-scope="'+vb.dataset.scope+'"][data-id="'+
                  CSS.escape(vb.dataset.id)+'"][data-lens="'+CSS.escape(vb.dataset.lens)+'"]';
      const ta = document.querySelector(sel);
      if (ta) ta.focus();
    }
    return;
  }
  /* a change option belongs to one lens line, not to the whole activity */
  const vc = t.closest('[data-vchg]');
  if (vc){
    const rec = vRec(vc.dataset.scope, vc.dataset.id, vc.dataset.lens);
    const val = vc.getAttribute('data-vchg');
    rec.change = rec.change === val ? '' : val;
    save(); render(); return;
  }
  /* pens: open a comment that was not there */
  const vp = t.closest('[data-vnote]');
  if (vp){
    const k = vp.dataset.scope+'|'+vp.dataset.id+'|'+vp.dataset.lens;
    S.openV.add(k); render();
    const ta = document.querySelector('[data-note="v"][data-scope="'+vp.dataset.scope+
      '"][data-id="'+CSS.escape(vp.dataset.id)+'"][data-lens="'+CSS.escape(vp.dataset.lens)+'"]');
    if (ta) ta.focus();
    return;
  }
  const bp = t.closest('[data-bnote]');
  if (bp){
    S.openB.add(bp.dataset.scope+'|'+bp.dataset.id); render();
    const ta = document.querySelector('[data-note="block"][data-scope="'+bp.dataset.scope+
      '"][data-id="'+CSS.escape(bp.dataset.id)+'"]');
    if (ta) ta.focus();
    return;
  }
  const dp = t.closest('[data-dnote]');
  if (dp){
    S.openD.add(dp.getAttribute('data-dnote')); render();
    const ta = document.querySelector('[data-note="disc"]');
    if (ta) ta.focus();
    return;
  }

  /* ---- files ---- */
  if (t.closest('#btnExport')){ saveAnswers(); return; }
  if (t.closest('#isoBtn')){ cycleIsoMode(); return; }
  if (t.closest('#btnSaveProg') || t.closest('#saveBtn')){ saveProgress(); return; }
  if (t.closest('#btnLoadProg')){ $('#loadFile').click(); return; }
  if (t.closest('#shClose') || t.closest('#shClose2')){ closeSheet(); return; }
  if (t.closest('#shCopy')){
    const ta = $('#shText');
    const done = () => toast('Copied. Paste it into an email to us.');
    const byHand = () => toast('Select the text and copy it by hand.');
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(ta.value).then(done, byHand);
    else {
      ta.select(); ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy') ? done() : byHand(); }
      catch (e) { byHand(); }
    }
    return;
  }
  if (t.closest('#warnClose')){
    document.body.classList.add('warnoff');
    try { localStorage.setItem(WARN_KEY, '1'); } catch (e) {}
    return;
  }
  if (t.closest('#btnReset')){
    if (confirm('Delete every answer and comment you have entered in this browser? '
              + 'This cannot be undone. Download your answers first if you want to keep them.')){
      state = freshState();
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      buildLensPanel(); paintLensChips(); render(); toast('Cleared.');
    }
    return;
  }
});

/* typing in any comment box */
document.addEventListener('input', ev => {
  const ta = ev.target;
  if (ta.dataset && ta.dataset.note){
    if (ta.dataset.note === 'cell') exRec(ta.dataset.ex, ta.dataset.cell).note = ta.value;
    else if (ta.dataset.note === 'disc'){
      const b = state.act[ta.dataset.id] || (state.act[ta.dataset.id] = {v:{},note:'',disc:''});
      b.disc = ta.value;
    }
    else if (ta.dataset.note === 'v') vRec(ta.dataset.scope, ta.dataset.id, ta.dataset.lens).note = ta.value;
    else {
      const bag = ta.dataset.scope === 'act'
        ? (state.act[ta.dataset.id] || (state.act[ta.dataset.id] = {v:{},note:'',disc:''}))
        : (state.uc[ta.dataset.id] || (state.uc[ta.dataset.id] = {v:{},note:''}));
      bag.note = ta.value;
    }
    save(); paintRing(); return;
  }
  if (ta.id === 'orgOther'){ state.orgOther = ta.value; save(); return; }
  if (ta.id === 'personIn'){ state.person = ta.value; save(); return; }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'orgSel'){ state.org = t.value; save(); render(); return; }
  if (t.id === 'onlyHits'){ S.only = t.checked; document.body.classList.toggle('onlyhits', S.only); return; }
  if (t.id === 'swTools' || t.id === 'swActs'){ ovDraw(); return; }
  if (t.id === 'bgSub'){ bgPage(t.value); return; }
});

$('#loadFile').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  let data;
  try { data = JSON.parse(await f.text()); }
  catch (e) { return toast('That file is not readable JSON.'); }
  applyLoaded(data);
});

document.addEventListener('keydown', e => {
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === '[') document.body.classList.toggle('narrow');
  else if (e.key === 'n'){ S.needs = !S.needs; render(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if (S.view !== 'act') return;
    e.preventDefault();
    const d = e.key === 'ArrowDown' ? 1 : -1;
    let i = ACTS.findIndex(x => x.ui === S.uc && x.ai === S.act) + d;
    i = Math.max(0, Math.min(ACTS.length-1, i));
    S.openUC.add(ACTS[i].ui);
    go('act', ACTS[i].ui, ACTS[i].ai);
  }
});

window.addEventListener('beforeunload', e => {
  const any = Object.keys(state.ex).length || Object.keys(state.act).length
            || Object.keys(state.uc).length;
  if (!any) return;
  if (STORAGE_OK){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (err) {}
    return;
  }
  e.preventDefault();          /* nowhere to save it: do not let the tab close silently */
  e.returnValue = '';
  return '';
});

/* deep links: #context, #progress, #HLUC2, #HLUC2-A5, #HLUC2-A5-3 */
function fromHash(){
  const h = location.hash || '';
  if (h === '#context'){ S.view = 'overview'; return true; }
  if (h === '#progress' || CTXV.includes(h.slice(1))){ S.view = h.slice(1); return true; }
  /* a filtered list is worth sending to someone: #tool=t2.2, #box=HLUC4-A3,... */
  if (h.indexOf('#tool=') === 0){
    const c = decodeURIComponent(h.slice(6));
    if (!DATA.tools[c]) return false;
    S.filt = {kind:'tool', code:c, acts:null, name:null}; S.view = 'filter'; return true;
  }
  if (h.indexOf('#box=') === 0){
    const ids = h.slice(5).split(',').filter(id => ACT_BY_ID[id]);
    if (ids.length < 2) return false;
    S.filt = {kind:'acts', code:null, acts:ids, name:null}; S.view = 'filter'; return true;
  }
  const m = /^#HLUC(\d+)(?:-A(\d+))?(?:-(\d+))?$/.exec(h);
  if (!m) return false;
  const ui = UCS.findIndex(u => u.num === +m[1]);
  if (ui < 0) return false;
  S.uc = ui; S.openUC.add(ui);
  if (!m[2]){ S.view = 'uc'; return true; }
  const ai = UCS[ui].activities.findIndex(a => a.num === +m[2]);
  if (ai < 0){ S.view = 'uc'; return true; }
  S.act = ai; S.view = 'act';
  if (m[3] && UCS[ui].activities[ai].exchanges[+m[3]-1]){
    S.ex = +m[3]-1; S.openAC.add(ui+':'+ai);
  }
  return true;
}
window.addEventListener('hashchange', () => { if (fromHash()) render({top:true}); });

/* rotating a phone, or dragging a window narrow, swaps the layout in place */
if (!FORCE_PHONE){
  const onMQ = ev => {
    if (PHONE === ev.matches) return;
    PHONE = ev.matches;
    document.body.classList.remove('navopen');
    render();
  };
  PHONE_MQ.addEventListener ? PHONE_MQ.addEventListener('change', onMQ)
                            : PHONE_MQ.addListener(onMQ);
}

/* ------------------------------------------------------------------ start */
document.body.classList.toggle('nostore', !STORAGE_OK);
$('#warnText').innerHTML = STORAGE_OK
  ? '<b>Your answers save themselves as you work</b> — close this page and come back any '
    + 'time. For a copy of your own, tap the save icon above and choose where it goes.'
  : '<b>Keep your own copy as you go.</b> This browser is not holding answers between visits, '
    + 'so tap the save icon above and choose where the file goes. Opening the page from inside '
    + 'a zip folder is the usual cause.';
if (STORAGE_OK){
  try { if (localStorage.getItem(WARN_KEY)) document.body.classList.add('warnoff'); }
  catch (e) {}
}
document.body.classList.toggle('phone', PHONE);
buildLensPanel(); paintLensChips();
if (!fromHash() && (Object.keys(state.ex).length || Object.keys(state.act).length))
  S.view = 'progress';   /* returning reviewer lands on their own progress */
render({top:true});
</script>
