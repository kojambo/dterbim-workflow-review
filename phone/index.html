codes":[],"text":""},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG5 contractors)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","lane":"appointed","stage":"s2"}},{"id":"HLUC1-A5-E3","from":"Waste and recycling firms (SG14)","to":"architects and engineers (SG1)","from_sg":["SG14"],"to_sg":["SG1"],"sg":["SG1","SG14"],"text":"Waste and recycling firms (SG14) provide information on sorting, storage, transport, receiving conditions, and potential recovery value. They distinguish between possible destinations and estimated values, and between confirmed acceptance and offers.","bpmn":"Task: Estimate recovery costs and potential value","tools":{"status":"confirm","codes":["t4.1"],"text":"t4.1 estimates transport costs at deconstruction; confirm its use for early renovation planning."},"iso":{"from_roles":["appointed"],"to_roles":["lead"],"from_label":"appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"appointed","stage":"s2"}},{"id":"HLUC1-A5-E4","from":"Building owners (SG4) and financial actors (SG10)","to":"architects and engineers (SG1) and energy consultants (SG7)","from_sg":["SG4","SG10"],"to_sg":["SG1","SG7"],"sg":["SG1","SG4","SG7","SG10"],"text":"Building owners (SG4) and financial actors (SG10) confirm any changes to the budget and investment criteria agreed in Activity 1. They specify the period over which costs and benefits should be considered, so architects and engineers (SG1) and energy consultants (SG7) apply consistent assumptions.","bpmn":"Task: Confirm financial comparison assumptions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","third"],"to_roles":["lead","appointed"],"from_label":"appointing party (SG4 building owners) and third party (SG10 financial actors)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","lane":"appointing","stage":"s2"}},{"id":"HLUC1-A5-E5","from":"Architects and engineers (SG1) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG1","SG7"],"to_sg":["SG4"],"sg":["SG1","SG4","SG7"],"text":"Architects and engineers (SG1) present the candidate measures and material options, along with their associated practical constraints, costs, potential recovery value, and remaining uncertainties. These options form the basis for developing and comparing the scenarios in Activity 6.","bpmn":"Task: Issue candidate measures and material options","tools":{"status":"documented","codes":["t1.2"],"text":"t1.2 produces cost-benefit analyses and scenario comparisons.\nPossible link — confirm: Confirm which retention, repair and reuse costs t1.2 can assess, including options outside the ECM catalogue."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s2"}}]},{"id":"HLUC1-A6","num":6,"name":"Model renovation scenarios and compare energy, environmental, circularity and cost results","purpose":"Architects and engineers (SG1) and energy consultants (SG7) compile renovation scenarios based on the measures identified in Activity 5. They then assess each scenario against the project objectives, explaining the trade-offs between energy performance, environmental impact, circularity and cost.","when":"Architects and engineers (SG1) use the material assessment from Activity 2, the energy baseline from Activity 4 and the candidate measures from Activity 5. The shared checking procedure applies before each assessment. If a scenario changes, the relevant architects and engineers (SG1), energy consultants (SG7) and IT providers and BIM integrators (SG11) repeat only the affected preparation and assessments.","participants":"Architects and engineers (SG1) define scenarios and coordinate the energy, environmental, circularity and cost comparison. IT providers and BIM integrators (SG11) prepare the model versions. Energy consultants (SG7) assess energy performance. Contractors (SG5), material suppliers and manufacturers (SG13) and waste and recycling firms (SG14) clarify practical constraints and costs. Before comparison, architects and engineers (SG1) agree with building owners (SG4) who will prepare any environmental, circularity or cost results not supplied by the tools.","outcome":"Architects and engineers (SG1) produce a comparison linking each scenario to its model version and assessment results. The comparison records methods, scope, assumptions, uncertainties and exclusions. Energy results use the baseline from Activity 4; circularity results identify the indicators and references used. Building owners (SG4) review the results and select a scenario or request changes in Activity 7.","needs_text":"N1 Material information for circular renovation planning; N2 Building information suitable for renovation energy assessment; N3 Updating BIM with selected renovation measures; N4 Assessing the business case for recovery and reuse; N5 Comparing renovation scenarios and selecting measures; N10 Information quality for the next activity.","needs":["N1","N2","N3","N4","N5","N10"],"checks":"Architects and engineers (SG1) check the common comparison basis and links between results, scenarios and models. Energy consultants (SG7) check energy inputs and results, while IT providers and BIM integrators (SG11) address model issues. Named assessors check other indicators. Missing results remain explicit; they are not replaced by unsupported values.","discussion":["Are the scenarios being assessed using a consistent scope, set of assumptions and set of comparison criteria?","Which circularity indicators and references should architects and engineers (SG1) use?","Who is responsible for providing environmental, circularity or cost results that the tools do not cover?","How will changes to a scenario be linked to the correct model and assessment results?"],"sg":["SG1","SG4","SG5","SG7","SG11","SG13","SG14"],"tool_codes":["t1.1","t1.2","t1.3","t4.1","t5.2"],"iso_stage":"s2","exchanges":[{"id":"HLUC1-A6-E1","from":"Architects and engineers (SG1)","to":"IT providers and BIM integrators (SG11)","from_sg":["SG1"],"to_sg":["SG11"],"sg":["SG1","SG11"],"text":"Architects and engineers (SG1) specify the measures included in each scenario, the affected building elements, and the applicable parameters. They identify the components that are to be retained and the proposed changes, enabling IT providers and BIM integrators (SG11) to prepare a separate model version for each scenario.","bpmn":"Task: Specify scenario measures and parameters","tools":{"status":"documented","codes":["t1.3"],"text":"t1.3 integrates catalogue ECMs and their parameters into enriched BIM."},"iso":{"from_roles":["lead"],"to_roles":["appointed"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s2"}},{"id":"HLUC1-A6-E2","from":"IT providers and BIM integrators (SG11)","to":"energy consultants (SG7)","from_sg":["SG11"],"to_sg":["SG7"],"sg":["SG7","SG11"],"text":"IT providers and BIM integrators (SG11) provide scenario models with their identifiers, versions and known information gaps. Energy consultants (SG7) define the energy-assessment requirements and review the prepared energy models. They use the baseline boundary, relevant areas outside the renovation works and consistent operating assumptions, recording and resolving gaps through the shared checking procedure.","bpmn":"Task: Prepare and check scenario energy models","tools":{"status":"documented","codes":["t1.3","t5.2"],"text":"t1.3 supplies enriched scenario BIM; t5.2 prepares BEM and checks energy-model sufficiency."},"iso":{"from_roles":["appointed"],"to_roles":["appointed"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"appointed party (SG7 energy consultants)","lane":"appointed","stage":"s2"}},{"id":"HLUC1-A6-E3","from":"Energy consultants (SG7)","to":"architects and engineers (SG1)","from_sg":["SG7"],"to_sg":["SG1"],"sg":["SG1","SG7"],"text":"The energy consultants (SG7) provide energy results for each scenario and explain how these change relative to the baseline. They also identify the model version, assumptions and limitations, ensuring that architects and engineers (SG1) use the correct results for comparison purposes.","bpmn":"Task: Issue scenario energy results","tools":{"status":"documented","codes":["t5.2"],"text":"t5.2 produces energy results and KPIs for early-design comparison."},"iso":{"from_roles":["appointed"],"to_roles":["lead"],"from_label":"appointed party (SG7 energy consultants)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"appointed","stage":"s2"}},{"id":"HLUC1-A6-E4","from":"Contractors (SG5), material suppliers and manufacturers (SG13) and waste and recycling firms (SG14)","to":"architects and engineers (SG1)","from_sg":["SG5","SG13","SG14"],"to_sg":["SG1"],"sg":["SG1","SG5","SG13","SG14"],"text":"They clarify costs, product properties, installation constraints and recovery arrangements where combining measures gives rise to new questions. Architects and engineers (SG1) reuse information from Activity 5 and identify estimates, unconfirmed destinations and missing evidence.","bpmn":"Task: Clarify combined-measure constraints and costs","tools":{"status":"documented","codes":["t1.1","t4.1"],"text":"t1.1 supplies metadata for catalogue measures.\nPossible link — confirm: t4.1: confirm whether deconstruction scenario and transport outputs can support this renovation comparison."},"iso":{"from_roles":["appointed","appointed","appointed"],"to_roles":["lead"],"from_label":"appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers) and appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"appointed","stage":"s2"}},{"id":"HLUC1-A6-E5","from":"Architects and engineers (SG1) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG1","SG7"],"to_sg":["SG4"],"sg":["SG1","SG4","SG7"],"text":"Architects and engineers (SG1) and energy consultants (SG7) issue the combined comparison to building owners (SG4) for the review in Activity 7. The comparison shows energy, environmental, circularity and cost results against the agreed objectives and identifies the person responsible for each assessment. It records methods, assumptions, exclusions, uncertainties and matching scenario and model versions. Results that cannot yet be supplied remain identified as missing.","bpmn":"Task: Issue the combined scenario comparison","tools":{"status":"documented","codes":["t1.2"],"text":"t1.2 compares scenarios using catalogue, BIM and energy results and produces cost-benefit analyses.\nPossible link — confirm: Confirm calculation methods and responsibility for environmental, circularity or cost results not covered by the available tools."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s2"}}]},{"id":"HLUC1-A7","num":7,"name":"Review the combined results and select or revise a renovation scenario","purpose":"Building owners (SG4) review the scenario comparison with architects and engineers (SG1) and energy consultants (SG7), then decide which renovation scenario to select or revise. The review considers energy performance, environmental impact, circularity, costs and practical constraints against the goals agreed in Activity 1.","when":"This activity follows on from the scenario comparison in Activity 6. If the building owners (SG4) request changes, architects and engineers (SG1) will revise the relevant measures or scenarios and repeat the affected assessments before another review.","participants":"The building owners (SG4) make the selection. Architects and engineers (SG1) and energy consultants (SG7) then explain the results, trade-offs and uncertainties. Contractors (SG5), material suppliers and manufacturers (SG13), waste and recycling firms (SG14) and financial actors (SG10) provide further clarification where needed.","outcome":"Architects and engineers (SG1) record the chosen scenario, along with the building owners’ (SG4) reasons or instructions for revising the options. The decision record identifies the relevant model and assessment versions, any conditions attached to the choice and any outstanding actions with assigned responsibilities.","needs_text":"N5 Comparing renovation scenarios and selecting measures; N11 Coordination responsibilities and decision records.","needs":["N5","N11"],"checks":"Building owners (SG4) select or request revision; architects and engineers (SG1) record the reasons and conditions. Gateway: Scenario selected? Selection proceeds to Activity 8; requested changes return to the affected measures, models and assessments in Activities 5 and 6. Reassessment uses matching versions.","discussion":["Does the comparison provide the building owners (SG4) with enough information to make an informed decision?","Who records the choice, conditions, and outstanding actions?","If a scenario changes, which assessments must architects and engineers (SG1) repeat?"],"sg":["SG1","SG4","SG7","SG11"],"tool_codes":["t1.2"],"iso_stage":"s3","exchanges":[{"id":"HLUC1-A7-E1","from":"Architects and engineers (SG1) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG1","SG7"],"to_sg":["SG4"],"sg":["SG1","SG4","SG7"],"text":"Architects and engineers (SG1) and energy consultants (SG7) review the comparison issued in Activity 6 with building owners (SG4). They answer questions about conflicting results, assumptions and missing information, using the same comparison and model versions. Further clarification is recorded alongside the comparison rather than presented as a new assessment unless its inputs change.","bpmn":"Task: Review the existing comparison","tools":{"status":"documented","codes":["t1.2"],"text":"t1.2 displays comparative assessments and cost-benefit analyses in reports."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s3"}},{"id":"HLUC1-A7-E2","from":"Building owners (SG4)","to":"architects and engineers (SG1) and energy consultants (SG7)","from_sg":["SG4"],"to_sg":["SG1","SG7"],"sg":["SG1","SG4","SG7"],"text":"Building owners (SG4) identify the preferred scenario and explain their reasons. They state any conditions or questions to resolve before the design proceeds. Architects and engineers (SG1) use this response when recording the decision in E3.","bpmn":"Task: Select a scenario and state conditions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["lead","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","lane":"appointing","stage":"s3"}},{"id":"HLUC1-A7-E3","from":"Architects and engineers (SG1)","to":"building owners (SG4) and IT providers and BIM integrators (SG11)","from_sg":["SG1"],"to_sg":["SG4","SG11"],"sg":["SG1","SG4","SG11"],"text":"Architects and engineers (SG1) record the decision alongside the relevant scenario, model and assessment versions. The building owners (SG4) confirm this record, which is then used by IT providers and BIM integrators (SG11) when preparing the chosen design in Activity 8.","bpmn":"Task: Record and communicate the selection","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["appointing","appointed"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"appointing party (SG4 building owners) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s3"}},{"id":"HLUC1-A7-E4","from":"Building owners (SG4)","to":"architects and engineers (SG1) and energy consultants (SG7), if revisions are needed","from_sg":["SG4"],"to_sg":["SG1","SG7"],"sg":["SG1","SG4","SG7"],"text":"Building owners (SG4) explain what should change and why. Architects and engineers (SG1) identify the affected measures and model elements, and energy consultants (SG7) identify the energy assessments to repeat. Architects and engineers (SG1) coordinate any other affected assessments before returning the revised comparison for review.","bpmn":"Task: Request revisions and reassessment","tools":{"status":"documented","codes":["t1.2"],"text":"t1.2 supports creating, editing and viewing scenarios within its catalogue-based scope."},"iso":{"from_roles":["appointing"],"to_roles":["lead","appointed"],"from_label":"appointing party (SG4 building owners)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","lane":"appointing","stage":"s3"}}]},{"id":"HLUC1-A8","num":8,"name":"Record the chosen measures and supporting assessments in BIM and linked records","purpose":"Architects and engineers (SG1) identify the model version for the scenario chosen by building owners (SG4) and confirm the measures against the affected components. IT providers and BIM integrators (SG11) update it only where the selection or its conditions require changes. The model and linked assessments provide information for detailed design.","when":"This activity follows the building owners’ (SG4) selection in Activity 7. IT providers and BIM integrators (SG11) will use the model of the chosen scenario from Activity 6, updating it as necessary to reflect the decision and any conditions.","participants":"Architects and engineers (SG1) specify the chosen measures and the components affected. IT providers and BIM integrators (SG11) then update the model and its links to the relevant supporting records. Energy consultants (SG7) then check that the model matches the assessed scenario. The building owners (SG4) confirm any changes affecting the agreed selection.","outcome":"Architects and engineers (SG1) have identified a model version that shows the chosen measures and distinguishes between existing components and proposed changes. Linked records retain energy, environmental, circularity and cost assessments, as well as the building owners’ (SG4) decision and any outstanding checks. Any information that could not be transferred or linked is clearly identified.","needs_text":"N3 Updating BIM with selected renovation measures; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records; N12 Traceable evidence for compliance and assessment requirements; N13 Guidance for consistent information exchange.","needs":["N3","N10","N11","N12","N13"],"checks":"Architects and engineers (SG1) check agreement with the decision, energy consultants (SG7) check agreement with the assessed scenario, and IT providers and BIM integrators (SG11) correct model links and parameters. Changes affecting the selection or results return to the relevant assessment and owner review. The selected model supports subsequent detailed design.","discussion":["How will the chosen measures and parameters be transferred from the scenario comparison to the selected BIM version?","Who will ensure that material and circularity decisions are correctly linked to building components?","What information needs to be finalised before the detailed design, procurement or construction stages?"],"sg":["SG1","SG5","SG7","SG9","SG11"],"tool_codes":["t1.2","t1.3","t2.2","t5.1"],"iso_stage":"s4","exchanges":[{"id":"HLUC1-A8-E1","from":"Architects and engineers (SG1)","to":"IT providers and BIM integrators (SG11)","from_sg":["SG1"],"to_sg":["SG11"],"sg":["SG1","SG11"],"text":"Architects and engineers (SG1) provide IT providers and BIM integrators (SG11) with the chosen scenario version, affected components and measure parameters. They identify which components remain, are repaired, are removed or are replaced, and which changes to the scenario model are required by the decision. Existing model content is reused.","bpmn":"Task: Identify the chosen model and required changes","tools":{"status":"documented","codes":["t1.3","t1.2"],"text":"t1.3 integrates ECM catalogue parameters into BIM.\nPossible link — confirm: Confirm the transfer of the selected t1.2 scenario and changes outside the catalogue."},"iso":{"from_roles":["lead"],"to_roles":["appointed"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s4"}},{"id":"HLUC1-A8-E2","from":"IT providers and BIM integrators (SG11)","to":"architects and engineers (SG1) and energy consultants (SG7)","from_sg":["SG11"],"to_sg":["SG1","SG7"],"sg":["SG1","SG7","SG11"],"text":"IT providers and BIM integrators (SG11) provide an updated model and identify any parameters that could not be transferred or linked. Architects and engineers (SG1) and energy consultants (SG7) then check that the model matches the building owners’ (SG4) decision and the corresponding assessments, taking into account the recorded material and circularity options.","bpmn":"Task: Update and check the selected model","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 checks specified IFC exchange requirements and reports model-linked issues."},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointed"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","lane":"appointed","stage":"s4"}},{"id":"HLUC1-A8-E3","from":"Architects and engineers (SG1) and energy consultants (SG7)","to":"IT providers and BIM integrators (SG11)","from_sg":["SG1","SG7"],"to_sg":["SG11"],"sg":["SG1","SG7","SG11"],"text":"Architects and engineers (SG1) and energy consultants (SG7) identify any incorrect or missing information and request corrections. IT providers and BIM integrators (SG11) then return the corrected model, highlighting any remaining issues. Any changes affecting the selected measures or assessment results are returned to the relevant review activity.","bpmn":"Task: Correct affected model information","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 provides BCF issues and correction guidance for subsequent rechecking."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointed"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s4"}},{"id":"HLUC1-A8-E4","from":"Architects and engineers (SG1)","to":"architects and engineers (SG1) responsible for detailed design, with contractors (SG5) and facility operators (SG9) where involved","from_sg":["SG1"],"to_sg":["SG1","SG5","SG9"],"sg":["SG1","SG5","SG9"],"text":"Architects and engineers (SG1) responsible for the assessment provide the selected model, measures, supporting assessments and outstanding actions to those preparing detailed drawings and specifications. Contractors (SG5) and facility operators (SG9) receive relevant information where involved. Detailed design and procurement must develop the information required before construction in HLUC2; this exchange does not establish that the selected scenario is already a complete construction design.","bpmn":"Task: Issue selected information for detailed design","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 hosts and federates models and documentation during design and construction.\nPossible link — confirm: Confirm the actual route from the selected scenario to detailed design; no automatic transfer is established here."},"iso":{"from_roles":["lead"],"to_roles":["lead","appointed","appointed"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG5 contractors) and appointed party (SG9 facility operators)","lane":"lead","stage":"s4"}}]}]},{"id":"HLUC2","num":2,"name":"Carry out the renovation and hand over building information","reviewers":[{"code":"UCL","name":"UCL","country":"United Kingdom"},{"code":"FASADA","name":"FASADA","country":"Poland"}],"phase":"Construction and handover phase","phase_short":"Construction & handover","purpose":"This high-level use case covers the renovation works, and the information needed to record what was built, track materials, and help the facility operators (SG9) manage the renovated building.","basis":"Survey respondents reported difficulties exchanging information between construction and operation, and requested better material tracking. The literature review highlights delays in updating models after site changes, fragmented responsibilities, and poor handover practices.","start":"The building owners (SG4) and architects and engineers (SG1) release the design and specifications for procurement and construction. They then identify any outstanding checks and agree with the contractors (SG5) and facility operators (SG9) which information should be recorded and provided at handover.","scope":"The contractors (SG5) plan and carry out the work, recording product substitutions, installations and removals. They also provide inspection and commissioning records. Architects and engineers (SG1) then update the building information and prepare it for handover. This includes the selective removal of items during renovations; the subsequent deconstruction planning is the responsibility of HLUC4.","participants":"Contractors (SG5) carry out and record the work. Architects and engineers (SG1) review design changes and update the drawings, specifications, and Building Information Modelling (BIM) model. Material suppliers and manufacturers (SG13) provide product information and waste and recycling firms (SG14) provide recovery and destination records. The building owners (SG4) and facility operators (SG9) define the handover requirements and review the received information. IT providers and BIM integrators (SG11) support information checks and exchanges.","needs_text":"Principal needs: N6, N7. N10–N13 apply at relevant checks, decisions and exchanges. The full need names are listed in the shared guidance.","needs":["N6","N7","N10","N13"],"outcome":"Contractors (SG5) complete the renovation works, including inspections and commissioning. Architects and engineers (SG1) hand over the updated building records, manuals and maintenance information, with any outstanding issues clearly assigned. The facility operators (SG9) then use this information to operate and maintain the building in HLUC3.","lean":"The aim is to reduce duplicate site reporting and missing handover information, as well as eliminating the need to reconstruct records after construction. Recording changes as work progresses should also help to reduce conflicting instructions and the need for rework.","notes":"Recording requirements are agreed before site collection. Site recording, reconciliation and handover preparation may overlap, but each has a distinct result. Product substitutions and findings that affect the design return for review.","review_questions":["Are the activities and their results necessary for this high-level use case?","Are the named stakeholder groups and information exchanges appropriate in practice?","Which assumptions, tool links or responsibilities require correction or confirmation?"],"iso_part":["ISO 19650-2","Delivery phase, continued: 5.6 collaborative production, then 5.7 information model delivery (A6, A7) and 5.8 project close-out."],"activities":[{"id":"HLUC2-A1","num":1,"name":"Agree what information to record during construction and hand over for operation","purpose":"The building owners (SG4), facility operators (SG9), architects and engineers (SG1) and contractors (SG5) agree what information to collect during the works, so that the facility operators (SG9) can use it to manage and maintain the renovated building.","when":"Building owners (SG4) and facility operators (SG9) identify operational information needs early enough to inform design and procurement. Before site work begins, architects and engineers (SG1), contractors (SG5) and IT providers and BIM integrators (SG11) confirm how the requirements will be met. They review the agreement if the design or operational needs change.","participants":"The building owners (SG4) and facility operators (SG9) explain their information requirements. Architects and engineers (SG1) and contractors (SG5) then agree on how to provide this information. IT providers and BIM integrators (SG11) advise on formats, model requirements and checks.","outcome":"Architects and engineers (SG1) produce a list of the required records, which includes as-built models, asset and material records, product documents, commissioning results and maintenance instructions. This list specifies who is responsible for providing each item, when it is due, who is responsible for checking it, and how missing or incorrect information should be addressed.","needs_text":"N7 Usable information handover between lifecycle stages; N10 Information quality for the next activity; N11 Coordination responsibilities and decision records; N13 Guidance for consistent information exchange.","needs":["N7","N10","N11","N13"],"checks":"Building owners (SG4) and facility operators (SG9) confirm the required information and operational uses. Architects and engineers (SG1), contractors (SG5) and IT providers and BIM integrators (SG11) confirm delivery responsibilities. Gateway: Arrangements agreed? Changes return to the proposal before the affected records are collected.","discussion":["Do the requirements cover the information needed to operate and maintain the renovated building?","Are responsibilities, submission dates and checks clear?","Can the facility operators (SG9) use the proposed formats in their own systems?"],"sg":["SG1","SG4","SG5","SG9","SG11"],"tool_codes":["t2.2","t5.1"],"iso_stage":"s4","exchanges":[{"id":"HLUC2-A1-E1","from":"Building owners (SG4) and facility operators (SG9)","to":"architects and engineers (SG1) and contractors (SG5)","from_sg":["SG4","SG9"],"to_sg":["SG1","SG5"],"sg":["SG1","SG4","SG5","SG9"],"text":"They explain what building, equipment and maintenance information the facility operators (SG9) require. They also identify the existing records and the information required at handover.","bpmn":"Task: Specify operational information needs","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 manages EIR/IDS requirements once specified."},"iso":{"from_roles":["appointing","appointing"],"to_roles":["lead","lead"],"from_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators)","to_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"appointing","stage":"s4"}},{"id":"HLUC2-A1-E2","from":"IT providers and BIM integrators (SG11)","to":"building owners (SG4), facility operators (SG9), architects and engineers (SG1) and contractors (SG5)","from_sg":["SG11"],"to_sg":["SG4","SG9","SG1","SG5"],"sg":["SG1","SG4","SG5","SG9","SG11"],"text":"IT providers and BIM integrators (SG11) provide advice on file formats, links between equipment and model records, and the checks required prior to handover. They also identify any requirements that need further technical specification.","bpmn":"Task: Advise on exchange formats and checks","tools":{"status":"confirm","codes":["t5.1"],"text":"t5.1: confirm which agreed model requirements can be checked with defined rules."},"iso":{"from_roles":["appointed"],"to_roles":["appointing","appointing","lead","lead"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators) and lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"appointed","stage":"s4"}},{"id":"HLUC2-A1-E3","from":"Architects and engineers (SG1) and contractors (SG5)","to":"building owners (SG4) and facility operators (SG9)","from_sg":["SG1","SG5"],"to_sg":["SG4","SG9"],"sg":["SG1","SG4","SG5","SG9"],"text":"Architects and engineers (SG1) and contractors (SG5) propose who will supply each required record, when it is due and who will check it. IT providers and BIM integrators (SG11) identify the model and exchange arrangements needed. The proposal distinguishes earlier design information that can be reused from records to be collected during construction.","bpmn":"Task: Propose recording responsibilities and dates","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","lead"],"to_roles":["appointing","appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","to_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators)","lane":"lead","stage":"s4"}},{"id":"HLUC2-A1-E4","from":"Building owners (SG4) and facility operators (SG9)","to":"architects and engineers (SG1), contractors (SG5) and IT providers and BIM integrators (SG11)","from_sg":["SG4","SG9"],"to_sg":["SG1","SG5","SG11"],"sg":["SG1","SG4","SG5","SG9","SG11"],"text":"Building owners (SG4) and facility operators (SG9) confirm the recording and handover arrangements or request changes to E3. Architects and engineers (SG1) record the agreement, including submission dates, named responsibilities and how missing or incorrect information will be addressed.","bpmn":"Task: Agree recording and handover arrangements","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","appointing"],"to_roles":["lead","lead","appointed"],"from_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators)","to_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointing","stage":"s4"}}]},{"id":"HLUC2-A2","num":2,"name":"Check proposed products and approve relevant substitutions","purpose":"This activity helps prevent product changes during procurement from reducing the performance or circularity expected from the agreed design. Architects and engineers (SG1) verify that products proposed by contractors (SG5) and material suppliers and manufacturers (SG13) adhere to the design specifications. If a different product is suggested, architects and engineers (SG1) will review its impact on performance, sustainability, costs and installation before approving the change.","when":"Architects and engineers (SG1) check proposed products before ordering or installation. If contractors (SG5) or material suppliers and manufacturers (SG13) propose an alternative, architects and engineers (SG1) review its effects and obtain the relevant decision before the changed product is used.","participants":"Contractors (SG5) and material suppliers and manufacturers (SG13) provide product information and explain any proposed changes. Architects and engineers (SG1) review the proposals, and energy consultants (SG7) assess the energy implications where necessary. The building owners (SG4) confirm any changes that affect the agreed renovation measures or budget. IT providers and BIM integrators (SG11) then update the model and facility operators (SG9) receive relevant operation and maintenance information.","outcome":"Architects and engineers (SG1) note which products can be used and which proposals require changes or further information. Approved alternatives are linked to the affected building components, revised specifications, and supporting assessments. Current records show contractors (SG5) what they should install and any outstanding checks.","needs_text":"N3 Updating BIM with selected renovation measures; N6 Material tracking and continuity of records; N11 Coordination responsibilities and decision records; N12 Traceable evidence for compliance and assessment requirements.","needs":["N3","N6","N11","N12"],"checks":"Architects and engineers (SG1) check product suitability; energy consultants (SG7) assess energy effects where needed. Building owners (SG4) decide changes within their authority. Gateway: Product accepted? Accepted specifications pass to procurement and site work; rejected or incomplete proposals return for revision before installation.","discussion":["Who reviews technical suitability, and which changes require the building owners’ (SG4) agreement?","When should a proposed alternative trigger another energy, environmental, circularity or cost assessment?","How will approved changes reach the model, specifications and contractors (SG5) before installation?"],"sg":["SG1","SG4","SG5","SG7","SG9","SG11","SG13"],"tool_codes":["t1.2","t1.3","t5.2"],"iso_stage":"s4","exchanges":[{"id":"HLUC2-A2-E1","from":"Contractors (SG5) and material suppliers and manufacturers (SG13)","to":"architects and engineers (SG1)","from_sg":["SG5","SG13"],"to_sg":["SG1"],"sg":["SG1","SG5","SG13"],"text":"Contractors (SG5) and material suppliers and manufacturers (SG13) identify the proposed products and provide specifications, prices and relevant technical, environmental and circularity evidence. For an alternative product, they explain why the change is needed and how it differs from the specified product.","bpmn":"Task: Submit proposed product information","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"lead","stage":"s4"}},{"id":"HLUC2-A2-E2","from":"Architects and engineers (SG1) and energy consultants (SG7)","to":"building owners (SG4)","from_sg":["SG1","SG7"],"to_sg":["SG4"],"sg":["SG1","SG4","SG7"],"text":"Architects and engineers (SG1) explain whether a proposed alternative meets the requirements. With energy consultants (SG7) where needed, they identify effects on energy performance, material retention or reuse, environmental impact, costs and maintenance. They repeat the affected assessments where necessary.","bpmn":"Task: Assess the effects of substitutions","tools":{"status":"documented","codes":["t5.2","t1.2"],"text":"t5.2 supports energy reassessment when a substitution changes the assessed design.\nPossible link — confirm: t1.2: confirm its use if a construction-stage substitution requires scenario reconsideration."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG7 energy consultants)","to_label":"appointing party (SG4 building owners)","lane":"lead","stage":"s4"}},{"id":"HLUC2-A2-E3","from":"Architects and engineers (SG1), with the building owners (SG4) where required","to":"contractors (SG5) and material suppliers and manufacturers (SG13)","from_sg":["SG1","SG4"],"to_sg":["SG5","SG13"],"sg":["SG1","SG4","SG5","SG13"],"text":"Architects and engineers (SG1) communicate whether the proposed product meets the specifications and whether an alternative is accepted, rejected or requires further information. Building owners (SG4) confirm changes within their decision authority. The record identifies affected components, reasons and conditions to resolve before installation; technical suitability remains the responsibility of the relevant professionals.","bpmn":"Task: Communicate the product decision","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead","appointing"],"to_roles":["lead","appointed"],"from_label":"lead appointed party (SG1 architects and engineers) and appointing party (SG4 building owners)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers)","lane":"appointing","stage":"s4"}},{"id":"HLUC2-A2-E4","from":"Architects and engineers (SG1)","to":"IT providers and BIM integrators (SG11), contractors (SG5) and facility operators (SG9)","from_sg":["SG1"],"to_sg":["SG11","SG5","SG9"],"sg":["SG1","SG5","SG9","SG11"],"text":"Architects and engineers (SG1) provide approved product parameters and revised specifications. IT providers and BIM integrators (SG11) update the affected model elements, contractors (SG5) use the current specifications, and facility operators (SG9) receive relevant changes to maintenance information.","bpmn":"Task: Update approved specifications and model data","tools":{"status":"documented","codes":["t1.3"],"text":"t1.3 integrates catalogue measure parameters into BIM.\nPossible link — confirm: Confirm support for the proposed construction-stage products and parameters outside the catalogue."},"iso":{"from_roles":["lead"],"to_roles":["appointed","lead","appointing"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators) and lead appointed party (SG5 contractors) and appointing party (SG9 facility operators)","lane":"lead","stage":"s4"}}]},{"id":"HLUC2-A3","num":3,"name":"Plan the construction work and the handling of removed materials","purpose":"Planning the order of work and material handling helps to prevent damage to components that are intended for retention or reuse. It also reduces the risk of delays, repeated handling, and unplanned storage when the arrangements for removal, installation, transport, and receipt do not match.","when":"Contractors (SG5) prepare the plan before site work begins, using the current design and material assessment, as well as the approved product information. They revise the plan when site findings or design changes affect the work.","participants":"Contractors (SG5) are responsible for construction planning. Architects and engineers (SG1) explain design and material decisions. Facility operators (SG9) identify access and operating constraints. Waste and recycling firms (SG14) advise on sorting, storage, transportation and acceptance conditions. Material suppliers and manufacturers (SG13) confirm take-back arrangements, if offered, and IT providers and BIM integrators (SG11) support links between the programme and model.","outcome":"Contractors (SG5) prepare a construction programme and a material-handling plan, which show the order of work, the components that need to be protected or removed, and the arrangements for sorting, storing and transporting materials. The plan also identifies the intended destinations and confirms whether acceptance has been granted. It also details any further inspections or arrangements that are required.","needs_text":"N6 Material tracking and continuity of records; N9 Planning disassembly and material recovery; N11 Coordination responsibilities and decision records.","needs":["N6","N9","N11"],"checks":"Contractors (SG5) coordinate the programme with facility operators (SG9), architects and engineers (SG1) and waste and recycling firms (SG14). Planned quantities and destinations remain distinct from actual site records in Activity 4. When selective removal requires detailed sequencing, use the relevant HLUC4-A4/A5 planning content without repeating the full end-of-life process. Shared content. Selective removal shares planning content with HLUC4-A4/A5. Renovation-specific access, occupied-building constraints and installation dependencies remain local.","discussion":["Does the plan protect components intended for retention or reuse?","Do removal dates match storage, transport and receiving arrangements?","Who resolves conflicts or changes when site findings differ from the records?"],"sg":["SG1","SG5","SG9","SG11","SG13","SG14"],"tool_codes":["CDT","t4.1","t4.2"],"iso_stage":"s5","exchanges":[{"id":"HLUC2-A3-E1","from":"Architects and engineers (SG1)","to":"contractors (SG5)","from_sg":["SG1"],"to_sg":["SG5"],"sg":["SG1","SG5"],"text":"Architects and engineers (SG1) provide current drawings, specifications, models and material assessments. They identify the components to retain, repair, remove or replace and the known restrictions and outstanding checks. Contractors (SG5) use this information to plan the work.","bpmn":"Task: Supply current design and material decisions","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["lead"],"to_roles":["lead"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG5 contractors)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A3-E2","from":"Facility operators (SG9)","to":"contractors (SG5)","from_sg":["SG9"],"to_sg":["SG5"],"sg":["SG5","SG9"],"text":"Where relevant, facility operators (SG9) explain access restrictions, equipment locations and requirements for maintaining building services. Contractors (SG5) must take these constraints into account when planning removal and installation activities.","bpmn":"Task: Identify access and service constraints","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["lead"],"from_label":"appointing party (SG9 facility operators)","to_label":"lead appointed party (SG5 contractors)","lane":"appointing","stage":"s5"}},{"id":"HLUC2-A3-E3","from":"Waste and recycling firms (SG14), and material suppliers and manufacturers (SG13) offering take-back","to":"contractors (SG5)","from_sg":["SG14","SG13"],"to_sg":["SG5"],"sg":["SG5","SG13","SG14"],"text":"They provide requirements for sorting, handling, storage, transport and acceptance. Where possible, they confirm available receiving arrangements and identify any remaining conditions.","bpmn":"Task: Confirm material-handling requirements","tools":{"status":"confirm","codes":["t4.1"],"text":"t4.1: confirm whether deconstruction routing and transport-cost functions support renovation material movements."},"iso":{"from_roles":["appointed","appointed"],"to_roles":["lead"],"from_label":"appointed party (SG14 waste and recycling firms) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG5 contractors)","lane":"appointed","stage":"s5"}},{"id":"HLUC2-A3-E4","from":"Contractors (SG5)","to":"architects and engineers (SG1), facility operators (SG9) and IT providers and BIM integrators (SG11)","from_sg":["SG5"],"to_sg":["SG1","SG9","SG11"],"sg":["SG1","SG5","SG9","SG11"],"text":"Contractors (SG5) share the proposed construction programme and material-handling plan to facilitate coordination. Architects and engineers (SG1) then identify any conflicts and required changes. If a 4D model is used, the IT providers and BIM integrators (SG11) will link the programme to the relevant model elements.","bpmn":"Task: Coordinate the programme and material-handling plan","tools":{"status":"documented","codes":["t4.2","CDT"],"text":"CDT uses 4D BIM and programme information for construction simulation and progress review.\nPossible link — confirm: t4.2: confirm whether dismantling sequence functions support selective removal during renovation."},"iso":{"from_roles":["lead"],"to_roles":["lead","appointing","appointed"],"from_label":"lead appointed party (SG5 contractors)","to_label":"lead appointed party (SG1 architects and engineers) and appointing party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s5"}}]},{"id":"HLUC2-A4","num":4,"name":"Carry out and record site work, quality checks and material movements","purpose":"Contractors (SG5) carry out the renovation works and record progress, installations, removals and material movements. Contractors (SG5) and architects and engineers (SG1) use inspection findings to identify defects, delays and differences from the agreed design. These records preserve evidence for model updates and handover.","when":"Contractors (SG5) record progress throughout the project and update the records after deliveries, installations, removals, inspections and corrections. They use the information requirements agreed upon in Activity 1, as well as the programme and material-handling plan from Activity 3.","participants":"Contractors (SG5) record site work and material movements. Contractors (SG5) and architects and engineers (SG1) report quality checks and defects. Material suppliers and manufacturers (SG13) provide delivery and product records, while waste and recycling firms (SG14) provide collection and receiving records. Architects and engineers (SG1) and IT providers and BIM integrators (SG11) link the information to the relevant building components.","outcome":"Contractors (SG5) keep dated records of completed work, installed products, material quantities, inspection findings and outstanding defects. Architects and engineers (SG1) and IT providers and BIM integrators (SG11) link these records to the relevant components and locations. Planned quantities remain distinguishable from actual quantities, and proposed destinations from confirmed receipts.","needs_text":"N6 Material tracking and continuity of records; N10 Information quality for the next activity; N12 Traceable evidence for compliance and assessment requirements.","needs":["N6","N10","N12"],"checks":"Contractors (SG5) carry out and record the work. Architects and engineers (SG1) review differences from the approved design, and contractors (SG5) correct site records within their remit. Unapproved substitutions return to Activity 2. Material records distinguish removal, collection, confirmed receipt and subsequent recovery evidence. Shared content. Actual removal and receiving evidence correspond to HLUC4-A7. Record each movement once and reference it where needed.","discussion":["Who records each item, and how can architects and engineers (SG1) avoid duplicate reporting?","How will product, component and location references remain consistent?","What evidence distinguishes a planned recovery destination from an actual receipt?","Which site updates pass to the logbook, and who checks them?"],"sg":["SG1","SG5","SG9","SG11","SG13","SG14"],"tool_codes":["CDT","t2.1","t2.2"],"iso_stage":"s5","exchanges":[{"id":"HLUC2-A4-E1","from":"Material suppliers and manufacturers (SG13)","to":"contractors (SG5), architects and engineers (SG1)","from_sg":["SG13"],"to_sg":["SG5","SG1"],"sg":["SG1","SG5","SG13"],"text":"Material suppliers and manufacturers (SG13) provide delivery records, product identification information, quantity details and supporting documents. Contractors (SG5) identify where the products have been installed, enabling architects and engineers (SG1) to link the delivered products to the building records.","bpmn":"Task: Record deliveries and installed products","tools":{"status":"documented","codes":["t2.1"],"text":"t2.1 tracks construction products and quantities and exports material passports."},"iso":{"from_roles":["appointed"],"to_roles":["lead","lead"],"from_label":"appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG5 contractors) and lead appointed party (SG1 architects and engineers)","lane":"appointed","stage":"s5"}},{"id":"HLUC2-A4-E2","from":"Contractors (SG5) and architects and engineers (SG1) responsible for site inspections","to":"architects and engineers (SG1) coordinating the design","from_sg":["SG5","SG1"],"to_sg":["SG1"],"sg":["SG1","SG5"],"text":"Contractors (SG5) report completed work, while contractors (SG5) and architects and engineers (SG1) responsible for inspections report findings, defects and corrections within their remit. Each record identifies the component, location and date. Architects and engineers (SG1) coordinating the design compare actual progress with the programme and refer changes requiring approval to Activity 2.","bpmn":"Task: Carry out and report site inspections","tools":{"status":"documented","codes":["CDT"],"text":"CDT supports mobile site observations, planned-versus-actual progress and quality issue reporting."},"iso":{"from_roles":["lead","lead"],"to_roles":["lead"],"from_label":"lead appointed party (SG5 contractors) and lead appointed party (SG1 architects and engineers)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A4-E3","from":"Contractors (SG5) and waste and recycling firms (SG14)","to":"architects and engineers (SG1)","from_sg":["SG5","SG14"],"to_sg":["SG1"],"sg":["SG1","SG5","SG14"],"text":"They provide the following information: actual removal quantities; collection dates; material condition; and available evidence of receipt at the destination. They also identify materials in storage and any destination or recovery outcome that remains unconfirmed.","bpmn":"Task: Record actual material removals and receipts","tools":{"status":"confirm","codes":["t2.1"],"text":"t2.1: confirm whether records cover actual destinations, receipt evidence and unresolved recovery status."},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG14 waste and recycling firms)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A4-E4","from":"Contractors (SG5), architects and engineers (SG1)","to":"IT providers and BIM integrators (SG11) and facility operators (SG9)","from_sg":["SG5","SG1"],"to_sg":["SG11","SG9"],"sg":["SG1","SG5","SG9","SG11"],"text":"Contractors (SG5) and architects and engineers (SG1) give IT providers and BIM integrators (SG11) and facility operators (SG9) access to the dated site records needed for model, asset and maintenance updates. Each record identifies the relevant component and supporting evidence. Activity 5 reconciles these maintained records; it does not start a second site-recording exercise.","bpmn":"Task: Make site records available for updates","tools":{"status":"documented","codes":["t2.2","CDT"],"text":"t2.2 integrates as-built changes, commissioning data and maintenance requirements; CDT supplies validated logbook updates."},"iso":{"from_roles":["lead","lead"],"to_roles":["appointed","appointing"],"from_label":"lead appointed party (SG5 contractors) and lead appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators) and appointing party (SG9 facility operators)","lane":"lead","stage":"s5"}}]},{"id":"HLUC2-A5","num":5,"name":"Update and check the records of what was actually built","purpose":"Differences between the completed work and the building records can lead to incorrect maintenance decisions and unreliable material information, which is why it is important to keep these records up to date. This activity helps to prevent these issues by ensuring that the model and supporting records accurately reflect what has been installed, retained, removed or replaced.","when":"Architects and engineers (SG1) use the site records collected in Activity 4 to update and verify the building information as the work progresses. Any discrepancies are resolved before the handover package is assembled in Activity 6.","participants":"Contractors (SG5) are responsible for providing installation, removal and commissioning records. Material suppliers and manufacturers (SG13) provide product information and correct any missing or inconsistent details. Architects and engineers (SG1) then reconcile these records with the approved design and site findings. IT providers and BIM integrators (SG11) then update and check the model. Facility operators (SG9) clarify the information required for operation and maintenance purposes.","outcome":"Architects and engineers (SG1) have an updated model, as well as component-linked asset and material records, all of which reflect the completed work. These records include test results, supporting evidence, and clearly identified gaps. Each unresolved issue specifies the affected information, who is responsible for correcting it, and the implications for the intended use.","needs_text":"N6 Material tracking and continuity of records; N7 Usable information handover between lifecycle stages; N10 Information quality for the next activity.","needs":["N6","N7","N10"],"checks":"Architects and engineers (SG1) reconcile records with site evidence. IT providers and BIM integrators (SG11) check the specified model requirements. Contractors (SG5), material suppliers and manufacturers (SG13) and appointed model authors correct assigned issues. Passing an IFC check does not establish physical installation or acceptance of handover.","discussion":["Who reconciles site findings, material passports and model components?","What evidence is needed to confirm installation, removal and commissioning information?","Who corrects discrepancies, and who checks the corrections?","Which unresolved issues could prevent the records from being used for operation or maintenance?"],"sg":["SG1","SG5","SG9","SG11","SG13"],"tool_codes":["CDT","t2.1","t2.2","t5.1"],"iso_stage":"s5","exchanges":[{"id":"HLUC2-A5-E1","from":"Contractors (SG5) and material suppliers and manufacturers (SG13)","to":"architects and engineers (SG1) and IT providers and BIM integrators (SG11)","from_sg":["SG5","SG13"],"to_sg":["SG1","SG11"],"sg":["SG1","SG5","SG11","SG13"],"text":"Contractors (SG5) and material suppliers and manufacturers (SG13) make the site records from Activity 4 available to architects and engineers (SG1) and IT providers and BIM integrators (SG11). Contractors (SG5) identify installation locations, quantities, removals, approved substitutions and commissioning results. Material suppliers and manufacturers (SG13) supply corresponding product documents. They add missing evidence or corrections without resubmitting unchanged records.","bpmn":"Task: Supply missing or revised as-built evidence","tools":{"status":"documented","codes":["t2.1","CDT"],"text":"t2.1 supplies material passports and quantities; CDT supplies quality records and validated logbook updates."},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A5-E2","from":"Architects and engineers (SG1)","to":"IT providers and BIM integrators (SG11)","from_sg":["SG1"],"to_sg":["SG11"],"sg":["SG1","SG11"],"text":"After comparing site evidence, product information and approved changes, architects and engineers (SG1) identify the model and record updates needed. IT providers and BIM integrators (SG11) then update the affected components and links. Information that has not been verified is identified as such rather than being treated as confirmed.","bpmn":"Task: Reconcile evidence and update records","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 integrates as-built changes and supporting documentation."},"iso":{"from_roles":["lead"],"to_roles":["appointed"],"from_label":"lead appointed party (SG1 architects and engineers)","to_label":"appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A5-E3","from":"IT providers and BIM integrators (SG11)","to":"architects and engineers (SG1) and facility operators (SG9)","from_sg":["SG11"],"to_sg":["SG1","SG9"],"sg":["SG1","SG9","SG11"],"text":"IT providers and BIM integrators (SG11) will provide an updated model and the results of checks against the information requirements agreed in Activity 1. Architects and engineers (SG1) then review the consistency of this information with the site evidence. Facility operators (SG9) identify any gaps that could affect operation or maintenance.","bpmn":"Task: Check the updated model and supporting records","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 checks defined IFC requirements and produces validation results and BCF issues."},"iso":{"from_roles":["appointed"],"to_roles":["lead","appointing"],"from_label":"appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG1 architects and engineers) and appointing party (SG9 facility operators)","lane":"appointed","stage":"s5"}},{"id":"HLUC2-A5-E4","from":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"The contractors (SG5), material suppliers and manufacturers (SG13) or model authors responsible for each issue","from_sg":["SG1","SG11"],"to_sg":["SG5","SG13"],"sg":["SG1","SG5","SG11","SG13"],"text":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11) identify discrepancies and request corrections from the contractors (SG5), material suppliers and manufacturers (SG13) or appointed model authors responsible for the affected information. Each organisation supplies the correction or explains what remains unknown. IT providers and BIM integrators (SG11) repeat the affected model checks.","bpmn":"Task: Correct discrepancies and repeat affected checks","tools":{"status":"documented","codes":["t5.1"],"text":"t5.1 supports correction guidance and repeating affected model checks."},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead","appointed"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers)","lane":"lead","stage":"s5"}},{"id":"HLUC2-A5-E5","from":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"architects and engineers (SG1) coordinating handover","from_sg":["SG1","SG11"],"to_sg":["SG1"],"sg":["SG1","SG11"],"text":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11) identify the checked model, component-linked asset and material records, documents and check results for the handover coordinator. They retain current versions and unresolved issues for the facility operators (SG9) review in Activity 6. Unchanged records remain in the maintained information set.","bpmn":"Task: Identify checked records for handover","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 supplies validated COBie, federated IFC and technical documentation for handover."},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG1 architects and engineers)","lane":"lead","stage":"s5"}}]},{"id":"HLUC2-A6","num":6,"name":"Assemble the handover information and review it with facility operators","purpose":"Facility operators (SG9) need access to information that they can use to operate and maintain the renovated building. Reviewing the checked records with the facility operators (SG9) helps to identify missing documents, conflicting versions and unusable data before handover.","when":"This activity uses the updated and checked records from Activity 5. Before handover, architects and engineers (SG1) assemble the package and coordinate responses to facility operators (SG9)’ review comments. Facility operators (SG9) report the review outcome. Building owners (SG4), or facility operators (SG9) acting with their authority, decide acceptance in Activity 7.","participants":"Architects and engineers (SG1) coordinate the package. Contractors (SG5) provide commissioning results and maintenance documents, and material suppliers and manufacturers (SG13) provide product information and manuals. IT providers and BIM integrators (SG11) organise the model and linked records. Facility operators (SG9) then review this information against their operational needs. IT providers and BIM integrators (SG11) support the transfer of information into the agreed operational systems. The building owners (SG4) assist with resolving any queries regarding the agreed handover requirements.","outcome":"Architects and engineers (SG1) have a retrievable handover package containing the current model, asset and material records, technical documents, commissioning results, maintenance requirements and check reports. The facility operators (SG9) have reviewed its completeness and usability. The review record details any corrections made and unresolved issues for the acceptance decision in Activity 7, along with assigned responsibilities.","needs_text":"N7 Usable information handover between lifecycle stages; N10 Information quality for the next activity; N12 Traceable evidence for compliance and assessment requirements; N13 Guidance for consistent information exchange.","needs":["N7","N10","N12","N13"],"checks":"Facility operators (SG9) test whether the package can be found, opened and used in their operational systems. IT providers and BIM integrators (SG11) assist with transfer problems. Named contractors (SG5), material suppliers and manufacturers (SG13), architects and engineers (SG1) or IT providers and BIM integrators (SG11) correct assigned issues. This review prepares the decision in Activity 7.","discussion":["Can the facility operators (SG9) find the required information and use it in the agreed operational systems?","Which model, asset records and documents are the current versions?","Do the supporting documents link clearly to the relevant components and requirements?","Who corrects review issues, and which unresolved issues could prevent acceptance?"],"sg":["SG1","SG4","SG5","SG9","SG11","SG13"],"tool_codes":["t2.2"],"iso_stage":"s6","exchanges":[{"id":"HLUC2-A6-E1","from":"Contractors (SG5) and material suppliers and manufacturers (SG13)","to":"architects and engineers (SG1) and IT providers and BIM integrators (SG11)","from_sg":["SG5","SG13"],"to_sg":["SG1","SG11"],"sg":["SG1","SG5","SG11","SG13"],"text":"Contractors (SG5) and material suppliers and manufacturers (SG13) provide any additional commissioning results, manuals and maintenance documents required for handover. Architects and engineers (SG1) and IT providers and BIM integrators (SG11) reuse the records checked in Activity 5 and request only missing items or updates against the requirements agreed in Activity 1.","bpmn":"Task: Supply additional handover documents","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 collects model information, commissioning records and maintenance documentation."},"iso":{"from_roles":["lead","appointed"],"to_roles":["lead","appointed"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers)","to_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","lane":"lead","stage":"s6"}},{"id":"HLUC2-A6-E2","from":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11)","to":"facility operators (SG9) and building owners (SG4)","from_sg":["SG1","SG11"],"to_sg":["SG9","SG4"],"sg":["SG1","SG4","SG9","SG11"],"text":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11) provide building owners (SG4) and facility operators (SG9) with the assembled package and an index identifying current files and versions. Model components and asset records link to product, material and maintenance documents. Check reports and unresolved issues accompany the package so building owners (SG4) and facility operators (SG9) can identify its status.","bpmn":"Task: Assemble and issue the package for review","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 produces COBie, federated IFC and structured technical documentation for FM."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing","appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG9 facility operators) and appointing party (SG4 building owners)","lane":"lead","stage":"s6"}},{"id":"HLUC2-A6-E3","from":"Facility operators (SG9), supported by IT providers and BIM integrators (SG11)","to":"architects and engineers (SG1) and contractors (SG5)","from_sg":["SG9","SG11"],"to_sg":["SG1","SG5"],"sg":["SG1","SG5","SG9","SG11"],"text":"Facility operators (SG9) check whether they can find the required asset information, open the supporting documents and use the agreed data in their operational systems. They report missing information, broken links, conflicting versions and transfer problems, identifying the affected records and the corrections needed.","bpmn":"Task: Test information access and operational usability","tools":{"status":"confirm","codes":["t2.2"],"text":"t2.2: confirm how files transfer into the chosen operational systems and which fields require mapping or manual entry."},"iso":{"from_roles":["appointing","appointed"],"to_roles":["lead","lead"],"from_label":"appointing party (SG9 facility operators) and appointed party (SG11 IT providers and BIM integrators)","to_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"appointing","stage":"s6"}},{"id":"HLUC2-A6-E4","from":"Contractors (SG5), material suppliers and manufacturers (SG13), architects and engineers (SG1) and IT providers and BIM integrators (SG11) responsible for review issues","to":"facility operators (SG9)","from_sg":["SG5","SG13","SG1","SG11"],"to_sg":["SG9"],"sg":["SG1","SG5","SG9","SG11","SG13"],"text":"The contractors (SG5), material suppliers and manufacturers (SG13), architects and engineers (SG1) or IT providers and BIM integrators (SG11) assigned to each issue provide the correction or explain the remaining limitation. Architects and engineers (SG1) coordinate the revised package, and facility operators (SG9) review the affected information again. Remaining actions pass to the acceptance decision in Activity 7.","bpmn":"Task: Correct the package and repeat the affected review","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 supports collecting, validating and delivering revised information."},"iso":{"from_roles":["lead","appointed","lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG5 contractors) and appointed party (SG13 material suppliers and manufacturers) and lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG9 facility operators)","lane":"lead","stage":"s6"}}]},{"id":"HLUC2-A7","num":7,"name":"Confirm acceptance of the handover information and responsibility for future updates","purpose":"A reviewed handover package is still required to have a clear acceptance decision and named individuals responsible for keeping it up to date. This ensures that information gaps and unclear responsibilities are not carried over into the operational phase without agreement.","when":"This activity follows the facility operators’ (SG9) review in Activity 6. If information still requires correction, architects and engineers (SG1) record whether it prevents acceptance or can remain as an agreed outstanding action.","participants":"Facility operators (SG9) report whether the reviewed information supports the agreed operational uses. Building owners (SG4), or facility operators (SG9) acting with their authority, confirm acceptance. Architects and engineers (SG1), contractors (SG5) and material suppliers and manufacturers (SG13) address outstanding issues within their remit. IT providers and BIM integrators (SG11) support the accepted information transfer and agreed update arrangements.","outcome":"Architects and engineers (SG1) have an acceptance record that identifies the handover package and the versions that are covered by the decision. It also records any accepted limitations, outstanding actions, the people responsible and the agreed completion dates. The building owners (SG4) and facility operators (SG9) also agree on who will be responsible for maintaining the model, asset and material records, supporting documents and system links during operation.","needs_text":"N7 Usable information handover between lifecycle stages; N11 Coordination responsibilities and decision records; N13 Guidance for consistent information exchange.","needs":["N7","N11","N13"],"checks":"Building owners (SG4), or facility operators (SG9) acting with their authority, make the acceptance decision. Gateway: Package accepted? Accept, accept with stated actions, or return for correction in Activity 6. The acceptance record identifies versions, limitations, action owners and dates. Operation uses this same information set. Shared content. The accepted information set passes to HLUC3-A1. Later information changes follow the agreed update responsibilities.","discussion":["Who has authority to accept the information handover?","Which unresolved issues prevent acceptance, and which can remain as agreed actions?","Who maintains each model, asset record, material record and supporting document during operation?","How will later corrections and updates reach everyone using the information?"],"sg":["SG1","SG4","SG5","SG9","SG11"],"tool_codes":["t2.2"],"iso_stage":"s6","exchanges":[{"id":"HLUC2-A7-E1","from":"Facility operators (SG9)","to":"building owners (SG4)","from_sg":["SG9"],"to_sg":["SG4"],"sg":["SG4","SG9"],"text":"Facility operators (SG9) report on the outcome of the Activity 6 review. They identify the package that was reviewed, whether it is suitable for the agreed operational uses and any remaining gaps or limitations. They also explain which issues require correction before acceptance, and which could remain as outstanding actions as agreed.","bpmn":"Task: Report the operator review outcome","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing"],"to_roles":["appointing"],"from_label":"appointing party (SG9 facility operators)","to_label":"appointing party (SG4 building owners)","lane":"appointing","stage":"s6"}},{"id":"HLUC2-A7-E2","from":"Building owners (SG4), or facility operators (SG9) acting with the building owners’ (SG4) authority","to":"architects and engineers (SG1) and contractors (SG5)","from_sg":["SG4","SG9","SG4"],"to_sg":["SG1","SG5"],"sg":["SG1","SG4","SG5","SG9"],"text":"The authorised person records either acceptance, acceptance with stated outstanding actions, or a request for further corrections before acceptance. The decision identifies the package version, the reasons for acceptance or rejection, and the conditions and actions required. Any corrections are returned to the relevant review in Activity 6.","bpmn":"Task: Decide whether to accept the package","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","appointing","appointing"],"to_roles":["lead","lead"],"from_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators) and appointing party (SG4 building owners)","to_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors)","lane":"appointing","stage":"s6"}},{"id":"HLUC2-A7-E3","from":"Building owners (SG4) and facility operators (SG9)","to":"architects and engineers (SG1), contractors (SG5), IT providers and BIM integrators (SG11), according to their agreed responsibilities","from_sg":["SG4","SG9"],"to_sg":["SG1","SG5","SG11"],"sg":["SG1","SG4","SG5","SG9","SG11"],"text":"Building owners (SG4) and facility operators (SG9) confirm the named contractors (SG5), material suppliers and manufacturers (SG13), architects and engineers (SG1) and IT providers and BIM integrators (SG11) responsible for outstanding corrections. They agree who maintains each information type during operation, when updates are required and who checks them. Each named organisation confirms its assigned actions and how revised information becomes the current record.","bpmn":"Task: Agree outstanding actions and future updates","tools":{"status":"none","codes":[],"text":""},"iso":{"from_roles":["appointing","appointing"],"to_roles":["lead","lead","appointed"],"from_label":"appointing party (SG4 building owners) and appointing party (SG9 facility operators)","to_label":"lead appointed party (SG1 architects and engineers) and lead appointed party (SG5 contractors) and appointed party (SG11 IT providers and BIM integrators)","lane":"appointing","stage":"s6"}},{"id":"HLUC2-A7-E4","from":"Architects and engineers (SG1), IT providers and BIM integrators (SG11)","to":"facility operators (SG9)","from_sg":["SG1","SG11"],"to_sg":["SG9"],"sg":["SG1","SG9","SG11"],"text":"Architects and engineers (SG1) and IT providers and BIM integrators (SG11) provide facility operators (SG9) with access to the accepted package, acceptance record and outstanding-action list. Facility operators (SG9) identify the information forming the basis of operation, its limitations and the named organisations responsible for subsequent corrections or updates. HLUC3-A1 uses this same accepted information set.","bpmn":"Task: Provide access to the accepted package","tools":{"status":"documented","codes":["t2.2"],"text":"t2.2 delivers as-built information for FM, including validated COBie, federated IFC and documentation."},"iso":{"from_roles":["lead","appointed"],"to_roles":["appointing"],"from_label":"lead appointed party (SG1 architects and engineers) and appointed party (SG11 IT providers and BIM integrators)","to_label":"appointing party (SG9 facility operators)","lane":"lead","stage":"s6"}}]}]},{"id":"HLUC3","num":3,"name":"Monitor building performance and manage maintenance","reviewers":[{"code":"LIS","name":"LIS","country":""},{"code":"ICCS","name":"ICCS","country":"Greece"}],"phase":"Operation phase","phase_short":"Operation","purpose":"This high-level use case helps the facility operators (SG9) to optimise energy use and maintain satisfactory indoor conditions in the renovated building. Operating data and maintenance records enable the facility operators (SG9) to identify issues and determine appropriate action.","basis":"Survey respondents reported weak connections between BIM, energy data and facility management. Of those who answered the detailed facility management questions, a small group identified maintenance and integration with digital models as areas for improvement. The literature review also highlights poor handover practices from the construction stage, as well as difficulties in maintaining up-to-date building and maintenance records.","start":"Facility operators (SG9) use the accepted handover information from HLUC2. Where the building lacks a usable handover package or monitoring sources, building owners (SG4) and facility operators (SG9) first agree the necessary records, surveys or monitoring preparation.","scope":"The facility operators (SG9) are responsible for monitoring performance, investigating problems, arranging operating adjustments or maintenance, and checking the results. Facility operators (SG9) keep the equipment and maintenance records up to date. These activities are repeated during operation; planning a new renovation returns to HLUC1.","participants":"The facility operators (SG9) are responsible for daily operations and maintenance. Energy consultants (SG7) interpret performance results, and energy utility companies and ESCOs (SG8) contribute data and advice as required
